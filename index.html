  .imp-line1 { display: flex; align-items: center; gap: 7px; }
  .imp-line2 { display: flex; align-items: center; gap: 7px; padding-left: 22px; }
  .imp-name { flex: 1; min-width: 0; font-size: var(--fs-sm); color: var(--text); padding: 4px 8px; border: 1px solid transparent; border-radius: var(--r-xs); background: transparent; }
  .imp-name:hover { border-color: var(--border); background: var(--surface); }
  .imp-name:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); background: var(--surface); }
  .imp-row select, .imp-row input[type="date"] { flex: none; width: auto; padding: 3px 22px 3px 6px; font-size: var(--fs-xs); border-radius: var(--r-xs); cursor: pointer; }
  .imp-row select { background-position: right 7px center; background-size: 9px 9px; }
  .imp-row select:focus, .imp-row input[type="date"]:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .imp-dlabel { flex: none; font-size: var(--fs-2xs); color: var(--text-soft); }
  .imp-opts { display: flex; flex-direction: column; gap: 6px; margin: -2px 0 12px; }
  .imp-top { display: flex; align-items: flex-start; gap: 7px; font-size: var(--fs-xs); color: var(--text-2); cursor: pointer; user-select: none; line-height: var(--lh-base);
  }
  .imp-tip { font-size: var(--fs-xs); color: var(--text-soft); margin: -4px 0 12px; line-height: var(--lh-relaxed); }
  .imp-tip b { color: var(--text-2); }
  /* 每行的「所属阶段」：下拉直接选已有阶段，或选「＋ 自定义…」后用输入框输入新阶段 */
  .imp-row .imp-sel-line-pick { flex: 0 1 132px; min-width: 96px; font-family: var(--font); color: var(--text-2); }
  .imp-sel-line {
    flex: 0 1 132px; min-width: 96px; font-family: var(--font); font-size: var(--fs-xs);
    color: var(--text-2); padding: 3px 6px; border-radius: var(--r-xs);
  }
  .imp-sel-line:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }

  /* 备份设置面板：拖拽区 + 存储位置信息 */
  /* 面板做成定高的弹性列：固定部分尽量薄，中间拖拽区吃掉约七成高度 */
  .modal.bk-modal { display: flex; flex-direction: column; height: min(480px, 74vh); padding: 14px; }
  .modal.bk-modal > h2,
  .modal.bk-modal > .sub,
  .modal.bk-modal > .bk-store,
  .modal.bk-modal > .modal-actions { flex: none; }
  .modal.bk-modal > .sub { margin-bottom: 8px; }
  .modal.bk-modal > .modal-actions { margin-top: 8px; padding-top: 8px; }
  .modal.bk-modal > .bk-up { flex: 1 1 auto; }
  /* ============ Aceternity「File Upload」复刻：备份恢复区 ============
     网格底纹 + 居中图标卡；悬停时图标卡向右上浮起、下方虚线描边卡淡入；
     拖入时图标卡显示「松开即可恢复」。恢复流程本身沿用原来的逻辑。 */
  .bk-up {
    position: relative; display: flex; align-items: center; justify-content: center;
    min-height: 150px; padding: 20px; margin-bottom: 8px; cursor: pointer; overflow: hidden;
    border-radius: var(--r-lg); background: var(--surface-2);
    transition: background var(--dur-2) var(--ease);
  }
  .bk-up.is-over { background: var(--accent-soft); }
  .bk-up:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-ring); }
  /* 网格底纹：只画格线，再用径向遮罩让它从中心向外淡出（对应原组件那 41×11 格底图） */
  .bk-up-grid {
    position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(to right, var(--border-strong) 1px, transparent 1px),
      linear-gradient(to bottom, var(--border-strong) 1px, transparent 1px);
    background-size: 34px 34px;
    -webkit-mask-image: radial-gradient(ellipse at center, #000 8%, transparent 78%);
    mask-image: radial-gradient(ellipse at center, #000 8%, transparent 78%);
  }
  .bk-up-inner { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .bk-up-title { font-size: var(--fs-base); font-weight: var(--fw-bold); color: var(--text-2); }
  .bk-up-hint { margin-top: 5px; font-size: var(--fs-xs); color: var(--text-soft); line-height: var(--lh-base); }
  .bk-up-stack { position: relative; width: 104px; height: 104px; margin-top: 34px; }
  .bk-up-card {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    border-radius: var(--r-md); background: var(--surface); color: var(--text-2);
    box-shadow: var(--sh-3);
    transition: transform .26s var(--ease-out), opacity .26s var(--ease-out), box-shadow .26s var(--ease-out), color .26s var(--ease-out);
  }
  .bk-up-card .bi { font-size: 20px; }
  .bk-up-drop { display: none; font-size: var(--fs-2xs); font-weight: 700; color: var(--accent); }
  .bk-up:hover .bk-up-card, .bk-up.is-over .bk-up-card {
    transform: translate(20px, -20px); opacity: .92; box-shadow: var(--sh-4);
  }
  .bk-up.is-over .bk-up-card { color: var(--accent); }
  .bk-up.is-over .bk-up-drop { display: block; }
  /* 悬停 / 拖入时才出现的虚线描边卡（原组件里那张 sky-400 的次级卡片） */
  .bk-up-outline {
    position: absolute; inset: 0; border: 1.5px dashed var(--accent-border); border-radius: var(--r-md);
    opacity: 0; transition: opacity .26s var(--ease-out);
  }
  .bk-up:hover .bk-up-outline, .bk-up.is-over .bk-up-outline { opacity: 1; }
  .bk-store {
    display: flex; flex-direction: column; gap: 2px; padding: 5px 10px;
    border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface-2);
  }
  .bk-store-row { display: flex; align-items: baseline; gap: 8px; font-size: var(--fs-2xs); color: var(--text-soft); }
  .bk-store-row b { color: var(--text-2); font-weight: 600; font-family: var(--font-num); word-break: break-all; }

  /* toast：常驻提示层（带 aria-live），单条为其中一行 */
  .toast-layer {
    position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: var(--sp-3);
    z-index: 99; pointer-events: none;
  }
  .toast {
    display: flex; align-items: center; gap: 9px;
    background: var(--toast-bg); color: var(--toast-fg); padding: 11px 20px; border-radius: var(--r-lg); font-size: var(--fs-base);
    box-shadow: var(--sh-4);
    animation: toast-in var(--dur-3) var(--ease-out);
  }
  .toast .bi { color: var(--toast-ok); font-size: var(--fs-lg); }
  .toast.toast-alert .bi { color: var(--danger); }
  .toast.toast-out { opacity: 0; transform: translateY(8px); transition: opacity var(--dur-3) ease, transform var(--dur-3) ease; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(12px) scale(.96); } }

  /* responsive */
  @media (max-width: 1400px) {
    .wrap { max-width: 100%; }
  }
  @media (max-width: 1240px) {
    .cal-side { display: none; }
    /* 这一档宽度下三组会换行，竖线留在行尾显得突兀，直接收起并把间距交回行间距 */
    .panel-filter .filter-group:not(:last-child)::after { display: none; }
    .panel-filter .filter-row { gap: 8px 18px; }
  }
  @media (max-width: 1080px) {
    .title-row { grid-template-columns: 1fr; }
  }
  @media (max-width: 860px) {
    .shell { flex-direction: column; }
    /* 窄屏：搜索框先收第一档，再在 720px 收第二档 */
    .halo { width: 250px; }
    /* 窄屏：顶栏左端那一格保持 64px（头像方块占满），药丸从它右侧开始 */
    .topbar-shell { gap: 10px; }
    /* 窄屏：三段改为自然宽度、允许换行；搜索用自动外边距居中（换行时独占一行居中） */
    .tb-left, .tb-right { flex: 0 1 auto; }
    .halo { margin: 0 auto; }
    /* 侧栏本体在窄屏塌成 0 高：真正露出的界面是那个全屏抽屉，汉堡入口挪进顶栏 */
    .sidebar { width: 100%; height: 0; min-height: 0; position: static; z-index: auto; animation: none; }
    .side-burger {
      display: grid; place-items: center; width: 38px; height: 38px; flex: none;
      border: none; border-radius: var(--r-md); background: transparent;
      color: var(--text-2); font-size: 19px; cursor: pointer;
      transition: background var(--dur-2) var(--ease), color var(--dur-2) var(--ease);
    }
    .side-burger:hover { background: var(--nav-hover); color: var(--text); }
    /* 窄屏顶栏左侧多了汉堡键：收紧项目名内边距 */
    .topbar .identity { padding: 6px 8px; }
    /* 卡片改成从左侧滑入的全屏抽屉，盖满整个视口 */
    .side-card {
      position: fixed; inset: 0; width: auto; height: auto;
      padding: 64px 22px 24px; overflow-y: auto;
      border: none; border-radius: 0; box-shadow: none;
      transform: translateX(-100%); visibility: hidden;
      transition: transform var(--dur-3) var(--ease-in-out), visibility 0s linear var(--dur-3);
      z-index: 100;
    }
    .sidebar.is-open .side-card {
      transform: none; visibility: visible;
      transition: transform var(--dur-3) var(--ease-in-out), visibility 0s;
    }
    /* 抽屉里的文案一律常显 */
    .side-card .lbl { opacity: 1; transform: none; }
    .drawer-x {
      display: grid; place-items: center;
      position: absolute; right: 14px; top: 14px; width: 40px; height: 40px;
      border: none; border-radius: var(--r-md); background: transparent;
      color: var(--text-2); font-size: 18px; cursor: pointer;
    }
    .drawer-x:hover { background: var(--surface-2); color: var(--text); }
    .tab, .side-btn { padding: 12px 12px; font-size: var(--fs-base); margin-bottom: 4px; }
    .tab.active::before, .side-btn.active::before { top: 11px; bottom: 11px; }
    .topbar { gap: 10px; }
    /* 窄屏：大面板从三列收成一列 */
    .mega { grid-template-columns: 1fr; max-height: min(64vh, 460px); }
    .mega-col + .mega-col { border-left: none; border-top: 1px solid var(--border); }
    .board { grid-auto-columns: minmax(272px, 86vw); }
  }
  @media (max-width: 720px) {
    body { padding: 16px 12px 48px; }
    .topbar { padding: 0 12px 0 14px; }
    .topbar .identity h1 { font-size: var(--fs-lg); }
    .mega { top: calc(100% + 10px); }
    .cal-card { flex-direction: column; width: 100%; }
    .cal-side { display: flex; border-left: none; border-top: 1px solid var(--border); padding-left: 0; padding-top: 10px; width: 100%; }
    .cs-list { max-height: 130px; }
    .ring-card { flex-direction: column; gap: 14px; }
    .ring-meta { width: 100%; }
    .panel { padding: 10px 12px; }
    /* 窄屏：收紧组间距；轨道内允许换行，避免横向溢出 */
    .panel-filter { gap: 8px 12px; padding: 10px 12px; }
    .seg { flex-wrap: wrap; border-radius: var(--r-lg); }
    .seg-btn { padding: 4px 9px; }
    /* 窄屏：搜索框收一档，仍能落在一行内 */
    .halo { width: 200px; }
    .btn { padding: 8px 13px; font-size: var(--fs-sm); }
    .modal { padding: 22px 18px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important; animation-iteration-count: 1 !important;
      transition-duration: .01ms !important; scroll-behavior: auto !important;
    }
  }

  /* ============================================================
     GLASS SKIN · 半透明玻璃拟态（磨砂）
     背景为固定的多层柔和光斑；主要承载面板与浮层统一以 backdrop-filter 模糊其后内容，
     配合半透明底 + 1px 高光描边 + 柔和投影形成玻璃质感。放在样式表末尾，覆盖上面的平面材质。
     backdrop-filter 落在「最外层可见承载面」上（容器模糊，其内卡片自然继承模糊后的背景），
     既保证磨砂观感，又避免逐张卡片重复开启滤镜带来的性能开销。
     ============================================================ */
  :where(.topbar, .side-card, .panels, .card, .col,
         .cal-card, .ring-card, .memo-card, .cd-box,
         .mega, .dsel-pop, .modal, .toast) {
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    backdrop-filter: blur(18px) saturate(160%);
  }
  /* 展开的三列大面板 / 自定义下拉 / 弹窗 / 提示：模糊更强，保证其后内容不透形 */
  :where(.mega, .dsel-pop, .modal, .toast) {
    -webkit-backdrop-filter: blur(26px) saturate(170%);
    backdrop-filter: blur(26px) saturate(170%);
  }
  /* 遮罩层：加深压暗 + 更强模糊，把视线收拢到弹窗上 */
  .overlay {
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
  }
</style>
</head>
<body>

<!-- 1 · 顶部：Aceternity「Navbar Dark Shadow」风格浮动导航条（sticky 在视口顶部） -->
<div class="topbar-shell">
  <!-- 左：Origin UI comp-126 头像上传，单独占住顶栏左端、左侧导航轨正上方那一格 -->
  <div class="tb-corner">
    <div class="avatar-up" id="avatar-up">
      <button type="button" class="avatar-btn" id="avatar-btn" aria-label="上传头像">
        <img class="avatar-img" id="avatar-img" alt="已上传头像预览" hidden />
        <span class="avatar-ph" id="avatar-ph" aria-hidden="true"><i class="bi bi-upload"></i></span>
      </button>
      <input type="file" id="avatar-file" class="hidden" accept="image/*" aria-label="上传头像文件" />
      <div class="sr-only" id="avatar-status" aria-live="polite" role="status">未上传图片</div>
    </div>
  </div>
<div class="topbar">
  <!-- 左：项目名（「项目」大面板入口）+ 窄屏汉堡，因此落在药丸最左端 -->
  <div class="tb-left">
    <!-- 窄屏：侧栏收进抽屉后，改由这里进入（桌面端不显示） -->
    <button type="button" class="side-burger" id="side-burger"
            aria-label="打开导航菜单" aria-expanded="false" aria-controls="side-card">
      <i class="bi bi-list" aria-hidden="true"></i>
    </button>
    <!-- 项目名即「项目」大面板入口 -->
    <div class="nav-drop" id="proj-drop">
      <div class="identity" id="proj-trigger" role="button" tabindex="0"
           aria-expanded="false" aria-controls="proj-mega" aria-haspopup="true">
        <h1 id="page-title">进度看板</h1>
      </div>
      <div class="mega" id="proj-mega" aria-label="项目">
        <div class="mega-col">
          <div class="mega-cap">切换项目</div>
          <div id="mega-projects"></div>
        </div>
        <div class="mega-col">
          <div class="mega-cap">任务排序</div>
          <div class="mega-seg" id="mega-sort">
            <button type="button" data-sort="default" data-tip="按拖动调整的手动顺序">默认顺序</button>
            <button type="button" data-sort="date-asc" data-tip="按截止时间从早到晚">截止早→晚</button>
            <button type="button" data-sort="date-desc" data-tip="按截止时间从晚到早">截止晚→早</button>
          </div>
          <div class="mega-cap" style="padding-top:12px">项目操作</div>
          <div class="mega-acts">
            <button type="button" class="mega-act" id="mega-new" data-tip="新建项目" aria-label="新建项目">
              <i class="bi bi-plus-lg" aria-hidden="true"></i><span>新建项目</span>
            </button>
            <button type="button" class="mega-act" id="mega-rename" data-tip="重命名项目" aria-label="重命名项目">
              <i class="bi bi-pencil" aria-hidden="true"></i><span>重命名项目</span>
            </button>
            <button type="button" class="mega-act" id="mega-del" data-tip="删除项目" aria-label="删除项目">
              <i class="bi bi-trash3" aria-hidden="true"></i><span>删除项目</span>
            </button>
          </div>
        </div>
        <div class="mega-col">
          <div class="mega-cap">当前项目</div>
          <div class="mega-card" id="mega-card"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 中：搜索：Cult UI「Halo Search」复刻（流动渐变光晕 + 逐字提示 + 清空模糊消散） -->
  <div class="halo" id="halo-search">
    <!-- 光晕层：整块裁成药丸形状，三团模糊色块只在底部半区来回流动 -->
    <div class="halo-glow" aria-hidden="true">
      <div class="halo-glow-half">
        <span class="halo-blob b1"></span>
        <span class="halo-blob b2"></span>
        <span class="halo-blob b3"></span>
      </div>
    </div>
    <!-- 药丸本体：不透明底 + 1px 描边，光晕只从里衬那一圈透出来 -->
    <div class="halo-field">
      <i class="bi bi-search halo-lead" aria-hidden="true"></i>
      <div class="halo-text">
        <input id="search" class="halo-input" type="search" aria-label="搜索任务名称" autocomplete="off" />
        <!-- 提示文案：逐字错峰淡入 -->
        <div class="halo-ph" aria-hidden="true"></div>
        <!-- 清空替身：被删掉的字从右到左逐字模糊消散 -->
        <div class="halo-ghost" aria-hidden="true" hidden></div>
      </div>
      <!-- 清除钮：固定占位，仅在有内容时出现 -->
      <div class="halo-stat" hidden>
        <button type="button" class="halo-clear" aria-label="清除搜索">
          <i class="bi bi-x-lg" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- 右：明暗切换，Origin UI comp-183「Labeled Switch」复刻（左月亮 / 右太阳，滑块在左右两格间平移） -->
  <div class="tb-right">
    <button type="button" class="theme-sw" id="btn-theme" role="switch" aria-checked="false"
            data-tip="切换明暗模式" aria-label="切换明暗模式">
      <span class="theme-sw-thumb" aria-hidden="true"></span>
      <span class="theme-sw-slot theme-sw-moon" aria-hidden="true"><i class="bi bi-moon-stars"></i></span>
      <span class="theme-sw-slot theme-sw-sun" aria-hidden="true"><i class="bi bi-sun"></i></span>
    </button>
  </div>
</div>
</div>

<div class="shell">

  <!-- 0 · 左侧：视图切换（Aceternity「Sidebar」风格图标轨，悬停展开为浮层） -->
  <aside class="sidebar" id="sidebar">

    <div class="side-card" id="side-card">
      <!-- 窄屏抽屉的关闭键（桌面端不显示） -->
      <button type="button" class="drawer-x" id="drawer-x" aria-label="关闭导航菜单">
        <i class="bi bi-x-lg" aria-hidden="true"></i>
      </button>

      <div class="side-nav" role="tablist" aria-label="视图">
      <button type="button" class="tab active" data-view="table" aria-current="page">
        <span class="ico"><i class="bi bi-list-ul" aria-hidden="true"></i></span>
        <span class="lbl">任务列表</span>
      </button>
      <button type="button" class="tab" data-view="board">
        <span class="ico"><i class="bi bi-kanban" aria-hidden="true"></i></span>
        <span class="lbl">看板视图</span>
      </button>
      <button type="button" class="tab" data-view="timeline">
        <span class="ico"><i class="bi bi-clock-history" aria-hidden="true"></i></span>
        <span class="lbl">时间轴</span>
      </button>
      </div>
      <div class="side-sep"></div>
      <button type="button" class="side-btn" id="btn-import">
        <span class="ico"><i class="bi bi-download" aria-hidden="true"></i></span>
        <span class="lbl">导入任务</span>
      </button>
      <button type="button" class="side-btn" id="btn-backup-setup">
        <span class="ico"><i class="bi bi-database" aria-hidden="true"></i></span>
        <span class="lbl">备份设置</span>
      </button>
      <button type="button" class="side-btn" id="btn-help" data-tip="数据保存在本机 · 安装到桌面 · 常用操作">
        <span class="ico"><i class="bi bi-question-circle" aria-hidden="true"></i></span>
        <span class="lbl">使用说明</span>
      </button>
    </div>
  </aside>

  <div class="wrap">

    <!-- 2 · 日历 + 可交互圆形进度（同一行各占一半） -->
    <div class="title-row">
      <div class="cal-card" id="cal-card">
        <div class="cal-left">
          <div class="cal-head">
            <div class="cal-title" id="cal-title">—</div>
            <button class="cal-nav-btn" id="cal-prev" data-tip="上个月">‹</button>
            <button class="cal-nav-btn" id="cal-next" data-tip="下个月">›</button>
            <button class="btn ghost" id="cal-today">今天</button>
          </div>
          <div class="cal-grid" id="cal-grid"></div>
        </div>
        <div class="cal-side">
          <div class="cd-box" id="cd-box"></div>
          <div class="cs-list" id="cs-list"></div>
        </div>
      </div>

      <!-- 时间块（仅时间轴视图显示）：固定三个月，按天的小方格横向对称铺满卡片 -->
      <div class="cal-card ts-card hidden" id="ts-card">
        <div class="ts-wrap">
          <div class="cal-head">
            <div class="cal-title" id="ts-title">—</div>
            <button class="cal-nav-btn" id="ts-prev" data-tip="往前一个月">‹</button>
            <button class="cal-nav-btn" id="ts-next" data-tip="往后一个月">›</button>
            <button class="btn ghost" id="ts-today">今天</button>
          </div>
          <div class="ts-grid" id="ts-grid"></div>
          <div class="ts-legend" id="ts-legend"></div>
        </div>
      </div>

      <div class="ring-card" id="ring-card">
        <div class="ring-wrap">
          <svg id="ring-svg" width="220" height="220" viewBox="0 0 220 220">
            <g id="ring-segs"></g>
            <g id="ring-leads"></g>
          </svg>
          <button type="button" class="ring-center" id="ring-center" data-tip="点击清除筛选" aria-label="清除状态筛选">
            <div class="ring-pct" id="ring-pct">0%</div>
            <div class="ring-label">总进度</div>
          </button>
        </div>
        <div class="ring-meta">
          <div class="rm-title">任务统计</div>
          <button class="rm-row" data-key="" data-tip="显示全部任务"><i style="background:var(--accent)"></i>总任务数<b id="rm-total">0</b></button>
          <button class="rm-row" data-key="done" data-tip="筛选已完成"><i style="background:var(--st-done)"></i>已完成<b id="rm-done">0</b></button>
          <button class="rm-row" data-key="doing" data-tip="筛选进行中"><i style="background:var(--st-doing)"></i>进行中<b id="rm-doing">0</b></button>
          <button class="rm-row" data-key="todo" data-tip="筛选待开始"><i style="background:var(--st-todo)"></i>待开始<b id="rm-todo">0</b></button>
          <button class="rm-row" data-key="revise" data-tip="筛选待修改"><i style="background:var(--st-revise)"></i>待修改<b id="rm-revise">0</b></button>
        </div>
      </div>

      <!-- 备忘录（任务列表视图时显示，替代圆形统计） -->
      <div class="ring-card memo-card hidden" id="memo-card">
        <div class="memo-wrap">
          <div class="rm-title">备忘录</div>
          <textarea id="memo-input" placeholder="随手记下想法、待办提醒、参考资料……自动保存"></textarea>
          <div class="memo-foot"><span id="memo-hint">内容随当前项目保存</span><button class="btn ghost" id="memo-clear">清空</button></div>
        </div>
      </div>
    </div>

    <!-- 3 · 筛选提示 -->
    <div class="stats-note" id="stats-note"></div>

    <!-- 4 · 筛选面板 + 操作面板 -->
    <div class="panels">
      <div class="panel panel-filter">
        <div class="filter-row" id="filter-row"></div>
        <button class="btn ghost hidden" id="btn-collapse">全部折叠</button>
        <button class="btn" id="btn-new"><i class="bi bi-plus-lg" aria-hidden="true"></i>新建任务</button>
        <button type="button" class="btn filter-act hidden" id="btn-manage">
          <i class="bi bi-list-check" aria-hidden="true"></i>
          <span id="btn-manage-label">任务管理</span>
        </button>
        <input type="file" id="file-restore" accept=".json,application/json" class="hidden" />

    <!-- 5 · 内容区 -->
    <div class="card" id="view-table">
      <div class="batch-bar hidden" id="batch-bar">
        <label class="bb-all"><input type="checkbox" id="bb-all" />全选</label>
        <span class="bb-count" id="bb-count">已选 0 条</span>
        <div class="spacer"></div>
        <select class="bb-sel" id="bb-status"></select>
        <select class="bb-sel" id="bb-prio"></select>
        <button class="btn ghost" id="bb-del">删除选中</button>
        <button class="btn ghost" id="bb-exit">退出管理</button>
      </div>
      <div class="task-cards" id="task-cards"></div>
    </div>

    <div class="board hidden" id="view-board"></div>

    <div class="card hidden" id="view-timeline">
      <div class="timeline" id="tl-list"></div>
    </div>

  </div>
</div>

<script>
/* ============================================================
   CONFIG — the main customization surface.
   ============================================================ */
const CONFIG = {
  storageKey: "lunwen-board-v1",           // localStorage bucket; bump to reset

  statuses: [
    { key: "todo",    label: "待开始", color: "#e9edf2", text: "#4b5563", accent: "#94a3b8" },
    { key: "doing",   label: "进行中", color: "#e6efff", text: "#1d4ed8", accent: "#3b82f6" },
    { key: "revise",  label: "待修改", color: "#fdeee2", text: "#b4531b", accent: "#f97316" },
    { key: "done",    label: "已完成", color: "#e6f6f0", text: "#0f766e", accent: "#10b981" },
  ],

  priorities: [

/* 数据版本号：结构变化时靠 normalizeData 兜底，脏数据不会把页面搞崩 */
const SCHEMA_VERSION = 2;
const STORAGE_KEY = CONFIG.storageKey;
const CORRUPT_KEY = CONFIG.storageKey + ".corrupt";

/* 把任意来源的数据（localStorage / 备份文件 / 旧版裸数组）整理成固定结构：
   items 保证是数组；status / priority 非法回落默认值；created 必须是 YYYY-MM-DD；
   id 缺失补发；active 越界收敛到合法下标 */
function normalizeData(raw) {
  if (Array.isArray(raw)) raw = { projects: [{ name: "例-毕业论文", items: raw }] };
  const src = (raw && typeof raw === "object") ? raw : {};
  const statKeys = CONFIG.statuses.map(s => s.key);
  const prioKeys = CONFIG.priorities.map(p => p.key);
  const normItem = it => {
    const o = (it && typeof it === "object") ? it : {};
    return {
      id: (o.id == null || o.id === "") ? Date.now() + Math.floor(Math.random() * 1000) : o.id,
      name: typeof o.name === "string" ? o.name : String(o.name ?? ""),
      status: statKeys.includes(o.status) ? o.status : "todo",
      priority: prioKeys.includes(o.priority) ? o.priority : "常规",
      owner: typeof o.owner === "string" ? o.owner : "",
      line: typeof o.line === "string" ? o.line : "",
      created: /^\d{4}-\d{2}-\d{2}$/.test(String(o.created || "")) ? String(o.created) : "",
    };
  };
  const projects = (Array.isArray(src.projects) ? src.projects : [])
    .filter(p => p && typeof p === "object")
    .map(p => ({
      id: p.id == null ? Date.now() : p.id,
      name: (typeof p.name === "string" && p.name.trim()) ? p.name : "未命名项目",
      memo: typeof p.memo === "string" ? p.memo : "",
      items: (Array.isArray(p.items) ? p.items : []).map(normItem),
    }));
  if (!projects.length) projects.push({ id: Date.now(), name: "例-毕业论文", items: [] });
  return {
    schemaVersion: SCHEMA_VERSION,
    active: Math.min(Math.max(0, Number(src.active) || 0), projects.length - 1),
    projects,
    // 折叠状态：{ [statusKey]: { [groupName]: true } }
    collapsed: (src.collapsed && typeof src.collapsed === "object") ? src.collapsed : {},
    taskSort: typeof src.taskSort === "string" ? src.taskSort : "default",
  };
}

const store = {
  load() {
    let raw = null;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { raw = null; }
    if (raw) {
      try {
        return normalizeData(JSON.parse(raw));
      } catch (e) {
        // 解析失败时保留原文供事后排查，而不是静默丢掉用户数据
        try { localStorage.setItem(CORRUPT_KEY, raw); } catch (_) {}
        setTimeout(() => toast("本地数据读取失败，已重置为示例数据（原始数据已保留在 " + CORRUPT_KEY + "）"), 0);
      }
    }
    return normalizeData({ projects: [{ name: "例-毕业论文", items: structuredClone(CONFIG.seed) }] });
  },
  save(d) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
    } catch (e) {
      // 容量超限 / 隐私模式：给出人话提示，绝不让保存异常打断渲染
      toast("本地保存失败：存储空间不足或浏览器处于隐私模式");
    }
  },
};

/* 提示层常驻 DOM 并带 aria-live：读屏软件能播报操作结果；错误类用 alert 打断播报 */
function toastLayer(alert) {
  const id = alert ? "toast-layer-alert" : "toast-layer";
  let el = document.getElementById(id);
  if (!el) {
    el = document.createElement("div");
    el.id = id;
    el.className = "toast-layer";
    el.setAttribute("role", alert ? "alert" : "status");
    el.setAttribute("aria-live", alert ? "assertive" : "polite");
    el.setAttribute("aria-atomic", "true");
    document.body.appendChild(el);
  }
  return el;
}
function toast(msg, alert) {
  const t = document.createElement("div");
  t.className = "toast" + (alert ? " toast-alert" : "");
  t.innerHTML = `${alert ? ALERT_ICON : OK_ICON}<span>${esc(msg)}</span>`;
  toastLayer(alert).appendChild(t);
  setTimeout(() => { t.classList.add("toast-out"); setTimeout(() => t.remove(), 280); }, 2400);
}

/* 时间筛选：按截止时间（created）的区间命中 */
const TIME_FILTERS = [
  { key: "",        label: "全部" },
  { key: "week",    label: "7 天内" },

  { key: "later",   label: "30 天后" },

/* 时间筛选：按截止时间（created）的区间命中。
   抽成带 key 参数的版本，筛选与分段上的条数统计共用同一套判定。
   除「全部」外都要求任务有截止日期，无日期的任务只出现在「全部」里。 */
function matchTimeKey(i, key) {
  if (!key) return true;
  const v = String(i.created || "");
  if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) return false;
  const d = daysFromToday(v);
  if (key === "week") return d >= 0 && d <= 7;
  if (key === "month") return d >= 0 && d <= 30;
  if (key === "later") return d > 30;
  return true;
}
function matchTime(i) { return matchTimeKey(i, fTime); }

/* 颜色混合：把 hex 朝目标色靠拢 t（用于 3D 圆环的侧壁暗部与顶面高光） */
function mixHex(hex, other, t) {
  const toRgb = s => {
    const v = String(s).replace("#", "");
    const n = v.length === 3 ? v.split("").map(c => c + c).join("") : v;
    return [parseInt(n.slice(0, 2), 16) || 0, parseInt(n.slice(2, 4), 16) || 0, parseInt(n.slice(4, 6), 16) || 0];
  };
  const a = toRgb(hex), b = toRgb(other);
  const m = i => Math.round(a[i] + (b[i] - a[i]) * t).toString(16).padStart(2, "0");
  return `#${m(0)}${m(1)}${m(2)}`;
}

/* interactive donut ring — 3D：底面挤出层（厚度）+ 顶面受光渐变 + 内外圈倒角 */
function renderRing() {
  const all = items();
  const total = all.length;
  const count = k => all.filter(i => i.status === k).length;
  const done = count("done");
  const pct = total ? Math.round(done / total * 100) : 0;
  $("#ring-pct").textContent = `${pct}%`;

  $("#rm-total").textContent = total;
  $("#rm-done").textContent = done;
  $("#rm-doing").textContent = count("doing");
  $("#rm-todo").textContent = count("todo");
  $("#rm-revise").textContent = count("revise");

  // "总任务数" row is active only when no status filter
  document.querySelectorAll(".rm-row").forEach(row => {
    const isAll = row.dataset.key === "";
    row.classList.toggle("active", isAll ? fStatus === "" : fStatus === row.dataset.key);
  });

  /* ---- donut：受光顶面 + 内外圈倒角（平面圆环，无厚度层） ---- */
  const CX = 110, CY = 110, R_OUT = 88, R_IN = 52;   // 外 / 内半径
  const DARK = "#232d35", LIGHT = "#ffffff";        // 顶面暗部 / 高光的目标色
  const segsG = $("#ring-segs");
  const leadsG = $("#ring-leads");
  const order = ["done", "doing", "revise", "todo"];
  const parts = order.map(k => ({ k, n: count(k), s: statusOf(k) })).filter(p => p.n > 0);

  // annular sector (donut slice)
  const arcPath = (a0, a1, rOut, rIn) => {
    const large = a1 - a0 > Math.PI ? 1 : 0;
    const x0 = CX + rOut * Math.cos(a0), y0 = CY + rOut * Math.sin(a0);
    const x1 = CX + rOut * Math.cos(a1), y1 = CY + rOut * Math.sin(a1);
    const x2 = CX + rIn * Math.cos(a1), y2 = CY + rIn * Math.sin(a1);
    const x3 = CX + rIn * Math.cos(a0), y3 = CY + rIn * Math.sin(a0);
    return `M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${rOut} ${rOut} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} ` +
           `L ${x2.toFixed(2)} ${y2.toFixed(2)} A ${rIn} ${rIn} 0 ${large} 0 ${x3.toFixed(2)} ${y3.toFixed(2)} Z`;
  };

  if (!parts.length) {
    const c = CONFIG.statuses[0].accent;
    segsG.innerHTML = `<circle cx="${CX}" cy="${CY}" r="${R_OUT}" style="fill: var(--surface-2)"/>
      <path d="${arcPath(-Math.PI / 2, Math.PI * 1.5, R_OUT, R_IN)}" fill="${c}" opacity=".18"/>`;
    leadsG.innerHTML = "";
    return;
  }

  const defsHTML = [];

  let angle = -Math.PI / 2;   // start at 12 o'clock
  const segHTML = [];
  const lblHTML = [];

  parts.forEach((p, i) => {
    const frac = p.n / total;
    const span = 2 * Math.PI * frac;
    const a0 = angle;
    const a1 = angle + span;
    const safeA1 = a1 > a0 ? a1 : a0 + 0.001;
    const mid = angle + span / 2;
    const pctStr = Math.round(frac * 100);

    // 顶面：左上受光高光 → 本色 → 右下暗部，做出球面受光感
    defsHTML.push(`<linearGradient id="segTop${i}" x1="8%" y1="0%" x2="88%" y2="104%">
      <stop offset="0%" stop-color="${mixHex(p.s.accent, LIGHT, .40)}"/>
      <stop offset="46%" stop-color="${p.s.accent}"/>
      <stop offset="100%" stop-color="${mixHex(p.s.accent, DARK, .26)}"/>
    </linearGradient>`);

    // % + name on the band — narrow readable font range, clear gap between the two lines
    let labelHTML = "";
    if (frac >= 0.06) {
      const lr = (R_OUT + R_IN) / 2;
      const lx = CX + lr * Math.cos(mid), ly = CY + lr * Math.sin(mid);
      const arcLen = span * lr;
      // font size adapts to slice size; keep small so text never leaves the band (half-band = 18px)
      const fsPct = Math.max(8.5, Math.min(10.5, arcLen * 0.16));
      const fsSub = Math.max(6, Math.min(7.5, arcLen * 0.11));
      const yPct = ly - (fsPct * 0.28 + 1);
      const ySub = ly + (fsSub * 0.28 + 1);
      labelHTML = `<text class="ring-lbl" x="${lx.toFixed(1)}" y="${yPct.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="${fsPct.toFixed(1)}">${pctStr}%</text>
        <text class="ring-lbl-sub" x="${lx.toFixed(1)}" y="${ySub.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="${fsSub.toFixed(1)}">${p.s.label}</text>`;
    }

    segHTML.push(`<g class="ring-seg-g" data-key="${p.k}" data-tip="${p.s.label} ${p.n} 项 · ${pctStr}%">
      <path class="ring-seg" d="${arcPath(a0, safeA1, R_OUT, R_IN)}" fill="url(#segTop${i})"></path>
      ${labelHTML}
    </g>`);

    angle += span;
  });

  // 底色圆盘填住孔洞与环下区域；分隔感交给扇区自身的白边，不再额外画倒角描边
  segsG.innerHTML = `<defs>${defsHTML.join("")}</defs>
    <circle cx="${CX}" cy="${CY}" r="${R_OUT}" style="fill: var(--surface-2)"/>
    ${segHTML.join("")}`;
  leadsG.innerHTML = "";

  /* 环形图扇区：鼠标点击与键盘 Enter/Space 都能筛选状态；对读屏暴露为带标签的按钮 */
  segsG.querySelectorAll(".ring-seg-g").forEach(g => {
    const pick = () => { fStatus = fStatus === g.dataset.key ? "" : g.dataset.key; render(); };
    g.setAttribute("role", "button");
    g.setAttribute("tabindex", "0");
    g.setAttribute("aria-label", g.getAttribute("data-tip") || "");
    g.onclick = e => { e.stopPropagation(); pick(); };
    g.onkeydown = e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); e.stopPropagation(); pick(); }
    };
  });
}

    <h4>${esc(proj.name)}</h4>
    <p>共 ${list.length} 条任务 · 已完成 ${done} 条</p>
    <div class="mega-stats">${rows}</div>`;
}

/* 任务按截止时间排序（仅显示层，不改动底层顺序） */
function sortTasks(list) {
  const mode = data.taskSort || "default";
  if (mode === "default") return list;
  // 有截止日期的排前面，无日期的排后面；再按日期升/降序
  const dir = mode === "date-asc" ? 1 : -1;
  return [...list].sort((a, b) => {
    const da = /^\d{4}-\d{2}-\d{2}$/.test(String(a.created || "")) ? String(a.created) : null;
    const db = /^\d{4}-\d{2}-\d{2}$/.test(String(b.created || "")) ? String(b.created) : null;
    if (!da && !db) return 0;
    if (!da) return 1;
    if (!db) return -1;
    return da === db ? 0 : (da < db ? -dir : dir);
  });
}

/* ---- 分段控件的滑动指示块 ----
   每次重绘整条筛选行后，把 .seg-thumb 摆到当前选中项上；若选中项发生变化，
   先钉在上一位置，再于下一帧滑向新位置，从而得到「滑动切换」的过渡。 */
const segPrev = {};   // groupId -> { x, y, w, h, c, key }

function placeSegThumbs() {
  document.querySelectorAll("#filter-row .filter-group").forEach(g => {
    const seg = g.querySelector(".seg");
    const thumb = seg && seg.querySelector(".seg-thumb");
    const act = seg && seg.querySelector(".seg-btn.active");
    if (!thumb || !act) return;
    const sr = seg.getBoundingClientRect(), ar = act.getBoundingClientRect();
    const next = {
      x: ar.left - sr.left - seg.clientLeft, y: ar.top - sr.top - seg.clientTop,
      w: ar.width, h: ar.height,
      c: act.style.getPropertyValue("--c").trim(),
      key: act.dataset.v || "",
    };
    const prev = segPrev[g.dataset.group];
    const slide = !!(prev && prev.key !== next.key && prev.w > 0);
    const put = o => {
      thumb.style.setProperty("--c", o.c);
      thumb.style.width = o.w + "px";
      thumb.style.height = o.h + "px";
      thumb.style.transform = `translate(${o.x}px, ${o.y}px)`;
    };
    thumb.classList.add("no-anim");
    if (slide) {
      put(prev);            // 本帧先落在旧位置，不产生过渡
      void thumb.offsetWidth;
      thumb.classList.remove("no-anim");
      requestAnimationFrame(() => put(next));   // 下一帧滑向新位置
    } else {
      put(next);
      void thumb.offsetWidth;
      thumb.classList.remove("no-anim");
    }
    segPrev[g.dataset.group] = next;
  });
}

/* ---- filter row: 三组分段控件，每段带实时条数 ---- */
function renderFilters() {
  const q = $("#search").value.trim().toLowerCase();
  const hit = i => !q || (i.name || "").toLowerCase().includes(q);
  const all = items();
  /* 每组的统计基准 = 通过「其它两组筛选 + 搜索关键词」的任务，本组筛选不计入。
     这样点任意一段，其余两组的数字会同步跟着变，且与下方列表始终对得上。 */
  const baseStatus = all.filter(i => hit(i) && (!fPriority || i.priority === fPriority) && matchTime(i));
  const basePrio   = all.filter(i => hit(i) && (!fStatus || i.status === fStatus) && matchTime(i));
  const baseTime   = all.filter(i => hit(i) && (!fStatus || i.status === fStatus) && (!fPriority || i.priority === fPriority));
  /* 「全部」恒为首段，条数取该组统计基准的长度 */
  const segBtn = (key, label, n, active, color) => {
    const cls = `seg-btn${active ? " active" : ""}`;
    const cs = color ? ` style="--c:${color}"` : "";
    return `<button type="button" class="${cls}"${cs} data-v="${esc(key)}" aria-pressed="${active}">` +
      `<span class="seg-t">${esc(label)}</span><span class="seg-n${n ? "" : " is-zero"}">${n}</span></button>`;
  };
  /* 行序：状态 → 优先级 → 时间（顺序只影响显示，不影响筛选逻辑） */
  const groups = [
    {
      id: "status", name: "状态", cur: fStatus,
      items: [{ key: "", label: "全部", n: baseStatus.length }].concat(
        CONFIG.statuses.map(s => ({ key: s.key, label: s.label, n: baseStatus.filter(i => i.status === s.key).length, color: s.accent }))
      ),
    },
    {
      id: "priority", name: "优先级", cur: fPriority,
      items: [{ key: "", label: "全部", n: basePrio.length }].concat(
        CONFIG.priorities.map(p => ({ key: p.key, label: p.key, n: basePrio.filter(i => i.priority === p.key).length, color: p.accent }))
      ),
    },
    {
      id: "time", name: "时间", cur: fTime,
      items: TIME_FILTERS.map(t => ({ key: t.key, label: t.label, n: baseTime.filter(i => matchTimeKey(i, t.key)).length })),
    },
  ];

  $("#filter-row").innerHTML = groups.map(g => `<div class="filter-group" data-group="${g.id}">
      <span class="filter-label">${g.name}</span>
      <div class="seg" role="group" aria-label="${g.name}筛选"><span class="seg-thumb" aria-hidden="true"></span>${
        g.items.map(o => segBtn(o.key, o.label, o.n, (g.cur || "") === o.key, o.color)).join("")
      }</div>
    </div>`).join("");

  /* 点击只写入筛选状态，显示统一交给 render() 刷新 */
  const setter = { status: v => { fStatus = v; }, priority: v => { fPriority = v; }, time: v => { fTime = v; } };
  $("#filter-row").querySelectorAll(".filter-group").forEach(g => {
    const put = setter[g.dataset.group];
    g.querySelectorAll(".seg-btn").forEach(b => b.onclick = () => { put(b.dataset.v); render(); });
  });
  placeSegThumbs();
}

/* ---- chip group helper for modals ---- */
function chipGroupHTML(name, opts, current) {

    `<button type="button" class="chip cg-item ${o.key === current ? "active" : ""}" style="--c:${o.accent}" data-name="${name}" data-key="${esc(o.key)}">${esc(o.label || o.key)}</button>`

function wireChipGroups(root) {

/* 图标标记：统一走 Bootstrap Icons 内嵌字形，尺寸由所在元素的 font-size 控制 */
const TRASH_ICON = `<i class="bi bi-trash3"></i>`;
const CAL_ICON = `<i class="bi bi-calendar3"></i>`;
const INBOX_ICON = `<i class="bi bi-inbox"></i>`;
const CHEV_ICON = `<i class="bi bi-chevron-right"></i>`;
const X_ICON = `<i class="bi bi-x-lg"></i>`;

function checkHTML(item) {
  const done = item.status === "done";
  const c = statusOf("done").accent;
  const tip = item.status === "todo" ? "点击开始（进行中）"
    : item.status === "doing" ? "点击标记完成"
    : item.status === "done" ? "点击标记为待修改"
    : "点击标记完成";
  return `<button class="check js-toggle ${done ? "is-done" : ""}" style="--c:${c}" data-tip="${tip}"></button>`;

function renderTable() {
  const list = filtered();
  const grid = $("#task-cards");
  grid.classList.toggle("is-batch", batchMode);
  if (!list.length) {
    const filtering = !!(fStatus || fPriority || fTime || $("#search").value.trim());
    grid.innerHTML = `<div class="empty" role="status">${INBOX_ICON}
      <b>${filtering ? "没有匹配的任务" : "还没有任务"}</b>
      <span>${filtering ? "换个筛选条件，或清除筛选后查看全部" : "点击「新建任务」添加第一条"}</span>
      ${filtering ? `<div><button type="button" class="btn ghost empty-action" id="empty-clear">清除筛选</button></div>` : ""}
    </div>`;
    const clr = grid.querySelector("#empty-clear");
    if (clr) clr.onclick = clearFilters;
    return;
  }
  grid.innerHTML = list.map((item, idx) => {
    const s = statusOf(item.status);
    const p = prioOf(item.priority);
    const checked = batchMode && batchSel.has(String(item.id));
    /* 任务管理：行式可拖拽列表（勾选框 + 序号 + 标题），勾选后标题转红、行尾滑出单条删除；
       已勾选的行锁定不可拖，避免拖拽时误改顺序 */
    if (batchMode) {
      return `<div class="tcard is-mrow ${checked ? "is-checked" : ""} ${animateRows ? "anim-rise" : ""}" data-id="${item.id}" draggable="${!checked}"
        role="button" tabindex="0" aria-label="选择任务：${esc(item.name)}" data-tip="${esc(item.name)}"
        style="--sc:${s.accent}${animateRows ? `;animation-delay:${Math.min(idx * 26, 300)}ms` : ""}">
        <div class="mrow-main">
          <input type="checkbox" class="batch-check" ${checked ? "checked" : ""} aria-label="勾选以删除该任务" />
          <span class="mrow-order">${idx + 1}</span>
          <div class="tc-name">${esc(item.name)}</div>
        </div>
        <button class="icon-btn js-del" data-tip="删除这条" aria-label="删除任务">${TRASH_ICON}</button>
      </div>`;
    }
    return `<div class="tcard kcard ${item.status === "done" ? "is-done" : ""} ${animateRows ? "anim-rise" : ""}" data-id="${item.id}" draggable="true"
      role="button" tabindex="0" aria-label="打开任务：${esc(item.name)}"
      style="${animateRows ? `animation-delay:${Math.min(idx * 26, 300)}ms` : ""}">
      ${checkHTML(item)}
      <div class="k-tags">
        <span class="ktag" style="background:${tone(s.color)};color:${toneText(s.text)}"><span class="dot"></span>${s.label}</span>
        <span class="ktag" style="background:${tone(p.color)};color:${toneText(p.text)}">${p.key}</span>
        ${item.line ? `<span class="ktag plain">${esc(item.line)}</span>` : ""}
      </div>
      <div class="k-title">${esc(item.name)}</div>
      <div class="k-foot">
        ${item.created ? `<span class="k-date ${isOverdue(item, item.created) ? "overdue" : ""}" data-tip="截止时间">${CAL_ICON}${esc(item.created)}</span>` : ""}
        <button class="icon-btn js-del" data-tip="删除" aria-label="删除任务">${TRASH_ICON}</button>
      </div>
    </div>`;
  }).join("");
  /* 卡片交互改为容器级事件委托：重建后无需逐张重新绑定 */
  if (!grid.dataset.wired) {
    grid.dataset.wired = "1";
    grid.addEventListener("click", e => {
      if (e.target.closest(".batch-check")) return;   // 勾选框交给 change 处理
      const card = e.target.closest(".tcard");
      if (!card) return;
      const item = () => items().find(i => i.id == card.dataset.id);
      if (e.target.closest(".js-del")) { e.stopPropagation(); confirmDelete(item()); return; }
      if (e.target.closest(".js-toggle")) { e.stopPropagation(); advanceStatus(item()); return; }
      if (batchMode) { toggleBatch(item(), card); return; }
      openModal(item());
    });
    grid.addEventListener("change", e => {
      const box = e.target.closest(".batch-check");
      if (!box) return;
      const card = box.closest(".tcard");
      if (!card) return;
      const k = String(card.dataset.id);
      box.checked ? batchSel.add(k) : batchSel.delete(k);
      card.classList.toggle("is-checked", box.checked);
      card.setAttribute("draggable", String(!box.checked));
      syncBatchBar();
    });
    /* 键盘：Enter/Space 打开或勾选；Alt + 上下键等价于拖拽换序 */
    grid.addEventListener("keydown", e => {
      const card = (e.target.classList && e.target.classList.contains("tcard")) ? e.target : null;
      if (!card) return;
      const item = () => items().find(i => i.id == card.dataset.id);
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        if (batchMode) toggleBatch(item(), card); else openModal(item());
        return;
      }
      if (!e.altKey || (e.key !== "ArrowUp" && e.key !== "ArrowDown")) return;
      e.preventDefault();
      const cur = item();
      if (!cur) return;
      const vis = filtered();
      const i = vis.findIndex(x => x.id == cur.id);
      if (i < 0) return;
      if (e.key === "ArrowUp") { if (i > 0) moveItem(cur.id, vis[i - 1].id); else return; }
      else { const after = vis[i + 2]; moveItem(cur.id, after ? after.id : null); }
      persist();
      const again = grid.querySelector(`.tcard[data-id="${cur.id}"]`);
      if (again) again.focus();
      toast("已调整任务顺序");
    });
  }
  wireRowDnD();   /* 任务管理模式下同样可拖拽换序 */
}

/* ---- 任务管理 · 批量操作 ---- */
function toggleBatch(item, card) {
  const k = String(item.id);
  batchSel.has(k) ? batchSel.delete(k) : batchSel.add(k);
  const on = batchSel.has(k);
  const box = card && card.querySelector(".batch-check");
  if (box) box.checked = on;
  if (card) { card.classList.toggle("is-checked", on); card.setAttribute("draggable", String(!on)); }
  syncBatchBar();
}

function syncBatchBar() {
  const list = filtered();
  const chosen = list.filter(i => batchSel.has(String(i.id))).length;
  $("#batch-bar").classList.toggle("hidden", !(currentView === "table" && batchMode));
  $("#bb-count").textContent = `已选 ${chosen} 条`;
  const all = $("#bb-all");
  all.checked = list.length > 0 && chosen === list.length;
  all.indeterminate = chosen > 0 && chosen < list.length;
  $("#bb-del").disabled = chosen === 0;
  $("#btn-manage-label").textContent = batchMode ? "退出管理" : "任务管理";
  $("#btn-manage").classList.toggle("active", batchMode);
}

/* 对已选任务统一应用某项修改 */
function applyBatch(fn) {
  if (!batchSel.size) return;
  items().forEach(i => { if (batchSel.has(String(i.id))) fn(i); });
  persist();
}

/* 批量删除已选任务 */
function batchDelete() {
  const ids = [...batchSel];
  if (!ids.length) return;
  const names = items().filter(i => batchSel.has(String(i.id)));
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `<div class="modal" style="width:400px">
    <button class="modal-x js-x" data-tip="关闭">${X_ICON}</button>
    <h2>批量删除</h2>
    <div class="sub">确定删除已选中的 <b>${names.length}</b> 条任务？此操作不可撤销。</div>
    <div class="modal-list">${names.slice(0, 6).map(i => `<span>· ${esc(i.name)}</span>`).join("")}${names.length > 6 ? `<span>… 等共 ${names.length} 条</span>` : ""}</div>
    <div class="modal-actions">
      <div class="spacer"></div>
      <button class="btn ghost" id="b-cancel">取消</button>
      <button class="btn danger" id="b-ok">删除</button>
    </div></div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.onclick = e => { if (e.target === overlay) close(); };
  overlay.querySelectorAll(".js-x").forEach(b => b.onclick = close);
  overlay.querySelector("#b-cancel").onclick = close;
  overlay.querySelector("#b-ok").onclick = () => {
    const proj = activeProject();
    proj.items = proj.items.filter(i => !batchSel.has(String(i.id)));
    batchSel.clear();   // 保留管理模式，方便继续操作
    persist(); close();
  };
}

/* ================= 时间轴视图：按截止日期纵向排成时间轴 ================= */
const fmtDate = ds => {
  const d = new Date(ds);
  return `${d.getMonth() + 1} 月 ${d.getDate()} 日 · 周${WEEK[d.getDay()]}`;
};
function renderTimeline() {
  const el = $("#tl-list");
  /* 按截止日期分组：有日期的按日期升序，无日期的单独落在最后 */
  const groups = [];
  const index = {};
  filtered().forEach(it => {
    const hasDate = /^\d{4}-\d{2}-\d{2}$/.test(String(it.created || ""));
    const k = hasDate ? it.created : "";
    if (!(k in index)) { index[k] = groups.length; groups.push({ date: k, items: [] }); }
    groups[index[k]].items.push(it);
  });
  groups.sort((a, b) => {
    if (!a.date) return 1;
    if (!b.date) return -1;
    return a.date < b.date ? -1 : 1;
  });

  if (!groups.length) {
    el.innerHTML = `<div class="empty" role="status">${INBOX_ICON}
      <b>没有匹配的任务</b><span>换个筛选条件，或清除筛选后查看全部</span></div>`;
    return;
  }

  const today = todayStr();
  el.innerHTML = groups.map(g => {
    const hasDate = !!g.date;
    const d = hasDate ? daysFromToday(g.date) : null;
    const overdue = hasDate && d < 0 && g.items.some(i => i.status !== "done");
    const cls = [!hasDate ? "is-none" : "", overdue ? "is-overdue" : "", hasDate && g.date === today ? "is-today" : ""].filter(Boolean).join(" ");
    const rel = !hasDate ? "" : d === 0 ? "今天" : d > 0 ? `${d} 天后` : `已逾期 ${Math.abs(d)} 天`;
    const relHTML = rel ? `<span class="${overdue ? "is-overdue" : ""}">${rel}</span>` : "";
    const blocks = g.items.map(it => {
      const s = statusOf(it.status), p = prioOf(it.priority);
      return `<button type="button" class="tl-block ${it.status === "done" ? "is-done" : ""}" data-id="${it.id}" style="--pc:${p.accent}">` +
        `<span class="tl-name">${esc(it.name)}</span>` +
        `<span class="tl-meta">` +
          `<span class="badge" style="background:${tone(s.color)};color:${toneText(s.text)}"><span class="dot"></span>${s.label}</span>` +
          `<span class="badge" style="background:${tone(p.color)};color:${toneText(p.text)}">${p.key}</span>` +
          (it.line ? `<span class="tc-stage">${esc(it.line)}</span>` : "") +
        `</span></button>`;
    }).join("");
    /* 全部折叠时把任务块换成一行条数，整段缩成一份日期清单 */
    const body = tlFolded
      ? `<div class="tl-fold-meta">共 ${g.items.length} 条</div>`
      : `<div class="tl-blocks">${blocks}</div>`;
    return `<div class="tl-row ${cls}${tlFolded ? " is-folded" : ""}" data-date="${g.date}">
      <div class="tl-date"><b>${hasDate ? esc(fmtDate(g.date)) : "无截止日期"}</b>${relHTML}</div>
      ${body}
    </div>`;
  }).join("");

  /* 点任务块打开编辑弹窗，和列表 / 看板一致 */
  el.querySelectorAll(".tl-block").forEach(b =>
    b.onclick = () => openModal(items().find(i => i.id == b.dataset.id))
  );
}

/* ================= 时间块：固定三个月，按天的小方格横向对称铺满 ================= */
let tsOffset = 0;        // 以月为单位的偏移
const TS_COLS = 16;      // 固定列数：行数按天数推算，网格整体铺满卡片宽度
function renderTimeGrid() {
  hideTip();   // 重新绘制时收起悬停提示，避免点击前后月按钮后提示残留在原处
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth() + tsOffset, 1);
  const end = new Date(start.getFullYear(), start.getMonth() + 3, 0);   // 三个月区间的最后一天
  $("#ts-title").textContent =
    `${start.getFullYear()} 年 ${start.getMonth() + 1} 月 – ${end.getFullYear()} 年 ${end.getMonth() + 1} 月`;
  const days = Math.round((end - start) / 86400000) + 1;
  const rows = Math.ceil(days / TS_COLS);

  /* 与筛选联动：按筛选后的任务集合着色，方格随筛选内容一起变化 */
  const byDate = {};
  filtered().forEach(it => {
    const k = String(it.created || "");
    if (k) (byDate[k] = byDate[k] || []).push(it);
  });
  const rank = CONFIG.priorities.map(p => p.key);
  const today = todayStr();
  const cells = [];
  /* 整块铺满：末尾空槽用紧接其后的日期补上，网格始终是完整矩形 */
  for (let i = 0; i < rows * TS_COLS; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const ds = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    const list = byDate[ds] || [];
    const top = list.slice().sort((a, b) => rank.indexOf(a.priority) - rank.indexOf(b.priority))[0];
    const overdue = ds < today && list.some(x => x.status !== "done");
    const cls = ["ts-cell", list.length ? "has-tasks" : "", ds === today ? "is-today" : "", overdue ? "is-overdue" : ""].filter(Boolean).join(" ");
    const tip = `${d.getMonth() + 1} 月 ${d.getDate()} 日 · ${list.length ? list.length + " 条任务" : "无截止任务"}`;
    cells.push(`<button type="button" class="${cls}" data-date="${ds}" data-tip="${tip}"${top ? ` style="--pc:${prioOf(top.priority).accent}"` : ""}><b>${d.getDate()}</b></button>`);
  }
  const grid = $("#ts-grid");
  grid.style.setProperty("--cols", String(TS_COLS));
  grid.style.setProperty("--rows", String(rows));
  grid.innerHTML = cells.join("");
  /* 点方格 → 跳到下方时间轴里同一天的那一行 */
  grid.querySelectorAll(".ts-cell[data-date]").forEach(c => c.onclick = () => jumpToDate(c.dataset.date));
  $("#ts-legend").innerHTML =
    CONFIG.priorities.map(p => `<span class="ts-lg"><i style="background:${p.accent}"></i>${p.key}</span>`).join("") +
    `<span class="ts-lg"><i class="ts-lg-today"></i>今天</span><span class="ts-lg ts-hint">点方格跳到下方对应日期</span>`;
}

/* 点时间块方格：滚到下方时间轴里同一天的行，并高亮闪一下 */
function jumpToDate(ds) {
  const target = [...document.querySelectorAll("#tl-list .tl-row")].find(r => r.dataset.date === ds);
  if (!target) { toast(`${fmtDate(ds)} 没有任务`); return; }
  target.scrollIntoView({ behavior: "smooth", block: "center" });
  target.classList.add("is-flash");
  setTimeout(() => target.classList.remove("is-flash"), 1400);
}

function renderBoard() {
  const data2 = filtered();
  const total = data2.length || 1;   // percentages follow the filtered set
  $("#view-board").innerHTML = CONFIG.statuses.map(s => {
    const list = data2.filter(i => i.status === s.key);
    const pct = Math.round(list.length / total * 100);

    // group by stage (line), preserving first-seen order
    const groups = [];
    const index = {};
    list.forEach(item => {
      const g = item.line || "未分类";
      if (!(g in index)) { index[g] = groups.length; groups.push({ name: g, items: [] }); }
      groups[index[g]].items.push(item);
    });

    const body = list.length
      ? groups.map(g => {
          const open = !isCollapsed(s.key, g.name);
          const preview = esc(g.items[0].name) + (g.items.length > 1 ? ` 等 ${g.items.length} 项` : "");
          return `<div class="grp ${open ? "open" : ""}" data-status="${s.key}" data-name="${esc(g.name)}">
            <button type="button" class="grp-head" aria-expanded="${open}" data-tip="${open ? "点击折叠" : "点击展开"}">
              <span class="grp-arrow" aria-hidden="true">${CHEV_ICON}</span>
              <span class="grp-name">${esc(g.name)}</span>
              <span class="grp-count">${g.items.length}</span>
            </button>
            <div class="grp-preview">${preview}</div>
            <div class="grp-children"><div class="grp-inner">${g.items.map((it, gi) => ticketHTML(it, gi)).join("")}</div></div>
          </div>`;
        }).join("")
      : `<div class="col-empty">${INBOX_ICON}暂无任务<br/>拖动卡片到这里</div>`;

    return `<div class="col" data-status="${s.key}" style="--c:${s.accent}">
      <div class="col-head">
        <div class="ch-row">
          <span class="ch-dot"></span>
          <h3>${s.label}</h3>
          <span class="count">${list.length}</span>

        <div class="ch-sub">
          <span>占筛选结果 ${pct}%</span>

        </div>
      </div>
      <div class="col-body">${body}</div>
    </div>`;
  }).join("");
  wireBoard();
}

/* 状态推进：待开始 → 进行中 → 已完成 →（询问）待修改 → 已完成 */
const STATUS_FLOW = { todo: "doing", doing: "done", revise: "done" };

function advanceStatus(item) {
  if (!item) return;
  if (item.status === "done") { askRevise(item); return; }
  item.status = STATUS_FLOW[item.status] || "done";
  persist();
}

/* 已完成任务被点击时，询问是否转入「待修改」 */
function askRevise(item) {
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `<div class="modal" style="width:380px">
    <button class="modal-x js-x" data-tip="关闭">${X_ICON}</button>
    <h2>任务已完成</h2>
    <div class="sub">「${esc(item.name)}」是否需要标记为<b>待修改</b>？</div>
    <div class="modal-actions">
      <div class="spacer"></div>
      <button class="btn ghost" id="c-cancel">保持已完成</button>
      <button class="btn" id="c-ok">转为待修改</button>
    </div></div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.onclick = e => { if (e.target === overlay) close(); };
  overlay.querySelectorAll(".js-x").forEach(b => b.onclick = close);
  overlay.querySelector("#c-cancel").onclick = close;
  overlay.querySelector("#c-ok").onclick = () => { item.status = "revise"; persist(); close(); };
}

/* ---- drag sort ---- */
function moveItem(dragId, beforeId) {
  const list = items();
  const from = list.findIndex(i => i.id == dragId);
  if (from < 0) return;
  const [it] = list.splice(from, 1);
  if (beforeId == null) { list.push(it); return; }
  const to = list.findIndex(i => i.id == beforeId);
  list.splice(to < 0 ? list.length : to, 0, it);
}

function clearDropMarks() {
  document.querySelectorAll(".drop-before, .drop-after").forEach(el => el.classList.remove("drop-before", "drop-after"));
}

function wireRowDnD() {
  let dragId = null;
  $("#task-cards").querySelectorAll(".tcard[data-id]").forEach(card => {
    card.ondragstart = e => {
      /* 勾选框与删除按钮上按下时不起拖拽，避免勾选/删除误触发换序 */
      if (e.target.closest(".batch-check") || e.target.closest(".js-del")) { e.preventDefault(); return; }
      dragId = card.dataset.id; card.classList.add("dragging"); e.dataTransfer.effectAllowed = "move";
    };
    card.ondragend = () => { card.classList.remove("dragging"); clearDropMarks(); };
    card.ondragover = e => {
      e.preventDefault();
      clearDropMarks();
      if (card.dataset.id === dragId) return;
      const r = card.getBoundingClientRect();
      card.classList.add(e.clientY < r.top + r.height / 2 ? "drop-before" : "drop-after");
    };
    card.ondrop = e => {
      e.preventDefault();
      const r = card.getBoundingClientRect();
      const before = e.clientY < r.top + r.height / 2;
      const targetId = card.dataset.id;
      clearDropMarks();
      if (dragId === targetId) return;
      moveItem(dragId, before ? targetId : nextVisibleId(targetId));
      persist();
    };
  });
}

function nextVisibleId(targetId) {
  const vis = filtered();
  const idx = vis.findIndex(i => i.id == targetId);
  return idx >= 0 && idx + 1 < vis.length ? vis[idx + 1].id : null;
}

function wireBoard() {
  let dragId = null;

  $("#view-board").querySelectorAll(".grp-head").forEach(head => {
    head.onclick = e => {
      if (e.target.closest(".js-del") || e.target.closest(".js-toggle")) return;
      const grp = head.closest(".grp");
      toggleGroup(grp.dataset.status, grp.dataset.name);
      const open = !isCollapsed(grp.dataset.status, grp.dataset.name);
      grp.classList.toggle("open", open);
      head.dataset.tip = open ? "点击折叠" : "点击展开";
      head.setAttribute("aria-expanded", String(open));
      updateCollapseBtn();
    };
  });

  $("#view-board").querySelectorAll(".ticket").forEach(t => {
    t.ondragstart = e => { dragId = t.dataset.id; t.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; };
    t.ondragend = () => { t.classList.remove("dragging"); clearDropMarks(); };
    t.onclick = () => openModal(items().find(i => i.id == t.dataset.id));
    /* 键盘：Enter/Space 打开任务，Delete 删除（等价于鼠标点卡片与删除按钮） */
    t.onkeydown = e => {
      const target = () => items().find(i => i.id == t.dataset.id);
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openModal(target()); }
      else if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); confirmDelete(target()); }
    };
    t.ondragover = e => {
      e.preventDefault(); e.stopPropagation();
      clearDropMarks();
      if (t.dataset.id !== dragId) t.classList.add("drop-before");
    };
    t.ondrop = e => {
      e.preventDefault(); e.stopPropagation();
      const targetId = t.dataset.id;
      clearDropMarks();
      if (dragId === targetId) return;
      const dragged = items().find(i => i.id == dragId);
      const target = items().find(i => i.id == targetId);
      if (dragged && target) {
        dragged.status = target.status;
        dragged.line = target.line;   // move into the target's outline group
      }
      moveItem(dragId, targetId);
      persist();
    };
  });

  $("#view-board").querySelectorAll(".grp").forEach(grp => {
    grp.ondragover = e => {
      if (e.target.closest(".ticket")) return;
      e.preventDefault();
    };
    grp.ondrop = e => {
      if (e.target.closest(".ticket")) return;
      e.preventDefault();
      const item = items().find(i => i.id == dragId);
      if (!item) return;
      item.status = grp.dataset.status;
      if (grp.dataset.name !== "未分类") item.line = grp.dataset.name;
      moveItem(dragId, null);
      persist();
    };
  });

  $("#view-board").querySelectorAll(".js-del").forEach(btn =>
    btn.onclick = e => { e.stopPropagation(); confirmDelete(items().find(i => i.id == btn.closest(".ticket").dataset.id)); });
  $("#view-board").querySelectorAll(".js-toggle").forEach(btn =>
    btn.onclick = e => { e.stopPropagation(); advanceStatus(items().find(i => i.id == btn.closest(".ticket").dataset.id)); });

  $("#view-board").querySelectorAll(".col").forEach(col => {
    col.ondragover = e => { e.preventDefault(); col.classList.add("drop-hover"); };
    col.ondragleave = () => col.classList.remove("drop-hover");
    col.ondrop = e => {
      if (e.target.closest(".grp")) return;
      col.classList.remove("drop-hover");
      const item = items().find(i => i.id == dragId);
      if (!item) return;
      item.status = col.dataset.status;
      moveItem(dragId, null);
      persist();
    };
  });
}

/* 记录重建前后的焦点与关键滚动位置，整页重绘不再丢失它们 */
function captureViewState() {
  const active = document.activeElement;
  const inside = active && active !== document.body;
  return {
    key: (inside && active.dataset && active.dataset.id) ? active.dataset.id : null,
    scrollY: window.scrollY,
    boardLeft: $("#view-board").scrollLeft || 0,
    csTop: $("#cs-list").scrollTop || 0,
  };
}
function restoreViewState(s) {
  if (s.key) {
    const back = document.querySelector(`.tcard[data-id="${s.key}"], .ticket[data-id="${s.key}"]`);
    if (back) { try { back.focus({ preventScroll: true }); } catch (e) {} }
  }
  $("#view-board").scrollLeft = s.boardLeft;
  $("#cs-list").scrollTop = s.csTop;
  window.scrollTo(0, s.scrollY);
}

function render() {
  const view = captureViewState();

  $("#ts-card").classList.toggle("hidden", currentView !== "timeline");
  $("#view-table").classList.toggle("hidden", currentView !== "table");
  $("#view-board").classList.toggle("hidden", currentView !== "board");
  $("#view-timeline").classList.toggle("hidden", currentView !== "timeline");
  // 圆形统计在看板 / 时间轴视图显示；备忘录仅任务列表视图
  $("#ring-card").classList.toggle("hidden", currentView === "table");
  $("#memo-card").classList.toggle("hidden", currentView !== "table");
  // 全部折叠 / 全部展开：看板与时间轴视图都可用（任务列表视图用任务管理替代）；新建任务仅任务列表视图显示
  $("#btn-collapse").classList.toggle("hidden", currentView !== "board" && currentView !== "timeline");
  $("#btn-new").classList.toggle("hidden", currentView !== "table");
  // 任务管理（批量）仅在任务列表视图显示，切到看板时自动退出
  if (currentView !== "table" && batchMode) { batchMode = false; batchSel.clear(); }
  $("#btn-manage").classList.toggle("hidden", currentView !== "table");
  if (currentView === "table") renderMemo();
  renderTasks();
  animateRows = false;
  restoreViewState(view);

}

/* ---- editor modal (status & priority = one-click chips) ---- */
function openModal(item) {
  if (document.querySelector(".overlay")) return;   /* 已有弹窗时不叠加第二个（同一按钮被重复触发时同理） */
  const editing = !!item;

    <h2>${editing ? "编辑任务" : "新建任务"}</h2>

    <div class="field"><label>截止时间</label>

        <button type="button" class="date-btn" id="m-date-btn" data-tip="选择日期">${CAL_ICON}</button>
        <div class="datepick hidden" id="m-datepick">
          <div class="dp-head">
            <button type="button" class="dp-nav" id="dp-prev" data-tip="上个月">‹</button>
            <div class="dp-title"></div>
            <button type="button" class="dp-nav" id="dp-next" data-tip="下个月">›</button>
          </div>
          <div class="dp-dow"></div>
          <div class="dp-grid"></div>
        </div>
      </div>
    </div>
    <div class="field"><label>状态（点击切换）</label>
      <div class="chips" data-group="status">${chipGroupHTML("status", CONFIG.statuses, d.status)}</div>
    </div>
    <div class="field"><label>优先级（点击切换）</label>
      <div class="chips" data-group="priority">${chipGroupHTML("priority", CONFIG.priorities, d.priority)}</div>
    </div>
    <div class="modal-actions">
      ${editing ? '<button class="link-danger" id="m-del">删除</button>' : ""}
      <div class="spacer"></div>
      <button class="btn ghost" id="m-cancel">取消</button>
      <button class="btn" id="m-save">保存</button>
    </div></div>`;
  document.body.appendChild(overlay);
  wireChipGroups(overlay);

  /* ---- mini date picker ---- */
  (function wireDatePicker() {
    const input = overlay.querySelector("#m-created");
    const btn = overlay.querySelector("#m-date-btn");
    const pick = overlay.querySelector("#m-datepick");
    const title = pick.querySelector(".dp-title");
    const grid = pick.querySelector(".dp-grid");
    pick.querySelector(".dp-dow").innerHTML = WEEK.map(w => `<span>${w}</span>`).join("");
    const init = (input.value && /^\d{4}-\d{2}-\d{2}$/.test(input.value)) ? input.value : todayStr();
    let py = +init.slice(0, 4), pm = +init.slice(5, 7) - 1;

    function draw() {
      title.textContent = `${py} 年 ${pm + 1} 月`;
      const first = new Date(py, pm, 1);
      const startDow = first.getDay();
      const daysInMonth = new Date(py, pm + 1, 0).getDate();
      const daysPrev = new Date(py, pm, 0).getDate();
      const today = todayStr();
      let cells = "";
      for (let i = 0; i < 42; i++) {
        const dayNum = i - startDow + 1;
        const inMonth = dayNum >= 1 && dayNum <= daysInMonth;
        let y = py, m = pm, d = dayNum;
        if (dayNum < 1) { m--; if (m < 0) { m = 11; y--; } d = daysPrev + dayNum; }
        else if (dayNum > daysInMonth) { d = dayNum - daysInMonth; m++; if (m > 11) { m = 0; y++; } }
        const ds = calDateStr(y, m, d);
        cells += `<button type="button" class="dp-day ${inMonth ? "" : "other"} ${ds === today ? "today" : ""} ${ds === input.value ? "sel" : ""}" data-d="${ds}">${d}</button>`;
      }
      grid.innerHTML = cells;
      grid.querySelectorAll(".dp-day").forEach(b => b.onclick = () => {
        input.value = b.dataset.d;
        pick.classList.add("hidden");
      });
    }
    btn.onclick = e => { e.stopPropagation(); pick.classList.toggle("hidden"); if (!pick.classList.contains("hidden")) draw(); };
    pick.onclick = e => e.stopPropagation();
    pick.querySelector("#dp-prev").onclick = () => { pm--; if (pm < 0) { pm = 11; py--; } draw(); };
    pick.querySelector("#dp-next").onclick = () => { pm++; if (pm > 11) { pm = 0; py++; } draw(); };
    draw();
    setTimeout(() => document.addEventListener("click", () => pick.classList.add("hidden"), { once: true }), 0);
  })();

  const close = () => overlay.remove();
  overlay.onclick = e => { if (e.target === overlay) close(); };
  overlay.querySelectorAll(".js-x").forEach(b => b.onclick = close);
  overlay.querySelector("#m-cancel").onclick = close;
  const submit = () => {
    d.name = overlay.querySelector("#m-name").value.trim() || "未命名";
    d.owner = d.owner || "本人";
    d.line = overlay.querySelector("#m-line").value.trim();
    d.created = overlay.querySelector("#m-created").value.trim();
    d.status = chipValue(overlay, "status") || d.status;
    d.priority = chipValue(overlay, "priority") || d.priority;
    if (!editing) items().unshift(d);
    persist(); close();
  };
  overlay.querySelector("#m-save").onclick = submit;
  overlay.querySelectorAll("input").forEach(i => { i.onkeydown = e => { if (e.key === "Enter") submit(); }; });
  overlay.querySelector("#m-name").focus();
  if (editing) overlay.querySelector("#m-del").onclick = () => { close(); confirmDelete(d); };
}

    if (!v) return;
    done = true;
    overlay.dataset.noRefocus = "1";         /* 提交后焦点不还给触发按钮，避免残留的回车又把弹窗点开 */
    close();
    onOk(v);
  };
  overlay.querySelector("#pb-ok").onclick = submit;
  input.onkeydown = e => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    if (e.repeat) return;
    submit();
  };
}

/* ---- outline import ---- */
const BULLET_RE = /^(?:[-*+•·]|\(?\d+[.、)．)）]|（\d+）|[一二三四五六七八九十]+[、.．]|第[一二三四五六七八九十百\d]+[章节部分篇]|[①②③④⑤⑥⑦⑧⑨⑩])\s*/;

/* 复制自 AI 回答的 LaTeX 命令 → 对应符号；表里没有的命令直接丢弃 */
const LATEX_MAP = {
  rightarrow: "→", to: "→", longrightarrow: "⟶", Rightarrow: "⇒",
  leftarrow: "←", leftrightarrow: "↔", Leftrightarrow: "⇔",
  uparrow: "↑", downarrow: "↓", mapsto: "↦",
};

/* 清洗从其他软件复制来的大纲：去 BOM/零宽/乱码字符，全角空格转半角，剥离 Markdown 与 LaTeX 残留 */
function sanitizeOutline(text) {
  return String(text)
    .replace(/\r\n?|\u2028|\u2029/g, "\n")                  // 统一换行
    .replace(/[\uFEFF\u200B-\u200F\u2060\u00AD\uFFFD]/g, "") // BOM / 零宽字符 / 软连字符 / 乱码替换符
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g, "")       // 控制字符
    .split("\n")
    .map(l => {
      l = l.replace(/[\u3000\u00A0]/g, " ");                 // 全角 / 不换行空格 → 半角
      const ind = (l.match(/^[ \t]*/) || [""])[0];           // 保留缩进（用于判定阶段层级）
      const rest = l.slice(ind.length)
        .replace(/\*\*|__|~~|`/g, "")                        // 粗体、下划线、删除线、反引号
        /* 复制自 AI 回答的 LaTeX 残留（如 $\rightarrow$）：还原符号 → 剥离定界符 → 丢弃残余命令 */
        .replace(/\\text(bf|it|rm|sf|tt)?\{([^}]*)\}/g, "$2")    // \text{...} / \textbf{...} 只取内容
        .replace(/\\\(|\\\)|\\\[|\\\]/g, "")                 // 公式定界符 \( \) \[ \]
        .replace(/\$\$?([^$]*)\$\$?/g, "$1")                 // $...$ / $$...$$ 定界符（保留内容）
        .replace(/\\([a-zA-Z]+)/g, (m, c) => LATEX_MAP[c] || "") // \命令 → 符号，其余丢弃
        .replace(/^#{1,6}\s*/, "")                           // Markdown 标题 #
        .replace(/^(?:[-*+•·→←↔⇔⇒⟶↑↓]\s*)+/, "")            // 行首列表符号（含箭头，可重复）
        .replace(/^\*+|\*+$/g, "")                           // 残留的成对 * 强调
        .replace(/[ \t]{2,}/g, " ")                          // 折叠多余空格
        .replace(/^[ \t]+|[ \t]+$/g, "");                    // 去除两端空白
      return ind + rest;
    })
    .filter(l => l.trim())                                   // 丢弃纯空白行
    .join("\n");
}

function parseOutline(text, topOnly, colonOnly) {
  text = sanitizeOutline(text);
  const raw = [];
  text.split(/\r?\n/).forEach(l => {
    if (!l.trim()) return;
    const indent = l.match(/^[ \t]*/)[0].replace(/\t/g, "    ").length;
    /* 去行首编号/符号；开启「只取冒号前」时，再取第一个冒号（「：」或「: 」）之前的标题 */
    let name = l.trim().replace(BULLET_RE, "").replace(/^[:：]\s*/, "");
    if (colonOnly) name = name.split(/：|:\s/)[0];
    name = name.replace(/[:：]\s*$/, "").trim();
    if (name) raw.push({ indent, name });
  });
  if (!raw.length) return [];
  const minIndent = Math.min(...raw.map(r => r.indent));
  raw.forEach(r => r.level = r.indent === minIndent ? 0 : 1);

  /* 只保留大标题：仅取最外层一级条目，忽略其下所有子条目 */
  if (topOnly) return raw.filter(r => r.level === 0).map(r => ({ name: r.name, line: "" }));

  const out = [];
  for (let i = 0; i < raw.length; i++) {
    const cur = raw[i];
    const hasChildren = i + 1 < raw.length && raw[i + 1].level > cur.level;
    if (cur.level === 0 && hasChildren) {
      let j = i + 1;
      while (j < raw.length && raw[j].level > 0) { out.push({ name: raw[j].name, line: cur.name }); j++; }
      i = j - 1;
    } else {
      out.push({ name: cur.name, line: "" });
    }
  }
  return out;
}

function openImportModal() {
  const overlay = document.createElement("div");
  overlay.className = "overlay";

    <div class="field">
      <textarea id="imp-text" placeholder="例：
一、文献综述
