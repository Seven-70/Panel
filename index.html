    </div>
    <div class="imp-opts">
      <label class="imp-top"><input type="checkbox" id="imp-top-only" />只保留大标题（忽略所有子条目，仅把最外层一级标题生成任务）</label>
      <label class="imp-top"><input type="checkbox" id="imp-colon-only" checked />只取冒号前的标题（丢弃「：」后面的说明文字）</label>
    </div>
    <div class="imp-tip">每条任务的「所属阶段」均可<b>单独设置</b>：直接输入，或从已有阶段的下拉中选择，例如 <span class="imp-tag">文献综述</span> <span class="imp-tag">问卷调研</span>；留空则归入「导入」。</div>
    <div class="imp-preview" id="imp-preview"></div>
    <div class="modal-actions">
      <div class="spacer"></div>
      <button class="btn ghost" id="imp-cancel">取消</button>
      <button class="btn" id="imp-ok">导入任务</button>
    </div></div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  const ta = overlay.querySelector("#imp-text");
  const preview = overlay.querySelector("#imp-preview");
  const okBtn = overlay.querySelector("#imp-ok");
  const topOnlyEl = overlay.querySelector("#imp-top-only");
  const colonOnlyEl = overlay.querySelector("#imp-colon-only");

  const statusOpts = CONFIG.statuses.map(s => `<option value="${esc(s.key)}">${esc(s.label)}</option>`).join("");
  const prioOpts = CONFIG.priorities.map(p => `<option value="${esc(p.key)}">${esc(p.key)}</option>`).join("");

  let parsed = [];   // [{ name, line, status, priority, on }]

  /* 单行「所属阶段」下拉：未设置 + 项目/预览里已有的全部阶段 + ＋自定义 */
  const lineOptsFor = (val) => {
    const v = (val || "").trim();
    const known = [...new Set([...items().map(i => i.line), ...parsed.map(t => t.line)]
      .map(x => (x || "").trim()).filter(Boolean))];
    const opts = known.map(n => `<option value="${esc(n)}"${n === v ? " selected" : ""}>${esc(n)}</option>`).join("");
    return `<option value=""${v ? "" : " selected"}>未设置</option>${opts}`
      + `<option value="__custom__"${v && !known.includes(v) ? " selected" : ""}>＋ 自定义…</option>`;
  };

  /* 把预览区的当前编辑内容写回 parsed（名称 / 阶段 / 状态 / 优先级 / 截止 / 是否导入） */
  const collect = () => {
    preview.querySelectorAll(".imp-row").forEach(r => {
      const i = +r.dataset.i;
      if (!parsed[i]) return;
      parsed[i].name = r.querySelector(".imp-name").value;
      const pick = r.querySelector(".imp-sel-line-pick");
      parsed[i].line = pick.value === "__custom__" ? r.querySelector(".imp-sel-line").value.trim() : pick.value;
      parsed[i].status = r.querySelector(".imp-sel-status").value;
      parsed[i].priority = r.querySelector(".imp-sel-prio").value;
      parsed[i].created = r.querySelector(".imp-date").value;
      parsed[i].on = r.querySelector(".imp-check").checked;
    });
  };

  /* 刷新各分组已选数量、总待导入数量与按钮状态 */
  const refreshCounts = () => {
    let total = 0;
    preview.querySelectorAll(".imp-group").forEach(g => {
      const rows = [...g.querySelectorAll(".imp-row")];
      const on = rows.filter(r => r.querySelector(".imp-check").checked).length;
      total += on;
      const cnt = g.querySelector(".imp-gcount");
      if (cnt) cnt.textContent = `已选 ${on}/${rows.length}`;
      const gc = g.querySelector(".imp-gcheck");
      if (gc) { gc.checked = on > 0 && on === rows.length; gc.indeterminate = on > 0 && on < rows.length; }
    });
    const t = preview.querySelector(".imp-total");
    if (t) t.textContent = `待导入 ${total} 条`;
    okBtn.disabled = total === 0;
  };

  const updatePreview = () => {
    parsed = parseOutline(ta.value, topOnlyEl.checked, colonOnlyEl.checked).map(t => ({ ...t, status: "todo", priority: "常规", created: "", on: true }));
    renderPreview();
  };
  ta.oninput = updatePreview;
  topOnlyEl.onchange = updatePreview;
  colonOnlyEl.onchange = updatePreview;

  const renderPreview = () => {
    if (!parsed.length) {
      preview.innerHTML = `<div class="imp-more">粘贴任务文本后在此预览</div>`;
      okBtn.disabled = true;
      return;
    }
    const groups = [];
    const index = {};
    parsed.forEach((t, i) => {
      const g = t.line || "导入";
      if (!(g in index)) { index[g] = groups.length; groups.push({ name: g, rows: [] }); }
      groups[index[g]].rows.push({ ...t, i });
    });
    preview.innerHTML = `<div class="imp-count">识别到 ${parsed.length} 条任务 · ${groups.length} 个阶段　<span class="imp-total"></span></div>` +
      groups.map(g => `<div class="imp-group">
        <div class="imp-group-head">
          <input type="checkbox" class="imp-gcheck" data-tip="全选 / 取消本组" checked>
          <span class="imp-group-title">${esc(g.name)}</span>
          <span class="imp-gcount"></span>
        </div>
        ${g.rows.map(r => `<div class="imp-row" data-i="${r.i}">
          <div class="imp-line1">
            <input type="checkbox" class="imp-check" data-tip="是否导入此任务" checked>
            <input class="imp-name" value="${esc(r.name)}" data-tip="${esc(r.name)}" placeholder="任务名称" />
          </div>
          <div class="imp-line2">
            <span class="imp-dlabel">阶段</span>
            <select class="imp-sel-line-pick" data-tip="所属阶段">${lineOptsFor(r.line)}</select>
            <input class="imp-sel-line" placeholder="输入新阶段名" data-tip="自定义所属阶段" value="${esc(r.line || "")}" hidden />
            <select class="imp-sel-status" data-tip="状态">${statusOpts.replace(`value="${esc(r.status)}"`, `value="${esc(r.status)}" selected`)}</select>
            <select class="imp-sel-prio" data-tip="优先级">${prioOpts.replace(`value="${esc(r.priority)}"`, `value="${esc(r.priority)}" selected`)}</select>
            <span class="imp-dlabel">截止</span>
            <input type="date" class="imp-date" data-tip="截止时间" value="${esc(r.created || "")}" />
          </div>
        </div>`).join("")}
      </div>`).join("");

    patchSelects(preview);   // 预览区新生成的 select 也换成自定义浮层

    /* 绑定行内交互（不整体重绘，避免输入时失焦） */
    preview.querySelectorAll(".imp-name").forEach(inp => inp.oninput = () => {
      const i = +inp.closest(".imp-row").dataset.i;
      if (parsed[i]) parsed[i].name = inp.value;
    });
    /* 阶段逐条可改：下拉直接选已有阶段；选「＋ 自定义…」则切换为输入框输入新阶段 */
    preview.querySelectorAll(".imp-sel-line-pick").forEach(sel => {
      sel.onchange = () => {
        const row = sel.closest(".imp-row");
        const txt = row.querySelector(".imp-sel-line");
        if (sel.value === "__custom__") { txt.hidden = false; txt.value = ""; txt.focus(); return; }
        txt.hidden = true;
        const i = +row.dataset.i;
        if (parsed[i]) parsed[i].line = sel.value;
        collect(); renderPreview();
      };
    });
    preview.querySelectorAll(".imp-sel-line").forEach(inp => {
      inp.oninput = () => {
        const i = +inp.closest(".imp-row").dataset.i;
        if (parsed[i]) parsed[i].line = inp.value;
      };
      inp.onchange = () => { collect(); renderPreview(); };
    });
    preview.querySelectorAll(".imp-check").forEach(cb => cb.onchange = () => {
      cb.closest(".imp-row").classList.toggle("off", !cb.checked);
      refreshCounts();
    });
    preview.querySelectorAll(".imp-gcheck").forEach(gc => gc.onchange = () => {
      gc.closest(".imp-group").querySelectorAll(".imp-check").forEach(cb => {
        cb.checked = gc.checked;
        cb.closest(".imp-row").classList.toggle("off", !cb.checked);
      });
      refreshCounts();
    });
    refreshCounts();
  };

  updatePreview();
  ta.focus();

  overlay.onclick = e => { if (e.target === overlay) close(); };
  overlay.querySelectorAll(".js-x").forEach(b => b.onclick = close);
  overlay.querySelector("#imp-cancel").onclick = close;
  okBtn.onclick = () => {
    collect();
    const toAdd = parsed.filter(t => t.on && t.name.trim());
    if (!toAdd.length) { toast("没有勾选任何任务"); return; }
    const list = items();
    let nextId = Math.max(Date.now(), ...list.map(i => +i.id || 0));
    toAdd.forEach(t => list.push({
      id: ++nextId, name: t.name.trim(), status: t.status, owner: "本人",
      priority: t.priority, line: (t.line || "导入").trim() || "导入", created: t.created || "",
    }));
    persist(); close();
    toast(`已导入 ${toAdd.length} 条任务`);
  };
}

/* ---- backup & restore ---- */
function exportBackup() {
  const payload = {
    app: "lunwen-kanban",
    version: 1,
    exportedAt: new Date().toISOString(),
    data,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0, 10).replace(/-/g, "");
  a.href = URL.createObjectURL(blob);
  a.download = `kanban-backup-${stamp}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast("备份已导出为 JSON 文件");
}

/* 备份设置：导出 / 恢复 / 拖入与粘贴恢复 / 存储位置查看，整合在一处（入口在左侧视图栏） */
function openBackupModal() {
  const proj = activeProject();
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `<div class="modal bk-modal" style="width:480px">
    <button class="modal-x js-x" data-tip="关闭">${X_ICON}</button>
    <h2>备份设置</h2>
    <div class="sub">当前项目「${esc(proj.name)}」共 <b>${proj.items.length}</b> 条任务。</div>

    <div class="bk-up" id="bk-drop" role="button" tabindex="0" data-tip="也可以点击选择文件">
      <div class="bk-up-grid" aria-hidden="true"></div>
      <div class="bk-up-inner">
        <p class="bk-up-title">恢复备份</p>
        <p class="bk-up-hint">拖入备份文件，或点击选择、Ctrl/⌘ + V 粘贴</p>
        <div class="bk-up-stack">
          <div class="bk-up-card">
            <span class="bk-up-drop">松开即可恢复</span>
            <i class="bi bi-upload" aria-hidden="true"></i>
          </div>
          <span class="bk-up-outline" aria-hidden="true"></span>
        </div>
      </div>
    </div>

    <div class="bk-store">
      <div class="bk-store-row"><span>存储位置</span><b>浏览器本地存储</b><span>· 导出的备份在浏览器下载文件夹</span></div>
    </div>

    <div class="modal-actions">
      <div class="spacer"></div>
      <button class="btn ghost" id="bk-export">导出备份</button>
      <button class="btn ghost" id="bk-restore">恢复备份</button>
    </div></div>`;
  document.body.appendChild(overlay);

  const close = () => overlay.remove();
  const pickFile = () => {
    const input = $("#file-restore");
    input.value = "";
    input.click();
  };
  /* 拖入 / 粘贴拿到文件后：先收起本面板，再走原有的「覆盖恢复」二次确认 */
  const takeFile = f => { close(); restoreBackup(f); };

  const drop = overlay.querySelector("#bk-drop");
  const enter = e => { e.preventDefault(); drop.classList.add("is-over"); };
  const leave = e => { e.preventDefault(); drop.classList.remove("is-over"); };
  drop.addEventListener("dragenter", enter);
  drop.addEventListener("dragover", enter);
  drop.addEventListener("dragleave", leave);
  drop.addEventListener("dragend", leave);
  drop.addEventListener("drop", e => {
    e.preventDefault();
    drop.classList.remove("is-over");
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) takeFile(f);
    else toast("没有读到文件，请拖入导出的 JSON 备份", true);
  });
  drop.onclick = pickFile;
  drop.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pickFile(); } };

  /* 粘贴：剪贴板里是文件就直接用；是文本且像备份 JSON 就包装成文件 */
  overlay.addEventListener("paste", e => {
    const cd = e.clipboardData;
    if (!cd) return;
    const f = cd.files && cd.files[0];
    if (f) { e.preventDefault(); takeFile(f); return; }
    const text = cd.getData("text/plain") || "";
    if (/"projects"\s*:/.test(text)) {
      e.preventDefault();
      takeFile(new File([text], "pasted-backup.json", { type: "application/json" }));
    }
  });

  overlay.onclick = e => { if (e.target === overlay) close(); };
  overlay.querySelectorAll(".js-x").forEach(b => b.onclick = close);
  overlay.querySelector("#bk-export").onclick = () => { exportBackup(); close(); };
  overlay.querySelector("#bk-restore").onclick = () => { pickFile(); close(); };
}

function restoreBackup(file) {
  const reader = new FileReader();
  reader.onerror = () => toast("恢复失败：文件读取失败");
  reader.onload = () => {
    let parsed;
    try { parsed = JSON.parse(reader.result); } catch (e) { return toast("恢复失败：不是合法的 JSON 文件"); }
    const d = (parsed && typeof parsed === "object" && !Array.isArray(parsed) && "data" in parsed) ? parsed.data : parsed;
    const looksValid = Array.isArray(d) || (d && typeof d === "object" && Array.isArray(d.projects));
    if (!looksValid) return toast("恢复失败：备份文件缺少 projects 字段");
    /* 先做深度规范化与校验，不合格就直接拒绝，不进入覆盖确认弹窗 */
    const incoming = normalizeData(d);
    if (!incoming.projects.length) return toast("恢复失败：备份里没有可用的项目");
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML = `<div class="modal" style="width:380px">
      <button class="modal-x js-x" data-tip="关闭">${X_ICON}</button>
      <h2>恢复备份</h2>
      <div class="sub">即将用备份数据<b>覆盖</b>当前全部项目与任务，此操作不可撤销。确定恢复？</div>
      <div class="modal-actions">
        <div class="spacer"></div>
        <button class="btn ghost" id="rb-cancel">取消</button>
        <button class="btn danger" id="rb-ok">覆盖恢复</button>
      </div></div>`;
    document.body.appendChild(overlay);
    const close = () => overlay.remove();
    overlay.onclick = e => { if (e.target === overlay) close(); };
    overlay.querySelectorAll(".js-x").forEach(b => b.onclick = close);
    overlay.querySelector("#rb-cancel").onclick = close;
    overlay.querySelector("#rb-ok").onclick = () => {
      data = incoming;
      animateRows = true;
      persist(); close();
      toast("备份已恢复");
    };
  };
  reader.readAsText(file);
}

/* ---- calendar ---- */
const WEEK = ["日", "一", "二", "三", "四", "五", "六"];
let calYear = 0, calMonth = 0, calSelected = null;   // month is 0-based; selected = "YYYY-MM-DD"

function calDateStr(y, m, d) {
  return `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
}

/* 距离今天的天数：正数为「几天后」，0 为今天，负数为已过期几天 */
const daysFromToday = ds => Math.round((new Date(ds) - new Date(todayStr())) / 86400000);

/* 自定义悬停提示：鼠标跟随显示，键盘聚焦同样能触发，读屏通过 aria-describedby 关联 */
let tipEl = null;
let tipAnchor = null;
let suppressTip = false;   // 弹窗关闭「还焦点」期间屏蔽提示，避免残留一个停在原处的小弹窗
function ensureTip() {
  if (!tipEl) {
    tipEl = document.createElement("div");
    tipEl.id = "app-tip";
    tipEl.className = "tip";
    tipEl.setAttribute("role", "tooltip");
    document.body.appendChild(tipEl);
  }
  return tipEl;
}
function showTip(text, x, y) {
  const el = ensureTip();
  if (el.textContent !== text) el.textContent = text;
  el.style.display = "block";
  const r = el.getBoundingClientRect();
  const left = Math.max(6, Math.min(x - r.width / 2, window.innerWidth - r.width - 6));
  /* 默认贴在指针下方：不遮挡正在看的内容；下方空间不够时才翻到上方 */
  const below = y + 18;
  const top = below + r.height > window.innerHeight - 6 ? Math.max(6, y - r.height - 10) : below;
  el.style.left = `${left}px`;
  el.style.top = `${top}px`;
}
function hideTip() {
  if (tipEl) tipEl.style.display = "none";
  if (tipAnchor) { tipAnchor.removeAttribute("aria-describedby"); tipAnchor = null; }
}
/* 键盘聚焦时按元素位置展示，并把提示与元素用 aria-describedby 关联起来 */
function showTipFor(el) {
  const text = el.getAttribute("data-tip");
  if (!text) return;
  if (tipAnchor && tipAnchor !== el) tipAnchor.removeAttribute("aria-describedby");
  tipAnchor = el;
  el.setAttribute("aria-describedby", "app-tip");
  const r = el.getBoundingClientRect();
  showTip(text, r.left + r.width / 2, r.bottom);   // 传元素下边缘，提示落在元素下方
}

/* 全局统一悬停提示：所有 data-tip 元素共用日历同款的提示样式。
   事件委托 + mouseover，比浏览器原生提示更早触发，因此不会出现默认样式的悬停提示 */
document.addEventListener("mouseover", e => {
  if (tipAnchor) return;   // 键盘聚焦期间不让鼠标抢走提示
  const el = e.target instanceof Element ? e.target.closest("[data-tip]") : null;
  const text = el ? el.getAttribute("data-tip") : "";
  if (text) showTip(text, e.clientX, e.clientY);
  else hideTip();
});
let tipRaf = 0, tipPt = null;
document.addEventListener("mousemove", e => {
  if (tipAnchor || !tipEl || tipEl.style.display !== "block") return;
  tipPt = e;
  if (tipRaf) return;
  tipRaf = requestAnimationFrame(() => {
    tipRaf = 0;
    const el = tipPt.target instanceof Element ? tipPt.target.closest("[data-tip]") : null;
    const text = el ? el.getAttribute("data-tip") : "";
    if (text) showTip(text, tipPt.clientX, tipPt.clientY);
  });
}, { passive: true });
document.addEventListener("mouseleave", hideTip);
window.addEventListener("blur", hideTip);
/* 键盘路径：聚焦带提示的元素时显示，失焦隐藏 */
document.addEventListener("focusin", e => {
  /* 弹窗关闭把焦点还给来源元素时，跳过这次提示并收起已有的，避免留下一个「停在原处」的小弹窗 */
  if (suppressTip) { suppressTip = false; hideTip(); return; }
  const el = e.target instanceof Element ? e.target.closest("[data-tip]") : null;
  if (el) showTipFor(el); else hideTip();
});
document.addEventListener("focusout", hideTip);

/* ---- 弹窗统一无障碍与焦点管理 ----
   任何 .overlay 被挂到 body 上都会自动补上 role/aria，并接管：
   Tab 在弹窗内循环、Esc 关闭栈顶弹窗、关闭后把焦点还给来源元素 */
const dialogStack = [];
let dlgSeq = 0;
let lastFocus = null;
document.addEventListener("focusin", e => {
  if (!(e.target instanceof Element && e.target.closest(".overlay"))) lastFocus = e.target;
}, true);

function dialogFocusables(root) {
  return [...root.querySelectorAll("a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex='-1'])")]
    .filter(el => el.offsetParent !== null || el === document.activeElement);
}
function closeTopDialog() {
  const entry = dialogStack[dialogStack.length - 1];
  if (entry) entry.overlay.remove();   // 移除动作由下面的观察者统一收尾
}
document.addEventListener("keydown", e => {
  if (!dialogStack.length) return;
  if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); closeTopDialog(); return; }
  if (e.key !== "Tab") return;
  const top = dialogStack[dialogStack.length - 1].overlay;
  const list = dialogFocusables(top);
  const modal = top.querySelector(".modal");
  if (!list.length) { e.preventDefault(); if (modal) modal.focus(); return; }
  const first = list[0], last = list[list.length - 1];
  const active = document.activeElement;
  if (active === modal || !top.contains(active)) { e.preventDefault(); (e.shiftKey ? last : first).focus(); }
  else if (e.shiftKey && active === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && active === last) { e.preventDefault(); first.focus(); }
}, true);

const dialogObserver = new MutationObserver(muts => {
  muts.forEach(m => m.addedNodes.forEach(n => {
    if (n.nodeType !== 1 || !n.classList || !n.classList.contains("overlay")) return;
    const modal = n.querySelector(".modal");
    if (!modal) return;
    const h2 = modal.querySelector("h2");
    if (h2) { h2.id = "dlg-title-" + (++dlgSeq); modal.setAttribute("aria-labelledby", h2.id); }
    modal.setAttribute("role", "dialog");
    modal.setAttribute("aria-modal", "true");
    modal.setAttribute("tabindex", "-1");
    n.querySelectorAll(".modal-x").forEach(b => { if (!b.hasAttribute("aria-label")) b.setAttribute("aria-label", "关闭"); });
    dialogStack.push({ overlay: n, prev: lastFocus });
    requestAnimationFrame(() => {
      if (!n.contains(document.activeElement) && modal.isConnected) {
        try { modal.focus({ preventScroll: true }); } catch (e) {}
      }
    });
  }));
  muts.forEach(m => m.removedNodes.forEach(n => {
    if (n.nodeType !== 1 || !n.classList || !n.classList.contains("overlay")) return;
    let entry = null;
    for (let i = dialogStack.length - 1; i >= 0; i--) {
      if (dialogStack[i].overlay === n) { entry = dialogStack.splice(i, 1)[0]; break; }
    }
    /* 关闭后把焦点还给来源元素；来源已被删除（如删掉的任务卡）则不动。
       标记了 noRefocus 的弹窗（确认提交型，如新建/重命名项目）不还焦点，
       否则用户再按一次回车就会重新激活来源按钮、把同一个弹窗又打开。 */
    if (entry && n.dataset.noRefocus !== "1" && entry.prev && document.contains(entry.prev) && typeof entry.prev.focus === "function"
        && (document.activeElement === document.body || document.activeElement === null)) {
      suppressTip = true;   /* 这次「还焦点」不弹提示，避免残留小弹窗 */
      try { entry.prev.focus({ preventScroll: true }); } catch (e) {}
      suppressTip = false;
    }
  }));
});
dialogObserver.observe(document.body, { childList: true });

/* 距离最近任务倒计时
   - 默认：按截止时间升序，显示「日期最近」的那个任务（不限状态，已完成也参与）
   - 点击日历某个日期后：自动切换为距离该日期还有多少天，再点一次取消选中
   所有状态统一为「数字+标题 / 副标题」两行结构，固定高度不随内容变化 */
function renderCountdown() {
  const box = $("#cd-box");
  const today = todayStr();
  const diffDays = ds => Math.round((new Date(ds) - new Date(today)) / 86400000);
  const fill = (num, title, sub, empty) => {
    box.className = empty ? "cd-box is-empty" : "cd-box";
    box.innerHTML = `
      <div class="cd-row1">
        ${num !== "" ? `<div class="cd-num">${num}</div>` : ""}
        <div class="cd-title">${title}</div>
      </div>
      <div class="cd-sub" data-tip="${esc(sub)}">${esc(sub)}</div>`;
  };

  // 日历点击了某个日期 → 显示距离该日期的倒计时
  if (calSelected) {
    const diff = diffDays(calSelected);
    const [, m, d] = calSelected.split("-").map(Number);
    const list = items().filter(i => String(i.created || "") === calSelected);
    const num = diff === 0 ? "今天" : Math.abs(diff);
    const title = diff > 0 ? `天后 · 距 ${m}月${d}日` : diff === 0 ? `${m}月${d}日 · 当天` : `天前 · ${m}月${d}日 已过`;
    fill(num, title, list.length ? `${list.length} 个任务截止` : "这天没有截止的任务", !list.length);
    return;
  }

  // 默认：按截止日期升序，取「日期最近」的那个任务（不限状态，已完成也参与，不再被跳过）
  const upcoming = items()
    .filter(i => /^\d{4}-\d{2}-\d{2}$/.test(String(i.created || "")) && String(i.created) >= today)
    .sort((a, b) => String(a.created).localeCompare(String(b.created)));
  if (!upcoming.length) {
    fill("", "暂无任务", "没有设置了日期的任务", true);
    return;
  }
  const next = upcoming[0];
  const diff = diffDays(next.created);
  fill(
    diff === 0 ? "今天" : diff,
    diff === 0 ? "有任务截止" : "天后 · 距最近任务",
    `${next.name} · ${next.created.slice(5).replace("-", "/")}`,
    false
  );
}

function renderCalendar() {
  hideTip();   // 列表重建时收起悬停提示，避免残留
  renderCountdown();
  const first = new Date(calYear, calMonth, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const daysPrev = new Date(calYear, calMonth, 0).getDate();
  $("#cal-title").textContent = `${calYear} 年 ${calMonth + 1} 月`;

  // date -> { count, dots: [colors] } from task deadlines (up to 3 dots)
  const marks = {};
  items().forEach(i => {
    const v = String(i.created || "");
    if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) return;
    if (!marks[v]) marks[v] = { count: 0, dots: [] };
    marks[v].count++;
    if (marks[v].dots.length < 3) marks[v].dots.push(prioOf(i.priority).accent);
  });

  const today = todayStr();
  let cells = "";
  for (let i = 0; i < 42; i++) {
    const dayNum = i - startDow + 1;
    const inMonth = dayNum >= 1 && dayNum <= daysInMonth;
    let y = calYear, m = calMonth, d = dayNum;
    if (dayNum < 1) { m--; if (m < 0) { m = 11; y--; } d = daysPrev + dayNum; }
    else if (dayNum > daysInMonth) { d = dayNum - daysInMonth; m++; if (m > 11) { m = 0; y++; } }
    const ds = calDateStr(y, m, d);
    const mark = marks[ds];
    const cls = ["cal-day", inMonth ? "" : "other", ds === today ? "today" : "", ds === calSelected ? "selected" : "", mark ? "has-mark" : ""].filter(Boolean).join(" ");
    cells += `<button type="button" class="${cls}" data-d="${ds}" ${inMonth ? "" : "disabled"} data-tip="${mark ? mark.count + " 个任务截止" : ""}">
      <span>${d}</span>
      <span class="dots">${(mark?.dots || []).map(c => `<i style="background:${c}"></i>`).join("")}</span>
    </button>`;
  }
  $("#cal-grid").innerHTML =
    WEEK.map(w => `<div class="cal-dow">${w}</div>`).join("") + cells;

  $("#cal-grid").querySelectorAll(".cal-day:not(:disabled)").forEach(btn =>
    btn.onclick = () => {
      const ds = btn.dataset.d;
      const [y, m] = ds.split("-").map(Number);
      if (y !== calYear || m - 1 !== calMonth) { calYear = y; calMonth = m - 1; }
      calSelected = calSelected === ds ? null : ds;
      renderCalendar();
    });

  // 右侧任务列表：选中日期的任务，未选中时显示今天的任务，按截止时间升序
  const focus = calSelected || today;
  let list = items()
    .filter(i => String(i.created || "") === focus)
    .sort((a, b) => String(a.created).localeCompare(String(b.created)));
  /* 该日期没有截止任务时，改为展示「即将截止」的任务（不限状态，按截止时间升序）
     基准是「选中的日期」（未选中时为今天），只列不早于该日期的任务，例如点了 26 号就不该再出现 25 号的 */
  let head = "";
  if (!list.length) {
    list = items()
      .filter(i => /^\d{4}-\d{2}-\d{2}$/.test(String(i.created || "")) && String(i.created) >= focus)
      .sort((a, b) => String(a.created).localeCompare(String(b.created)));
    head = (calSelected ? "这一天没有截止的任务" : "今天没有截止的任务") + (list.length ? " · 即将截止" : "");
  }
  const rows = list.map(i => {
    const dd = daysFromToday(String(i.created || ""));
    const when = dd > 0 ? `${dd} 天后` : dd === 0 ? "今天截止" : `已过期 ${-dd} 天`;
    return `<div class="cs-item" data-tip="${esc(i.name)}（${when}）">
      <button type="button" class="cs-name js-open" data-id="${i.id}">${esc(i.name)}</button>
      ${head ? `<span class="cs-date">${esc(String(i.created).slice(5))}</span>` : ""}
      <span class="badge" style="background:${tone(statusOf(i.status).color)};color:${toneText(statusOf(i.status).text)}">${statusOf(i.status).label}</span>
    </div>`;
  }).join("");
  $("#cs-list").innerHTML = rows
    ? (head ? `<div class="cs-empty">${head}</div>` : "") + rows
    : `<div class="cs-empty">${head || (calSelected ? "这一天没有截止的任务" : "今天没有截止的任务")}<br/>点击日历上的日期查看</div>`;
  $("#cs-list").querySelectorAll(".js-open").forEach(el =>
    el.onclick = () => openModal(items().find(i => i.id == el.dataset.id)));
}

function initCalendar() {
  const now = new Date();
  calYear = now.getFullYear();
  calMonth = now.getMonth();
  $("#cal-prev").onclick = () => { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } renderCalendar(); };
  $("#cal-next").onclick = () => { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } renderCalendar(); };
  $("#cal-today").onclick = () => {
    const now = new Date();
    calYear = now.getFullYear();
    calMonth = now.getMonth();
    calSelected = null;   // 只跳回今天所在的月份，不把今天标记为「选中」
    renderCalendar();
  };
}

/* ---- 桌面端：点击侧栏里的视图 / 功能项后不立刻收回，等指针移开侧栏再收 ----
   点击会让按钮拿到焦点，:focus-within 会一直把侧栏撑开、指针移开也不收；
   所以指针离开侧栏时把焦点还回去，让 :focus-within 失效，侧栏才能收起。
   键盘用户（Enter / 方向键）指针通常不在侧栏上，不会触发这里的收合，焦点与展开态保留。 */
sideBar.addEventListener("mouseleave", () => {
  const el = document.activeElement;
  if (el && el !== document.body && sideBar.contains(el)) el.blur();
});

/* ---- wire controls ---- */
const tabs = [...document.querySelectorAll(".tab")];
function selectView(view, focusTab) {
  tabs.forEach(t => {
    const on = t.dataset.view === view;
    t.classList.toggle("active", on);
    if (on) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current");
  });
  currentView = view;
  animateRows = true;
  render();
  if (focusTab) focusTab.focus();
}
tabs.forEach((tab, i) => {
  tab.onclick = () => { setDrawer(false); selectView(tab.dataset.view); };
  /* 方向键在视图之间移动焦点并切换，符合 tablist 的键盘习惯 */
  tab.onkeydown = e => {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft" && e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
    e.preventDefault();
    const dir = (e.key === "ArrowRight" || e.key === "ArrowDown") ? 1 : -1;
    const next = tabs[(i + dir + tabs.length) % tabs.length];
    selectView(next.dataset.view, next);
  };
});

function runSearch() {

/* ================= Cult UI「Halo Search」：流动渐变光晕 + 逐字提示 + 清空模糊消散 =================
   参考 https://www.cult-ui.com/docs/components/halo-search
   移植它的三层视觉：① 药丸里衬外透出的流动渐变光晕（光晕靠 CSS 关键帧循环，
   聚焦变亮、清空时切暖色快扫）；② 提示文案逐字错峰淡入，清空后重放一次；
   ③ 清空时真文本隐去、替身文本从右到左逐字模糊消散。
   原组件左侧的 WebGL「Warp」着色器头像按需求未移植。 */
(function haloSearch() {
  const root = document.getElementById("halo-search");
  const input = document.getElementById("search");
  if (!root || !input) return;
  const phBox = root.querySelector(".halo-ph");
  const ghostBox = root.querySelector(".halo-ghost");
  const stat = root.querySelector(".halo-stat");
  const clearBtn = root.querySelector(".halo-clear");

  const PH_TEXT = "搜索任务名称…";
  const CLIP_MS = 340;                  // 单字裁剪时长，与原组件一致
  const SWEEP_MS = CLIP_MS * 1.5;       // 整体扫除时长
  const MAX_STAGGER_SEC = 0.85;         // 长串时压缩逐字错峰跨度，避免动画拖太久
  const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;

  let lastValue = "";                   // 上一次的搜索词，用来判断「这是一次清空」
  let ghostTimer = 0;

  /* 把一串文本拆成逐字 span：重复字符也各自独立，方便分别延时 */
  function glyphs(text, decorate) {
    const counts = new Map();
    return Array.from(text, (ch, i) => {
      const n = counts.get(ch) || 0;
      counts.set(ch, n + 1);
      const s = document.createElement("span");
      s.textContent = ch === " " ? "\u00A0" : ch;
      decorate(s, i, `${ch}-${n}`);
      return s;
    });
  }

  /* 每个字的动画时长与错峰步长：字数越多节奏越快，整体跨度封顶 */
  function glyphTiming(animatedCount, staggerCount) {
    const sweep = SWEEP_MS / 1000;
    const ac = Math.max(1, animatedCount), sc = Math.max(1, staggerCount);
    const norm = Math.min(1, Math.max(0, (ac - 1) / 60));
    const speed = 1 - 0.6 * (1 - Math.pow(1 - norm, 3));
    const dur = Math.max(0.12, Math.max(0.22, sweep * 0.45) * speed);
    let step = Math.max(0.004, Math.max(0.012, sweep * 0.03) * speed);
    const gap = Math.max(0, sc - 1), span = gap * step;
    if (span > MAX_STAGGER_SEC && span > 0) step *= MAX_STAGGER_SEC / span;
    return { dur, step, span: gap * step };
  }

  /* 提示文案：重建 span 即重放一次逐字淡入 */
  function playPlaceholder() {
    phBox.hidden = false;
    phBox.replaceChildren(...glyphs(PH_TEXT, (s, i) => {
      s.style.animationDelay = REDUCE ? "0s" : (i * 0.018) + "s";
      s.style.animationDuration = REDUCE ? "0s" : "0.16s";
    }));
  }

  /* 清空：刚删掉的文本做成替身，从右往左逐字模糊消散；收尾后再把提示文案请回来 */
  function playDeletion(text) {
    if (!text) return;
    const { dur, step, span } = glyphTiming(text.length, text.length);
    ghostBox.replaceChildren(...glyphs(text, (s, i) => {
      s.style.transitionDuration = REDUCE ? "0s" : dur + "s";
      s.style.transitionDelay = REDUCE ? "0s" : (text.length - 1 - i) * step + "s";
    }));
    ghostBox.hidden = false;
    phBox.hidden = true;
    root.classList.add("is-clearing");
    void ghostBox.offsetWidth;                    // 先让初始态落一次，再触发过渡
    ghostBox.querySelectorAll("span").forEach(s => s.classList.add("gone"));
    clearTimeout(ghostTimer);
    ghostTimer = setTimeout(() => {
      root.classList.remove("is-clearing");
      ghostBox.hidden = true;
      ghostBox.replaceChildren();
      if (!input.value) playPlaceholder();
    }, Math.max(SWEEP_MS, (span + dur) * 1000) + 160);
  }

  /* 清除钮与提示文案的显隐：都只看「框里有没有内容」 */
  function syncUi() {
    const has = input.value.length > 0;
    stat.hidden = !has;
    phBox.hidden = has || root.classList.contains("is-clearing");
  }

  input.addEventListener("input", () => {
    if (!input.value && lastValue) playDeletion(lastValue);
    lastValue = input.value;
    syncUi();
    runSearch();
  });

  clearBtn.onclick = () => {
    const prev = input.value;
    if (prev) { input.value = ""; lastValue = ""; playDeletion(prev); }
    syncUi();
    input.focus();
    runSearch();
  };

  /* 「清除筛选」把搜索词一并清掉时，交给这里同步动画与清除钮 */
  haloAfterClear = () => {
    const prev = lastValue;
    lastValue = "";
    syncUi();
    if (!input.value) { if (prev) playDeletion(prev); else playPlaceholder(); }
  };

  playPlaceholder();
  syncUi();
})();

/* 明暗模式：写入 localStorage，切换后重新渲染以更新标签底色 */
function setTheme(t) {
  const dark = t === "dark";
  if (dark) document.documentElement.dataset.theme = "dark";
  else document.documentElement.removeAttribute("data-theme");
  try { localStorage.setItem("lunwen-theme", t); } catch (e) {}
  /* 移动端浏览器地址栏配色跟随主题（PWA 注入的 theme-color） */
  const metaTheme = document.querySelector('meta[name="theme-color"]');
  if (metaTheme) metaTheme.setAttribute("content", dark ? "#0a0e14" : "#e9edf4");
  /* comp-183 开关：左侧月亮＝夜间、右侧太阳＝日间，滑块与高亮跟着当前模式走 */
  const sw = $("#btn-theme");
  sw.setAttribute("aria-checked", dark ? "false" : "true");
  sw.dataset.tip = dark ? "切换到日间模式" : "切换到夜间模式";
}
/* 玻璃主题默认深色：仅当用户显式存过「light」才走亮色 */
const storedTheme = (() => { try { return localStorage.getItem("lunwen-theme"); } catch (e) { return null; } })();
setTheme(storedTheme === "light" ? "light" : "dark");
$("#btn-theme").onclick = () => {

};

/* ---- comp-126 头像上传：点击选图 → 缩放后读成 data URL → 按钮内预览 + 本地持久化 ---- */
const AVATAR_KEY = "lunwen-avatar-v1";
const avatarBtn = $("#avatar-btn");
const avatarFile = $("#avatar-file");
const avatarImg = $("#avatar-img");
const avatarPh = $("#avatar-ph");
const avatarStatus = $("#avatar-status");

function renderAvatar(state) {
  const has = !!(state && state.url);
  avatarImg.hidden = !has;
  avatarPh.hidden = has;
  if (has) {
    avatarImg.src = state.url;
  } else {
    avatarImg.removeAttribute("src");
  }
  avatarBtn.setAttribute("aria-label", has ? "更换头像" : "上传头像");
  /* 不挂 data-tip：原生选图弹窗关闭后焦点会回到按钮，全局提示系统会据此把提示
     贴在按钮下方且不再收到 focusout，于是留下一个「悬浮在头像下面」的残留气泡 */
  avatarStatus.textContent = has ? "已上传图片并生成预览" : "未上传图片";
}
function readAvatar() {
  try { return JSON.parse(localStorage.getItem(AVATAR_KEY) || "null"); } catch (e) { return null; }
}
renderAvatar(readAvatar());

avatarBtn.onclick = () => avatarFile.click();

avatarFile.onchange = () => {
  const f = avatarFile.files && avatarFile.files[0];
  avatarFile.value = "";                 // 复位，允许再次选择同一张图
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    /* 缩到 192px 再转 data URL：手机原图动辄数 MB，直接存会撑爆 localStorage 配额 */
    const im = new Image();
    im.onload = () => {
      const side = 192;
      const s = Math.min(side / im.width, side / im.height, 1);
      const cv = document.createElement("canvas");
      cv.width = Math.max(1, Math.round(im.width * s));
      cv.height = Math.max(1, Math.round(im.height * s));
      cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
      saveAvatar(cv.toDataURL("image/jpeg", .86), f.name);
    };
    /* 解码失败时退回原始 data URL，至少让预览可用 */
    im.onerror = () => saveAvatar(String(reader.result), f.name);
    im.src = String(reader.result);
  };
  reader.readAsDataURL(f);
};

function saveAvatar(url, name) {
  const state = { url, name };
  try { localStorage.setItem(AVATAR_KEY, JSON.stringify(state)); }
  catch (e) { toast("头像图片过大，未能保存到本地", true); }
  renderAvatar(state);
}

/* ---- 自定义下拉列表：拦掉浏览器原生的展开选项，改用统一浮层 ---- */
let dselPop = null;
function closeDSelect() { if (dselPop) { dselPop.remove(); dselPop = null; } }

function openDSelect(sel) {
  closeDSelect();
  const opts = [...sel.options];
  if (!opts.length) return;
  const pop = document.createElement("div");
  pop.className = "dsel-pop";
  pop.innerHTML = opts.map(o =>
    `<button type="button" class="dsel-item ${o.value === sel.value ? "active" : ""}" data-v="${esc(o.value)}">${esc(o.textContent)}</button>`
  ).join("");
  document.body.appendChild(pop);
  const r = sel.getBoundingClientRect();
  pop.style.minWidth = `${r.width}px`;
  pop.style.left = `${Math.max(6, Math.min(r.left, window.innerWidth - pop.offsetWidth - 6))}px`;
  const h = pop.offsetHeight;
  pop.style.top = `${r.bottom + h + 6 > window.innerHeight ? Math.max(6, r.top - h - 6) : r.bottom + 6}px`;
  pop.querySelectorAll(".dsel-item").forEach(it => it.onclick = () => {
    sel.value = it.dataset.v;                                    // 交给原生 select 保存取值
    sel.dispatchEvent(new Event("change", { bubbles: true }));   // 触发原有 onchange 逻辑
    closeDSelect();
  });
  dselPop = pop;
}

/* 给页面上（含后插入的）每个 select 装上自定义浮层 */
function patchSelects(root = document) {
  root.querySelectorAll("select").forEach(sel => {
    if (sel.dataset.dsel) return;
    sel.dataset.dsel = "1";
    sel.addEventListener("mousedown", e => { e.preventDefault(); openDSelect(sel); });
  });
}
/* 动态插入的 select（如导入大纲预览、弹窗）自动补装，避免遗漏 */
new MutationObserver(muts => {
  muts.forEach(m => m.addedNodes.forEach(n => {
    if (n.nodeType !== 1) return;
    if (n.tagName === "SELECT") patchSelects(n.parentNode || n);
    else if (n.querySelector && n.querySelector("select")) patchSelects(n);
  }));
}).observe(document.body, { childList: true, subtree: true });

/* 点空白处 / Esc / 窗口变化时收起浮层 */
document.addEventListener("mousedown", e => {
  if (!dselPop) return;
  if ((e.target instanceof Element && e.target.closest("select")) || dselPop.contains(e.target)) return;
  closeDSelect();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDSelect(); });
window.addEventListener("resize", closeDSelect);

/* 全局安全网：未捕获异常不再静默失败，而是给出可读提示（3 秒内相同信息只报一次） */
window.__booted = true;
let lastErrAt = 0, lastErrMsg = "";
function reportFatal(msg) {
  const now = Date.now();
  if (msg === lastErrMsg && now - lastErrAt < 3000) return;
  lastErrMsg = msg; lastErrAt = now;
  try { toast(msg, true); } catch (e) {}
}
window.addEventListener("error", e => {
  if (window.__booted) reportFatal("运行出错：" + (e.message || "未知错误"));
});
window.addEventListener("unhandledrejection", e => {
  const r = e.reason;
  if (window.__booted) reportFatal("运行出错：" + ((r && r.message) || r || "未知错误"));
});
