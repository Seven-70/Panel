  }
  .seg-btn {
    display: inline-flex; align-items: center; gap: 4px; flex: none; white-space: nowrap;
    border: none; background: none; cursor: pointer;
    padding: 4px 6px; border-radius: var(--r-full);
    font-family: var(--font); font-size: var(--fs-sm); font-weight: 600; color: var(--text-2);
    transition: background var(--dur-2) var(--ease), color var(--dur-2) var(--ease), box-shadow var(--dur-2) var(--ease), transform var(--dur-1) var(--ease);
  }
  .seg-btn:hover { color: var(--text); background: var(--surface); }
  .seg-btn:active { transform: scale(.97); }
  .seg-btn.active {
    background: var(--c, var(--accent)); color: var(--on-accent); font-weight: 700;
    box-shadow: 0 2px 7px color-mix(in srgb, var(--c, var(--accent)) 30%, transparent);
  }
  /* 段上的条数：等宽数字；为 0 时收起底板，避免视觉噪音 */
  .seg-n {
    font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 500; line-height: 1;
    padding: 1px 4px; border-radius: var(--r-full);
    background: var(--surface); color: var(--text-3); border: 1px solid var(--border);
    transition: background var(--dur-2) var(--ease), color var(--dur-2) var(--ease);
  }
  .seg-n.is-zero { background: transparent; border-color: transparent; color: var(--text-soft); }
  .seg-btn.active .seg-n { background: rgba(255, 255, 255, .24); border-color: transparent; color: var(--on-accent); }

  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: var(--r-full); font-size: var(--fs-xs); font-weight: 600; }
  .badge .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .85; }

  /* ============ 2 · 日历 + 可交互圆形进度（各占一半） ============ */
  .title-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 8px; align-items: stretch; }

  .cal-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; box-shadow: var(--shadow-sm); min-width: 0;
    display: inline-flex; gap: 16px; align-items: stretch; width: 100%;
    animation: rise .4s var(--ease-out) both; animation-delay: .06s;
    transition: box-shadow .2s ease;
  }
  .cal-card:hover { box-shadow: var(--shadow-md); }

  /* ---- 时间块：固定三个月，按天的小方格横向对称铺满卡片 ---- */
  .ts-wrap { display: flex; flex-direction: column; gap: 10px; width: 100%; min-width: 0; }
  /* 16 列 × N 行，格子是 1fr 正方；网格按 16/N 的宽高比铺满卡片宽度，整体左右对称 */
  .ts-grid {
    display: grid; width: 100%; gap: 3px;
    grid-template-columns: repeat(var(--cols, 16), 1fr);
    grid-template-rows: repeat(var(--rows, 6), 1fr);
    aspect-ratio: var(--cols, 16) / var(--rows, 6);
  }
  .ts-cell {
    display: grid; place-items: center; overflow: hidden; padding: 0;
    border-radius: 4px; background: var(--surface-2); border: 1px solid var(--border);
    font-family: var(--font); cursor: pointer;
    transition: transform var(--dur-1) var(--ease), box-shadow var(--dur-2) var(--ease);
  }
  .ts-cell b { font-size: 10px; font-weight: 600; color: var(--text-3); line-height: 1; }
  .ts-cell:hover { transform: scale(1.12); box-shadow: var(--shadow-sm); z-index: 2; }
  .ts-cell.has-tasks {
    background: color-mix(in srgb, var(--pc, var(--accent)) 55%, var(--surface));
    border-color: color-mix(in srgb, var(--pc, var(--accent)) 45%, var(--border));
  }
  .ts-cell.has-tasks b { color: var(--text); font-weight: 700; }
  .ts-cell.is-today { box-shadow: 0 0 0 1.5px var(--accent); }
  .ts-cell.is-overdue { outline: 1.5px solid var(--danger); outline-offset: -1.5px; }
  .ts-legend { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; font-size: var(--fs-2xs); color: var(--text-soft); }
  .ts-lg { display: inline-flex; align-items: center; gap: 4px; }
  .ts-lg i { width: 10px; height: 10px; border-radius: 3px; display: block; background: var(--text-soft); flex: none; }
  .ts-lg i.ts-lg-today { background: transparent; box-shadow: 0 0 0 1.5px var(--accent); }
  /* 提示文字推到图例行右端 */
  .ts-legend .ts-hint { margin-left: auto; }
  .cal-left { flex: 1; min-width: 0; }
  .cal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .cal-title { font-size: var(--fs-sm); font-weight: 700; flex: 1; color: var(--text); letter-spacing: -.01em; }
  .cal-nav-btn {
    width: 24px; height: 24px; border-radius: var(--r-xs); border: 1px solid var(--border-strong); background: var(--surface);
    color: var(--text-soft); cursor: pointer; font-size: var(--fs-base); line-height: 1; display: grid; place-items: center;
    font-family: var(--font); transition: background var(--dur-2) var(--ease), color var(--dur-2) var(--ease), border-color var(--dur-2) var(--ease), box-shadow var(--dur-2) var(--ease), transform var(--dur-1) var(--ease);
  }
  .cal-nav-btn:hover { color: var(--accent); border-color: var(--accent-border); background: var(--accent-soft); }
  .cal-nav-btn:active { transform: scale(.93); }
  .cal-head .btn.ghost { padding: 4px 10px; font-size: var(--fs-xs); border-radius: var(--r-xs); }

  /* 行高固定 30px、间距固定 2px：整体高度与右侧栏的对齐依赖这两个值 */
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 30px; gap: 2px; }
  .cal-dow {
    text-align: center; font-size: var(--fs-2xs); color: var(--text-soft); padding: 1px 0 3px;
    font-weight: 700; letter-spacing: .06em;
  }
  .cal-day {
    position: relative; height: 30px; border-radius: var(--r-sm); border: 1px solid transparent;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    font-size: var(--fs-xs); color: var(--text-2); background: none; cursor: pointer; font-family: var(--font);
    font-variant-numeric: tabular-nums; transition: background var(--dur-2) var(--ease), color var(--dur-2) var(--ease), border-color var(--dur-2) var(--ease), box-shadow var(--dur-2) var(--ease); padding: 0;
  }
  .cal-day:hover:not(:disabled) { background: var(--surface-2); border-color: var(--border-strong); }
  .cal-day:disabled { cursor: default; }
  .cal-day.other { color: var(--cal-muted); }
  .cal-day.today { background: var(--accent-soft); color: var(--accent); font-weight: 700; border-color: var(--accent-border); }
  .cal-day.selected { background: var(--accent); color: var(--on-accent); font-weight: 700; border-color: var(--accent); box-shadow: var(--sh-2); }
  /* 有截止任务的日期：数字下方彩色下划线（每个任务一段），让日程一眼可见 */
  .cal-day .dots { display: flex; gap: 1.5px; height: 3px; align-items: center; }
  .cal-day .dots i { width: 7px; height: 3px; border-radius: 1.5px; display: block; }
  .cal-day.has-mark:not(.selected) .dots i { box-shadow: var(--sh-1); }
  .cal-day.selected .dots i { background: var(--on-accent) !important; box-shadow: none !important; }

  .cal-side { width: 200px; flex: none; border-left: 1px solid var(--border); padding-left: 14px; padding-top: 32px; display: flex; flex-direction: column; justify-content: flex-start; gap: 12px; min-width: 0; }
  .cs-list { overflow-y: auto; max-height: 158px; display: flex; flex-direction: column; gap: 3px; margin: auto 0; transform: translateY(-10px); }
  .cs-item { display: flex; align-items: center; gap: 7px; padding: 5px 7px; border-radius: var(--r-sm); transition: background .15s ease; min-width: 0; }
  .cs-item:hover { background: var(--surface-2); }
  .cs-item .cs-name { font-size: var(--fs-xs); font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; color: var(--text); min-width: 0; border: none; background: none; padding: 0; text-align: left; font-family: var(--font); }
  .cs-item .cs-name:hover { color: var(--accent); }
  .cs-item .badge { flex: none; padding: 2px 8px; font-size: var(--fs-2xs); }
  /* 「即将截止」列表中显示每条任务的截止日期（MM-DD） */
  .cs-item .cs-date { flex: none; font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-2); font-variant-numeric: tabular-nums; }
  .cs-empty { font-size: var(--fs-xs); color: var(--text-soft); padding: 14px 8px; text-align: center; line-height: 1.7; }

  /* 自定义悬停提示：替代原生 title，边框更细、文字居中、左右留白一致 */
  .tip {
    position: fixed; z-index: 9999; pointer-events: none; display: none;
    max-width: 220px; padding: 6px 10px;
    border: 1px solid var(--border-strong); border-radius: var(--r-md);
    background: var(--surface); color: var(--text);
    font-size: var(--fs-xs); line-height: 1.5; font-weight: 600; text-align: center;
    box-shadow: var(--shadow-md);
  }

  /* 距离下次任务倒计时（居中单条显示，所有状态统一固定高度 40px） */
  .cd-box, .cd-box.is-empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1px; text-align: center;
    height: 40px; box-sizing: border-box; flex: none; overflow: hidden;
    border: 1px solid var(--accent-border);
    border-radius: var(--r-md); padding: 0 10px;
    background: var(--accent-soft);
  }
  .cd-row1 {
    display: flex; align-items: baseline; justify-content: center; gap: 5px;
    min-width: 0; max-width: 100%; height: 16px; flex: none;
  }
  .cd-num {
    font-family: var(--font-mono);
    font-size: var(--fs-base); font-weight: 700; color: var(--accent); line-height: 16px;
    font-variant-numeric: tabular-nums; letter-spacing: -.02em; flex: none;
  }
  .cd-title {
    font-size: var(--fs-2xs); font-weight: 700; color: var(--text); letter-spacing: .01em; line-height: 16px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
  }
  .cd-sub {
    font-family: var(--font-mono);
    font-size: var(--fs-2xs); color: var(--text-2); max-width: 100%; height: 12px; line-height: 12px; flex: none;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .cd-box.is-empty { background: var(--surface-2); border-color: var(--border); }
  .cd-box.is-empty .cd-title { color: var(--text-soft); font-weight: 600; }

  /* interactive circular progress ring */
  .ring-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px 20px; box-shadow: var(--shadow-sm); min-width: 0;
    display: flex; align-items: center; justify-content: center; gap: 26px;
    animation: rise .4s var(--ease-out) both; animation-delay: .08s;
    transition: box-shadow .2s ease;
  }
  .ring-card:hover { box-shadow: var(--shadow-md); }

  /* 备忘录卡片（任务列表视图） */
  .memo-card { justify-content: flex-start; }
  .memo-wrap { width: 100%; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .memo-wrap textarea {
    width: 100%; min-height: 150px; resize: vertical; font-family: var(--font);
    font-size: var(--fs-md); line-height: 1.85; color: var(--text);
    background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-md);
    padding: 12px 14px; outline: none; transition: border-color .16s ease, box-shadow .16s ease;
  }
  .memo-wrap textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--surface); }
  .memo-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .memo-foot span { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-3); }
  .memo-foot .btn.ghost { padding: 5px 12px; font-size: var(--fs-xs); }
  .ring-wrap { position: relative; width: 220px; height: 220px; flex: none; }
  .ring-wrap svg { display: block; }
  #ring-segs { filter: drop-shadow(var(--sh-drop)); }
  .ring-seg-g {
    cursor: pointer; transition: transform .28s var(--ease);
    transform-box: view-box; transform-origin: 110px 110px;
  }
  .ring-seg-g:hover { transform: scale(1.06); }
  .ring-seg { transition: filter .2s ease; }
  .ring-seg-g:hover .ring-seg { filter: brightness(1.07) saturate(1.06); }
  .ring-lbl {
    font-family: var(--font); font-weight: 700;
    font-variant-numeric: tabular-nums; pointer-events: none; fill: var(--on-accent);
    paint-order: stroke; stroke: var(--ring-stroke); stroke-width: 2.5px;
  }
  .ring-lbl-sub {
    font-family: var(--font); font-weight: 700;
    pointer-events: none; fill: var(--on-accent); opacity: .88;
  }
  /* 中心圆与环形一体：无浮层阴影，颜色融为整体 */
  .ring-center {
    position: absolute; left: 50%; top: 50%; width: 92px; height: 92px;
    transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    cursor: pointer; border-radius: 50%; background: transparent; border: none; padding: 0;
    transition: background var(--dur-2) var(--ease);
  }
  .ring-center:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
  .ring-pct { font-family: var(--font-mono); font-size: var(--fs-xl); font-weight: 700; letter-spacing: -.04em; color: var(--text); font-variant-numeric: tabular-nums; line-height: 1.1; }
  /* 统计区：标题做小字号字距标签，行内数值走等宽，扫读更稳 */
  .ring-label { font-size: var(--fs-2xs); color: var(--text-soft); letter-spacing: .08em; font-weight: 600; }
  .ring-meta { display: flex; flex-direction: column; gap: 2px; width: 196px; }
  .ring-meta .rm-title {
    font-size: var(--fs-2xs); font-weight: 700; color: var(--text-soft);
    letter-spacing: .12em; margin: 0 9px 8px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
  }
  .ring-meta .rm-row {
    display: flex; align-items: center; gap: 8px; font-size: var(--fs-xs); color: var(--text-2);
    font-variant-numeric: tabular-nums; border: none; background: none; cursor: pointer;
    font-family: var(--font); padding: 6px 9px; border-radius: var(--r-md); width: 100%; text-align: left;
    transition: background .15s ease, color .15s ease, transform .12s var(--ease);
  }
  .ring-meta .rm-row:hover { background: var(--surface-2); transform: translateX(2px); }
  .ring-meta .rm-row:active { transform: scale(.97); }
  .ring-meta .rm-row.active { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .ring-meta .rm-row i { width: 8px; height: 8px; border-radius: 3px; display: block; flex: none; }
  .ring-meta .rm-row b { margin-left: auto; font-family: var(--font-mono); font-size: var(--fs-sm); font-weight: 600; color: var(--text); }
  .ring-meta .rm-row.active b { color: var(--accent); }

  /* ============ 3 · 筛选提示 ============ */
  /* 空置时也占 18px（与文字出现时同高），点筛选不会把下方内容顶下去 */
  .stats-note {
    display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); color: var(--text-soft);
    margin-bottom: 8px; min-height: 18px; padding: 0 4px; animation: fade-in var(--dur-3) ease both;
  }
  .stats-note b { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
  .stats-note .link { color: var(--accent); cursor: pointer; font-weight: 600; border: none; background: none; padding: 1px 7px; border-radius: var(--r-xs); font-family: var(--font); font-size: var(--fs-xs); }
  .stats-note .link:hover { background: var(--accent-soft); }

  /* ============ 4 · 工具栏：两行合成一块控制台，减少悬浮卡片数量 ============ */
  .panels {
    display: grid; gap: 0; margin-bottom: 14px;
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden;
    animation: rise var(--dur-4) var(--ease-out) both; animation-delay: .05s;
  }
  .panel {
    display: flex; align-items: center; gap: var(--sp-3) var(--sp-5); flex-wrap: wrap;
    padding: 11px 14px; background: transparent;
  }
  /* 第二行（操作区）用浅灰底 + 一条实线，与筛选行形成明确的两段结构 */
  .panel + .panel { background: var(--surface-2); border-top: 1px solid var(--border-hover); }
  /* 筛选行：左边是三组筛选，右端放搜索框 */
  .panel-filter {
    flex-wrap: wrap; gap: 10px 12px; padding: 10px 14px;
  }
  /* 三组筛选靠左排；组与组之间用竖线分隔（间距由竖线的左右外边距提供），宽度不够时整组换行、组内不折断 */
  .panel-filter .filter-row {
    display: flex; align-items: center; flex-wrap: wrap;
    gap: 8px 0; flex: 0 1 auto; min-width: 0;
  }
  .panel-filter .filter-group:not(:last-child)::after {
    content: ""; flex: none; width: 1px; height: 20px; margin: 0 9px;
    background: var(--border-strong); border-radius: 1px;
  }
  /* 搜索框：顶栏里使用，样式独立于面板 */
  .search-box { position: relative; }
  .search-box svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-3); pointer-events: none; transition: color .15s ease; }
  .search-box input { width: 100%; min-width: 0; padding-left: 34px; background: var(--surface-2); border-color: var(--border); }
  .search-box input:focus { background: var(--surface); border-color: var(--accent); }
  .search-box:focus-within svg { color: var(--accent); }
  /* 顶栏里的搜索框：固定在夜间模式按钮左侧 */
  .topbar .search-box { flex: none; width: 220px; }
  /* 筛选行右端的视图相关按钮（新建任务 / 任务管理 / 全部折叠，按视图显隐）
     新建任务与任务管理同为主操作，用实心强调色提高辨识度；全部折叠保持次要的描边样式 */
  .panel-filter #btn-new, .panel-filter #btn-collapse { margin-left: auto; }
  .panel-filter #btn-new { display: inline-flex; align-items: center; gap: 6px; padding: 8px 15px; font-size: var(--fs-sm); letter-spacing: .01em; }
  .panel-filter #btn-new svg { flex: none; }
  /* 新建任务的 display 由上面的 id 规则给出，优先级高于 .hidden，需在此显式补回隐藏态 */
  .panel-filter #btn-new.hidden { display: none; }
  /* 任务管理：紧随新建任务右侧，同为强调色实心样式。
     这里用单类选择器定义 display，且置于 .hidden 之前，保证隐藏状态仍能生效 */
  .filter-act { display: inline-flex; align-items: center; gap: 6px; padding: 8px 15px; font-size: var(--fs-sm); letter-spacing: .01em; white-space: nowrap; }
  .filter-act svg { flex: none; }
  .filter-act.active { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--on-accent) 55%, transparent), var(--sh-1); }
  .panel-actions .btn.ghost { padding: 8px 13px; font-size: var(--fs-sm); }

  /* ============ 5 · 任务卡片网格 ============ */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; animation: rise var(--dur-4) var(--ease-out) both; animation-delay: .1s; }
  .task-cards {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(272px, 1fr));
    gap: 12px; padding: 14px;
  }
  /* 任务列表视图 · 任务管理（批量操作条） */
  .batch-bar {
    display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
    margin: 14px 14px 0; padding: 10px 12px;
    border: 1px dashed var(--accent); border-radius: var(--r-lg); background: var(--accent-soft);
    animation: rise var(--dur-3) var(--ease-out) both;
  }
  .bb-all { display: flex; align-items: center; gap: 6px; font-size: var(--fs-sm); font-weight: 600; color: var(--text-2); cursor: pointer; user-select: none; }
  .bb-count { font-size: var(--fs-sm); color: var(--text-soft); }
  .bb-sel {
    font-family: var(--font); font-size: var(--fs-sm); color: var(--text-2);
    background-color: var(--surface); border: 1px solid var(--border); border-radius: var(--r-sm);
    padding: 6px 28px 6px 9px; cursor: pointer; max-width: 150px;
  }
  .bb-sel:focus { outline: none; border-color: var(--accent); }
  .batch-check { flex: none; width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; margin: 0; }
  .modal-list { display: flex; flex-direction: column; gap: 4px; max-height: 132px; overflow: auto; margin: 10px 0 0; padding: 9px 11px; background: var(--surface-2); border-radius: var(--r-md); font-size: var(--fs-sm); color: var(--text-soft); }
  /* 批量模式：隐藏卡片上的单个操作按钮，避免误触 */
  .task-cards.is-batch .js-del, .task-cards.is-batch .js-toggle { display: none; }
  .task-cards.is-batch .tcard:hover { transform: none; }
  /* 任务卡：左侧一条状态色条 + 分行信息，hover 抬升 */
  .tcard {
    position: relative; background: var(--surface); border: 1px solid var(--border);
    border-left: 3px solid var(--sc, var(--accent));
    border-radius: var(--r-lg); padding: 12px 13px 11px; cursor: pointer;
    display: flex; flex-direction: column; gap: 9px;
    box-shadow: var(--shadow-xs);
    transition: box-shadow var(--dur-2) var(--ease), transform var(--dur-2) var(--ease), border-color var(--dur-2) var(--ease);
  }
  .tcard:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); border-color: color-mix(in srgb, var(--sc, var(--accent)) 35%, var(--border)); }
  .tcard:active { cursor: grabbing; }
  .tcard.dragging { opacity: .4; }
  .tcard.drop-before { box-shadow: -3px 0 0 0 var(--accent), var(--shadow-sm); }
  .tcard.drop-after { box-shadow: 3px 0 0 0 var(--accent), var(--shadow-sm); }
  .tc-head { display: flex; align-items: flex-start; gap: 9px; }
  .tc-name { flex: 1; font-weight: 600; font-size: var(--fs-base); line-height: 1.5; color: var(--text); min-width: 0; }
  .tcard.is-done .tc-name { color: var(--text-soft); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--text-soft) 50%, transparent); }
  .tc-head .icon-btn { flex: none; margin: -3px -4px 0 0; }
  .tc-badges { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .tc-stage {
    display: inline-flex; align-items: center; font-size: var(--fs-2xs); font-weight: 600;
    color: var(--text-soft); background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--r-xs); padding: 3px 8px;
  }
  .tc-foot { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: auto; padding-top: 2px; }
  .tc-foot .mini {
    display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-mono);
    font-size: var(--fs-2xs); color: var(--text-2); background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--r-xs); padding: 3px 7px; font-variant-numeric: tabular-nums;
  }
  .tc-foot .mini svg { flex: none; opacity: .7; }
  .tc-foot .mini.overdue { color: var(--danger); background: var(--danger-soft); border-color: var(--danger-border); }
  .tc-foot .mini.overdue svg { opacity: 1; }

  .date { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text-2); }
  .date .od-tag { font-size: var(--fs-2xs); font-weight: 700; color: var(--danger); background: var(--danger-soft); border-radius: var(--r-xs); padding: 1px 6px; letter-spacing: .02em; }
  .date.overdue { color: var(--danger); font-weight: 600; }
  .icon-btn {
    display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: var(--r-sm);
    border: none; background: transparent; color: var(--text-soft); cursor: pointer; opacity: 0;
    transition: opacity var(--dur-2) var(--ease), background var(--dur-2) var(--ease), color var(--dur-2) var(--ease), transform var(--dur-1) var(--ease);
  }
  /* 悬停、键盘聚焦、卡片内聚焦都要可见，否则键盘用户找不到删除按钮 */
  .tcard:hover .icon-btn, .ticket:hover .icon-btn,
  .tcard:focus-within .icon-btn, .ticket:focus-within .icon-btn,
  .icon-btn:focus-visible { opacity: 1; }
  .icon-btn:hover, .icon-btn:focus-visible { background: var(--danger-soft); color: var(--danger); }
  .icon-btn:active { transform: scale(.9); }

  .empty-cell { padding: 0 !important; border-bottom: none !important; }
  .empty { padding: 56px 20px; text-align: center; color: var(--text-soft); grid-column: 1 / -1; }
  .empty svg { display: block; margin: 0 auto 12px; opacity: .35; }
  .empty b { display: block; color: var(--text-2); font-size: var(--fs-md); font-weight: 700; margin-bottom: 5px; }
  .empty span { font-size: var(--fs-base); }
  .empty .empty-action { margin-top: var(--sp-5); }

  /* ============ 6 · 看板视图：每列一条语义色书脊 ============ */
  .board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(300px, 1fr); gap: 18px; overflow-x: auto; padding: 2px 2px 14px; align-items: start; animation: rise var(--dur-4) var(--ease-out) both; animation-delay: .1s; }

  .col {
    position: relative;
    background: var(--surface-2);
    border: 1px solid var(--border);
    /* 列顶状态色：直接用上边框画，边框天然沿着圆角走，不会外露也不会内缩 */
    border-top: 3px solid color-mix(in srgb, var(--c, var(--accent)) 70%, var(--surface));
    border-radius: var(--radius-lg);
    padding: 0 0 14px;
    overflow: hidden;
    transition: box-shadow .2s ease, border-color .2s ease;
  }
  .col:hover { box-shadow: var(--shadow-sm); border-color: color-mix(in srgb, var(--c, var(--accent)) 18%, var(--border)); }
  .col.drop-hover { outline: 2px dashed var(--accent); outline-offset: -2px; background: var(--accent-soft); }

  .col-head { padding: 14px 16px 12px; }
  .col-head .ch-row { display: flex; align-items: center; gap: 8px; }
  .col-head .ch-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--accent)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c, var(--accent)) 15%, transparent); transition: box-shadow .22s ease; }
  .col:hover .ch-dot { box-shadow: 0 0 0 5px color-mix(in srgb, var(--c, var(--accent)) 20%, transparent); }
  .col-head h3 { font-size: var(--fs-base); font-weight: 700; letter-spacing: -.01em; flex: 1; color: var(--text); }
  .col-head .count {
    color: var(--c, var(--accent)); font-weight: 600; font-family: var(--font-mono);
    font-variant-numeric: tabular-nums; background: color-mix(in srgb, var(--c, var(--accent)) 9%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--c, var(--accent)) 18%, transparent);
    border-radius: var(--r-full); padding: 2px 10px; font-size: var(--fs-xs);
  }
  .col-head .ch-sub { margin-top: 10px; font-size: var(--fs-2xs); color: var(--text-soft); display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .col-head .ch-bar { flex: 1; height: 4px; border-radius: var(--r-full); background: var(--border-strong); overflow: hidden; }
  .col-head .ch-bar i { display: block; height: 100%; border-radius: var(--r-full); background: var(--c, var(--accent)); transition: width .5s var(--ease); }

  .col-body { display: flex; flex-direction: column; gap: 6px; padding: 4px 10px 2px; min-height: 56px; }

  /* collapsible outline groups */
  .grp { border-radius: var(--r-md); transition: background .15s ease; }
  .grp-head {
    display: flex; align-items: center; gap: 8px; width: 100%;
    text-align: left; border: none; background: none;
    padding: 9px 10px; cursor: pointer; border-radius: var(--r-sm);
    user-select: none; transition: background var(--dur-2) var(--ease);
  }
  .grp-head:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
  .grp-arrow { flex: none; width: 15px; height: 15px; display: grid; place-items: center; color: var(--text-soft); transition: transform .22s var(--ease); }
  .grp.open .grp-arrow { transform: rotate(90deg); }
  .grp-name { font-size: var(--fs-sm); font-weight: 700; color: var(--text-2); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: .02em; }
  .grp-count { font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 600; color: var(--text-soft); background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-full); padding: 1px 8px; font-variant-numeric: tabular-nums; }

  .grp-children {
    display: grid; grid-template-rows: 1fr;
    padding: 4px 2px 10px 18px; position: relative; overflow: hidden;
    margin-left: 8px; border-left: 2px solid var(--border-strong);
    transition: grid-template-rows .28s var(--ease), opacity .22s ease, padding .28s var(--ease);
  }
  .grp-inner { min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 8px; }
  .grp:not(.open) > .grp-children { grid-template-rows: 0fr; opacity: 0; padding-top: 0; padding-bottom: 0; border-left-color: transparent; }
  .grp-preview { font-size: var(--fs-2xs); color: var(--text-soft); padding: 2px 0 7px 22px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grp.open > .grp-preview { display: none; }

  /* 看板卡片：一条优先级色条 + 标题/元信息两行 */
  .ticket {
    position: relative;
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: 12px 13px 11px 15px;
    cursor: grab;
    background: var(--surface);
    box-shadow: var(--shadow-xs);
    transition: transform .16s var(--ease), box-shadow .2s ease, border-color .2s ease;
  }
  .ticket::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--pc, var(--accent)); opacity: .85; transition: width .16s ease; }
  .ticket:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: color-mix(in srgb, var(--pc, var(--accent)) 30%, var(--border)); }
  .ticket:hover::before { width: 4px; }
  .ticket:active { cursor: grabbing; }
  .ticket.dragging { opacity: .38; transform: rotate(1.5deg) scale(.98); }
  .ticket.drop-before { box-shadow: 0 -3px 0 0 var(--accent), var(--shadow-md); }

  .ticket .t-head { display: flex; align-items: flex-start; gap: 9px; margin-bottom: 8px; }
  .ticket .t-name { font-weight: 600; padding-right: 2px; line-height: 1.5; font-size: var(--fs-sm); color: var(--text); }
  .ticket .t-meta { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
  .ticket .t-del { position: absolute; top: 7px; right: 7px; }
  .ticket:hover .t-del { opacity: 1; }
  .ticket .mini {
    display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-mono);
    font-size: var(--fs-2xs); color: var(--text-2); background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--r-xs); padding: 3px 7px; font-variant-numeric: tabular-nums;
  }
  .ticket .mini svg { flex: none; opacity: .7; }
  .ticket .mini.overdue { color: var(--danger); background: var(--danger-soft); border-color: var(--danger-border); }
  .ticket .mini.overdue svg { opacity: 1; }

  .col-empty { border: 1.5px dashed var(--border-strong); border-radius: var(--r-md); padding: 24px 12px; text-align: center; color: var(--text-soft); font-size: var(--fs-xs); background: transparent; line-height: 1.7; }
  .col-empty svg { display: block; margin: 0 auto 6px; opacity: .35; }

  /* ============ 7 · 时间轴视图：按截止日期纵向排成时间轴 ============ */
  .timeline { padding: 6px 14px 14px; }
  .tl-row {
    display: grid; grid-template-columns: 116px 1fr; gap: 14px;
    padding: 12px 0; border-top: 1px solid var(--border);
    transition: background var(--dur-3) var(--ease), box-shadow var(--dur-3) var(--ease);
    animation: rise var(--dur-4) var(--ease-out) both;
  }
  /* 从时间块方格跳过来时闪一下，指明落点 */
  .tl-row.is-flash {
    background: var(--accent-soft); border-radius: var(--r-md);
    box-shadow: inset 3px 0 0 0 var(--accent);
  }
  .tl-row:first-child { border-top: none; }
  .tl-date { display: flex; flex-direction: column; gap: 2px; text-align: right; padding-top: 2px; }
  .tl-date b { font-size: var(--fs-sm); font-weight: 700; color: var(--text); letter-spacing: -.01em; }
  .tl-date span { font-size: var(--fs-2xs); color: var(--text-soft); font-variant-numeric: tabular-nums; }
  .tl-date span.is-overdue { color: var(--danger); font-weight: 700; }
  .tl-row.is-today .tl-date b { color: var(--accent); }
  .tl-row.is-overdue .tl-date b { color: var(--danger); }
  /* 任务块：左侧一条优先级色条，和列表卡片同一套语言 */
  .tl-blocks {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start;
    padding-left: 12px; border-left: 2px solid var(--border-strong);
  }
  .tl-row.is-none .tl-blocks { padding-left: 0; border-left-color: transparent; }
  .tl-block {
    display: flex; flex-direction: column; gap: 6px; min-width: 188px; max-width: 320px;
    text-align: left; padding: 9px 11px 9px 13px; cursor: pointer;
    border: 1px solid var(--border); border-left: 3px solid var(--pc, var(--accent));
    border-radius: var(--r-md); background: var(--surface); box-shadow: var(--shadow-xs);
    font-family: var(--font);
    transition: box-shadow var(--dur-2) var(--ease), transform var(--dur-2) var(--ease), border-color var(--dur-2) var(--ease);
  }
  .tl-block:hover {
    box-shadow: var(--shadow-md); transform: translateY(-2px);
    border-color: color-mix(in srgb, var(--pc, var(--accent)) 35%, var(--border));
  }
  .tl-block:active { transform: translateY(0) scale(.99); }
  .tl-name { font-size: var(--fs-sm); font-weight: 600; color: var(--text); line-height: 1.5; }
  .tl-block.is-done .tl-name { color: var(--text-soft); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--text-soft) 50%, transparent); }
  .tl-meta { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }

  /* done toggle */
  .check {
    width: 21px; height: 21px; flex: none; border-radius: 50%; border: 2px solid var(--border-strong);
    background: var(--surface); color: transparent; cursor: pointer; display: inline-grid; place-items: center;
    transition: background var(--dur-2) var(--ease), color var(--dur-2) var(--ease), border-color var(--dur-2) var(--ease), box-shadow var(--dur-2) var(--ease), transform var(--dur-1) var(--ease);
  }
  .check:hover { border-color: var(--c, var(--accent)); color: var(--c, var(--accent)); transform: scale(1.08); }
  .check:active { transform: scale(.9); }
  .check.is-done { background: var(--c, var(--accent)); border-color: var(--c, var(--accent)); color: var(--on-accent); animation: pop-check .28s var(--ease); }
  .check.is-done:hover { filter: brightness(1.07); }

  .hidden { display: none; }

  /* ============ modal：字段按小节排布，底部操作区固定层次 ============ */
  .overlay { position: fixed; inset: 0; background: var(--overlay); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; animation: fade-in .18s ease; z-index: 50; padding: 20px; }
  .modal {
    position: relative; background: var(--surface); border-radius: var(--r-xl); padding: 26px; width: 440px; max-width: 90vw;
    max-height: 88vh; overflow-y: auto; box-shadow: var(--sh-4);
    animation: pop .22s var(--ease-out);
  }
  @keyframes pop { from { transform: translateY(14px) scale(.98); opacity: 0; } }
  .modal h2 { font-size: var(--fs-lg); font-weight: 700; letter-spacing: -.02em; margin-bottom: 3px; padding-right: 30px; }
  .modal .sub { color: var(--text-soft); font-size: var(--fs-sm); margin-bottom: 18px; line-height: 1.7; }
  .modal .sub b { color: var(--accent); }
  .modal-x {
    position: absolute; top: 15px; right: 15px; width: 30px; height: 30px; border-radius: var(--r-sm);
    border: none; background: var(--surface-2); color: var(--text-soft); cursor: pointer; display: grid; place-items: center;
    transition: background var(--dur-2) ease, color var(--dur-2) ease, transform var(--dur-2) ease;
  }
  .modal-x:hover { background: var(--danger-soft); color: var(--danger); transform: rotate(90deg); }
  .field { margin-bottom: 16px; }
  /* 字段标签退成小字号字距标签：把注意力让给输入内容 */
  .field label { display: block; color: var(--text-2); font-size: var(--fs-xs); font-weight: 600; letter-spacing: .04em; margin-bottom: 7px; }
  .field input, .field select { width: 100%; }
  .field .chips { gap: 6px; }
  .field textarea {
    width: 100%; font-family: var(--font); font-size: var(--fs-sm); line-height: 1.75; border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm); padding: 10px 12px; min-height: 180px; resize: vertical; outline: none;
    background: var(--surface-2); color: var(--text); transition: border-color .16s ease, box-shadow .16s ease;
  }
  .field textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--surface); }
  .date-wrap { position: relative; }
  .date-wrap input { padding-right: 44px; }
  .date-btn {
    position: absolute; top: 50%; right: 5px; transform: translateY(-50%);
    width: 32px; height: 32px; display: grid; place-items: center;
    border: none; border-radius: var(--r-sm); background: var(--surface-2); color: var(--text-soft);
    cursor: pointer; transition: background var(--dur-2) ease, color var(--dur-2) ease;
  }
  .date-btn:hover { background: var(--accent-soft); color: var(--accent); }
  .datepick {
    position: absolute; top: calc(100% + 6px); right: 0; z-index: 70;
    width: 268px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-lg); padding: 12px; box-shadow: var(--shadow-md);
    animation: rise .22s var(--ease-out) both;
  }
  .dp-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .dp-title { font-size: var(--fs-sm); font-weight: 700; color: var(--text); letter-spacing: -.01em; }
  .dp-nav {
    width: 28px; height: 28px; border: none; border-radius: var(--r-xs); background: var(--surface-2);
    color: var(--text-2); font-size: var(--fs-md); line-height: 1; cursor: pointer; transition: background var(--dur-2) ease, color var(--dur-2) ease;
  }
  .dp-nav:hover { background: var(--accent-soft); color: var(--accent); }
  .dp-dow, .dp-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .dp-dow span { text-align: center; font-size: var(--fs-2xs); color: var(--text-soft); padding: 3px 0; font-weight: 600; }
  .dp-day {
    height: 30px; border: 1px solid transparent; border-radius: var(--r-xs); background: none;
    font-family: var(--font); font-size: var(--fs-xs); color: var(--text-2); cursor: pointer;
    font-variant-numeric: tabular-nums; padding: 0; transition: background var(--dur-1) var(--ease), color var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease), box-shadow var(--dur-1) var(--ease);
  }
  .dp-day:hover { background: var(--surface-2); border-color: var(--border-strong); }
  .dp-day.other { color: var(--cal-muted); }
  .dp-day.today { border-color: var(--accent-border); color: var(--accent); font-weight: 700; }
  .dp-day.sel { background: var(--accent); color: var(--on-accent); font-weight: 700; border-color: var(--accent); box-shadow: var(--sh-1); }
  .modal-actions { display: flex; align-items: center; gap: 8px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
  /* ============ 使用说明弹窗：正文按小节排布，便于阅读 ============ */
  .help-section { margin-top: 18px; }
  .help-section > h3 { display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); font-weight: 700; color: var(--text); margin-bottom: 9px; }
  .help-section > h3::before { content: ""; flex: none; width: 3px; height: 13px; border-radius: 2px; background: var(--accent); }
  .help-list, .help-steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 7px; }
  .help-list li, .help-steps li { font-size: var(--fs-sm); color: var(--text-2); line-height: 1.75; }
  .help-list li b, .help-steps li b { color: var(--text); font-weight: 600; }
  .help-warn { color: var(--danger); font-weight: 600; }
  .help-note { margin: 10px 0 0; padding-left: 20px; font-size: var(--fs-sm); color: var(--text-soft); line-height: 1.7; }
  .help-tag { display: inline-block; margin-left: 6px; padding: 1px 7px; font-size: var(--fs-2xs); font-weight: 600; color: var(--danger); background: var(--danger-soft); border-radius: var(--r-xs); vertical-align: 1px; }
  .link-danger { color: var(--danger); cursor: pointer; background: none; border: none; font-size: var(--fs-base); font-weight: 500; padding: 8px 10px; border-radius: var(--r-sm); font-family: var(--font); transition: background .15s ease; }
  .link-danger:hover { background: var(--danger-soft); }

  /* import preview */
  .imp-preview { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; max-height: 340px; overflow-y: auto; }
  .imp-count { font-size: var(--fs-xs); font-weight: 700; color: var(--accent); margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .imp-item { display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); padding: 3px 0; color: var(--text-2); animation: fade-in .2s ease both; }
  .imp-tag { background: var(--accent-soft); color: var(--accent); padding: 1px 8px; font-size: var(--fs-2xs); border-radius: var(--r-xs); font-weight: 600; }
  .imp-more { font-size: var(--fs-xs); color: var(--text-soft); padding: 3px 0; }
  .imp-total { color: var(--accent); font-weight: 700; }
  .imp-group { margin: 14px 0 6px; }
  .imp-group:first-of-type { margin-top: 6px; }
  .imp-group-head { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }
  .imp-group-title { display: inline-block; font-size: var(--fs-2xs); font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 2px 9px; border-radius: var(--r-xs); }
  .imp-gcount { font-size: var(--fs-2xs); color: var(--text-soft); }
  .imp-check, .imp-gcheck, .imp-top input { flex: none; width: 15px; height: 15px; padding: 0; margin: 0; border: none; background: none; accent-color: var(--accent); cursor: pointer; }
  .imp-row { display: flex; flex-direction: column; gap: 6px; padding: 9px 2px; border-bottom: 1px solid var(--border); animation: fade-in .2s ease both; }
  .imp-row:last-child { border-bottom: 0; }
  .imp-row.off { opacity: .42; }
  .imp-row.off .imp-name { text-decoration: line-through; }
  .imp-line1 { display: flex; align-items: center; gap: 7px; }
  .imp-line2 { display: flex; align-items: center; gap: 7px; padding-left: 22px; }
  .imp-name { flex: 1; min-width: 0; font-size: var(--fs-sm); color: var(--text); padding: 4px 8px; border: 1px solid transparent; border-radius: var(--r-xs); background: transparent; }
  .imp-name:hover { border-color: var(--border); background: var(--surface); }
  .imp-name:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); background: var(--surface); }
  .imp-row select, .imp-row input[type="date"] { flex: none; width: auto; padding: 3px 22px 3px 6px; font-size: var(--fs-xs); border-radius: var(--r-xs); cursor: pointer; }
  .imp-row select { background-position: right 7px center; background-size: 9px 9px; }
  .imp-row select:focus, .imp-row input[type="date"]:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .imp-dlabel { flex: none; font-size: var(--fs-2xs); color: var(--text-soft); }
  .imp-opts { display: flex; flex-direction: column; gap: 6px; margin: -2px 0 12px; }
  .imp-top { display: flex; align-items: flex-start; gap: 7px; font-size: var(--fs-xs); color: var(--text-2); cursor: pointer; user-select: none; line-height: 1.6; }
  .imp-tip { font-size: var(--fs-xs); color: var(--text-soft); margin: -4px 0 12px; line-height: 1.7; }
  .imp-tip b { color: var(--text-2); }
  /* 每行的「所属阶段」：下拉直接选已有阶段，或选「＋ 自定义…」后用输入框输入新阶段 */
  .imp-row .imp-sel-line-pick { flex: 0 1 132px; min-width: 96px; font-family: var(--font); color: var(--text-2); }
  .imp-sel-line {
    flex: 0 1 132px; min-width: 96px; font-family: var(--font); font-size: var(--fs-xs);
    color: var(--text-2); padding: 3px 6px; border-radius: var(--r-xs);
  }
  .imp-sel-line:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }

  /* 备份设置面板：拖拽区 + 存储位置信息 */
  /* 面板做成定高的弹性列：固定部分尽量薄，中间拖拽区吃掉约七成高度 */
  .modal.bk-modal { display: flex; flex-direction: column; height: min(480px, 74vh); padding: 14px; }
  .modal.bk-modal > h2,
  .modal.bk-modal > .sub,
  .modal.bk-modal > .bk-store,
  .modal.bk-modal > .modal-actions { flex: none; }
  .modal.bk-modal > .sub { margin-bottom: 8px; }
  .modal.bk-modal > .modal-actions { margin-top: 8px; padding-top: 8px; }
  .modal.bk-modal > .bk-drop { flex: 1 1 auto; }
  .bk-drop {
    display: flex; flex-direction: column; gap: 4px; align-items: center; justify-content: center;
    text-align: center; min-height: 80px;
    padding: 16px 14px; margin-bottom: 8px; cursor: pointer;
    border: 1.5px dashed var(--border-strong); border-radius: var(--r-lg);
    background: var(--surface-2); color: var(--text-soft);
    transition: border-color var(--dur-2) var(--ease), background var(--dur-2) var(--ease), color var(--dur-2) var(--ease);
  }
  .bk-drop b { font-size: var(--fs-base); color: var(--text-2); font-weight: 700; }
  .bk-drop span { font-size: var(--fs-xs); line-height: 1.6; }
  .bk-drop:hover, .bk-drop.is-over { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .bk-drop:hover b, .bk-drop.is-over b { color: var(--accent); }
  .bk-store {
    display: flex; flex-direction: column; gap: 2px; padding: 5px 10px;
    border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface-2);
  }
  .bk-store-row { display: flex; align-items: baseline; gap: 8px; font-size: var(--fs-2xs); color: var(--text-soft); }
  .bk-store-row b { color: var(--text-2); font-weight: 600; font-family: var(--font-mono); word-break: break-all; }

  /* toast：常驻提示层（带 aria-live），单条为其中一行 */
  .toast-layer {
    position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: var(--sp-3);
    z-index: 99; pointer-events: none;
  }
  .toast {
    display: flex; align-items: center; gap: 9px;
    background: var(--toast-bg); color: var(--toast-fg); padding: 11px 20px; border-radius: var(--r-lg); font-size: var(--fs-base);
    box-shadow: var(--sh-4);
    animation: toast-in var(--dur-3) var(--ease-out);
  }
  .toast svg { flex: none; color: var(--toast-ok); }
  .toast.toast-alert svg { color: var(--danger); }
  .toast.toast-out { opacity: 0; transform: translateY(8px); transition: opacity var(--dur-3) ease, transform var(--dur-3) ease; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(12px) scale(.96); } }

  /* responsive */
  @media (max-width: 1400px) {
    .wrap { max-width: 100%; }
  }
  @media (max-width: 1240px) {
    .cal-side { display: none; }
    .proj-switch select { min-width: 150px; }
    /* 这一档宽度下三组会换行，竖线留在行尾显得突兀，直接收起并把间距交回行间距 */
    .panel-filter .filter-group:not(:last-child)::after { display: none; }
    .panel-filter .filter-row { gap: 8px 18px; }
  }
  @media (max-width: 1080px) {
    .title-row { grid-template-columns: 1fr; }
    .proj-switch { padding-left: 10px; }
    .panel .search-box input { min-width: 180px; }
  }
  @media (max-width: 860px) {
    .shell { flex-direction: column; }
    .sidebar { width: 100%; position: static; display: flex; flex-direction: row; align-items: center; gap: 6px; padding: 8px 10px; min-height: 0; border-radius: var(--radius-lg); }
    .side-label, .side-sep { display: none; }
    .sidebar > [role="tablist"] { display: flex; align-items: center; gap: 6px; }
    .tab, .side-btn { margin-bottom: 0; width: auto; flex: none; padding: 8px 12px; }
    #btn-help { margin-top: 0; }
    .tab.active::before, .side-btn.active::before { display: none; }
    .topbar { gap: 10px; }
    .proj-switch { flex: 1; }
    .board { grid-auto-columns: minmax(272px, 86vw); }
  }
  @media (max-width: 720px) {
    body { padding: 16px 12px 48px; }
    .topbar { padding: 12px 14px; }
    .topbar .divider { display: none; }
    .topbar .identity h1 { font-size: var(--fs-lg); }
    .proj-switch { width: 100%; }
    .proj-switch select { flex: 1; min-width: 0; }
    .cal-card { flex-direction: column; width: 100%; }
    .cal-side { display: flex; border-left: none; border-top: 1px solid var(--border); padding-left: 0; padding-top: 10px; width: 100%; }
    .cs-list { max-height: 130px; }
    .ring-card { flex-direction: column; gap: 14px; }
    .ring-meta { width: 100%; }
    .panel { padding: 10px 12px; }
    /* 窄屏：收紧组间距；轨道内允许换行，避免横向溢出 */
    .panel-filter { gap: 8px 12px; padding: 10px 12px; }
    .seg { flex-wrap: wrap; border-radius: var(--r-lg); }
    .seg-btn { padding: 4px 9px; }
    .topbar .search-box { flex: 1 1 150px; width: auto; min-width: 140px; }
    .btn { padding: 8px 13px; font-size: var(--fs-sm); }
    .modal { padding: 22px 18px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important; animation-iteration-count: 1 !important;
      transition-duration: .01ms !important; scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>
<div class="shell">

  <!-- 0 · 左侧：视图切换（独立陈列） -->
  <aside class="sidebar">
    <div class="side-label" id="side-label-views">视图</div>
    <div role="tablist" aria-labelledby="side-label-views">
    <button type="button" class="tab active" data-view="table" aria-current="page">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><circle cx="4.5" cy="6" r="1.3" fill="currentColor" stroke="none"/><circle cx="4.5" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="4.5" cy="18" r="1.3" fill="currentColor" stroke="none"/></svg>
      任务列表
    </button>
    <button type="button" class="tab" data-view="board">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="transform:rotate(180deg)"><rect x="3" y="4" width="5.5" height="16" rx="1.5"/><rect x="9.25" y="4" width="5.5" height="11" rx="1.5"/><rect x="15.5" y="4" width="5.5" height="7" rx="1.5"/></svg>
      看板视图
    </button>
    <button type="button" class="tab" data-view="timeline">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="3.5" x2="6" y2="20.5"/><circle cx="6" cy="8" r="2.2"/><circle cx="6" cy="16" r="2.2"/><line x1="11" y1="8" x2="20" y2="8"/><line x1="11" y1="16" x2="17" y2="16"/></svg>
      时间轴
    </button>
    </div>
    <div class="side-sep"></div>
    <button type="button" class="side-btn" id="btn-import">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v11"/><polyline points="8 10 12 14 16 10"/><path d="M4 19h16"/></svg>
      导入任务
    </button>
    <button type="button" class="side-btn" id="btn-backup-setup">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>
      备份设置
    </button>
    <button type="button" class="side-btn" id="btn-help" data-tip="数据保存在本机 · 安装到桌面 · 常用操作">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 4.5 1.5c0 1.5-2 2-2 3.2"/><path d="M12 17.2h.01"/></svg>
      使用说明
    </button>
  </aside>

  <div class="wrap">

    <!-- 1 · 顶部：品牌 + 项目切换 -->
    <div class="topbar">
      <div class="logo" id="page-logo">看</div>
      <div class="identity">
        <h1 id="page-title">进度看板</h1>
        <div class="date-line" id="top-date">—</div>
      </div>
      <div class="divider"></div>
      <div class="proj-switch">
        <span class="proj-label">项目</span>
        <select id="proj-select"></select>
        <select id="task-sort" class="sort-select" data-tip="任务按截止时间排序">
          <option value="default">默认顺序</option>
          <option value="date-asc">按截止时间（早→晚）</option>
          <option value="date-desc">按截止时间（晚→早）</option>
        </select>
        <button class="btn ghost" id="btn-proj-new">新建项目</button>
        <button class="btn ghost" id="btn-proj-rename">重命名项目</button>
        <button class="btn ghost" id="btn-proj-del">删除项目</button>
      </div>
      <div class="spacer"></div>
      <div class="search-box">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
        <input id="search" placeholder="搜索任务名称…" />
      </div>
      <button class="theme-btn" id="btn-theme" data-tip="切换明暗模式"></button>
    </div>

    <!-- 2 · 日历 + 可交互圆形进度（同一行各占一半） -->
    <div class="title-row">
      <div class="cal-card" id="cal-card">
        <div class="cal-left">
          <div class="cal-head">
            <div class="cal-title" id="cal-title">—</div>
            <button class="cal-nav-btn" id="cal-prev" data-tip="上个月">‹</button>
            <button class="cal-nav-btn" id="cal-next" data-tip="下个月">›</button>
            <button class="btn ghost" id="cal-today">今天</button>
          </div>
          <div class="cal-grid" id="cal-grid"></div>
        </div>
        <div class="cal-side">
          <div class="cd-box" id="cd-box"></div>
          <div class="cs-list" id="cs-list"></div>
        </div>
      </div>

      <!-- 时间块（仅时间轴视图显示）：固定三个月，按天的小方格横向对称铺满卡片 -->
      <div class="cal-card ts-card hidden" id="ts-card">
        <div class="ts-wrap">
          <div class="cal-head">
            <div class="cal-title" id="ts-title">—</div>
            <button class="cal-nav-btn" id="ts-prev" data-tip="往前一个月">‹</button>
            <button class="cal-nav-btn" id="ts-next" data-tip="往后一个月">›</button>
            <button class="btn ghost" id="ts-today">今天</button>
          </div>
          <div class="ts-grid" id="ts-grid"></div>
          <div class="ts-legend" id="ts-legend"></div>
        </div>
      </div>

      <div class="ring-card" id="ring-card">
        <div class="ring-wrap">
          <svg id="ring-svg" width="220" height="220" viewBox="0 0 220 220">
            <g id="ring-segs"></g>
            <g id="ring-leads"></g>
          </svg>
          <button type="button" class="ring-center" id="ring-center" data-tip="点击清除筛选" aria-label="清除状态筛选">
            <div class="ring-pct" id="ring-pct">0%</div>
            <div class="ring-label">总进度</div>
          </button>
        </div>
        <div class="ring-meta">
          <div class="rm-title">任务统计</div>
          <button class="rm-row" data-key="" data-tip="显示全部任务"><i style="background:var(--accent)"></i>总任务数<b id="rm-total">0</b></button>
          <button class="rm-row" data-key="done" data-tip="筛选已完成"><i style="background:var(--st-done)"></i>已完成<b id="rm-done">0</b></button>
          <button class="rm-row" data-key="doing" data-tip="筛选进行中"><i style="background:var(--st-doing)"></i>进行中<b id="rm-doing">0</b></button>
          <button class="rm-row" data-key="todo" data-tip="筛选待开始"><i style="background:var(--st-todo)"></i>待开始<b id="rm-todo">0</b></button>
          <button class="rm-row" data-key="revise" data-tip="筛选待修改"><i style="background:var(--st-revise)"></i>待修改<b id="rm-revise">0</b></button>
        </div>
      </div>

      <!-- 备忘录（任务列表视图时显示，替代圆形统计） -->
      <div class="ring-card memo-card hidden" id="memo-card">
        <div class="memo-wrap">
          <div class="rm-title">备忘录</div>
          <textarea id="memo-input" placeholder="随手记下想法、待办提醒、参考资料……自动保存"></textarea>
          <div class="memo-foot"><span id="memo-hint">内容随当前项目保存</span><button class="btn ghost" id="memo-clear">清空</button></div>
        </div>
      </div>
    </div>

    <!-- 3 · 筛选提示 -->
    <div class="stats-note" id="stats-note"></div>

    <!-- 4 · 筛选面板 + 操作面板 -->
    <div class="panels">
      <div class="panel panel-filter">
        <div class="filter-row" id="filter-row"></div>
        <button class="btn ghost hidden" id="btn-collapse">全部折叠</button>
        <button class="btn" id="btn-new"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>新建任务</button>
        <button type="button" class="btn filter-act hidden" id="btn-manage">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11"/><path d="M9 12h11"/><path d="M9 18h11"/><polyline points="3.5 5.5 5 7 7.5 4.5"/><polyline points="3.5 11.5 5 13 7.5 10.5"/><polyline points="3.5 17.5 5 19 7.5 16.5"/></svg>
          <span id="btn-manage-label">任务管理</span>
        </button>
        <input type="file" id="file-restore" accept=".json,application/json" class="hidden" />
      </div>
    </div>

    <!-- 5 · 内容区 -->
    <div class="card" id="view-table">
      <div class="batch-bar hidden" id="batch-bar">
        <label class="bb-all"><input type="checkbox" id="bb-all" />全选</label>
        <span class="bb-count" id="bb-count">已选 0 条</span>
        <div class="spacer"></div>
        <select class="bb-sel" id="bb-status"></select>
        <select class="bb-sel" id="bb-prio"></select>
        <button class="btn ghost" id="bb-del">删除选中</button>
        <button class="btn ghost" id="bb-exit">退出管理</button>
      </div>
      <div class="task-cards" id="task-cards"></div>
    </div>

    <div class="board hidden" id="view-board"></div>

    <div class="card hidden" id="view-timeline">
      <div class="timeline" id="tl-list"></div>
    </div>
  </div>
</div>

/* 数据版本号：结构变化时靠 normalizeData 兜底，脏数据不会把页面搞崩 */
const SCHEMA_VERSION = 2;
const STORAGE_KEY = CONFIG.storageKey;
const CORRUPT_KEY = CONFIG.storageKey + ".corrupt";

/* 把任意来源的数据（localStorage / 备份文件 / 旧版裸数组）整理成固定结构：
   items 保证是数组；status / priority 非法回落默认值；created 必须是 YYYY-MM-DD；
   id 缺失补发；active 越界收敛到合法下标 */
function normalizeData(raw) {
  if (Array.isArray(raw)) raw = { projects: [{ name: "例-毕业论文", items: raw }] };
  const src = (raw && typeof raw === "object") ? raw : {};
  const statKeys = CONFIG.statuses.map(s => s.key);
  const prioKeys = CONFIG.priorities.map(p => p.key);
  const normItem = it => {
    const o = (it && typeof it === "object") ? it : {};
    return {
      id: (o.id == null || o.id === "") ? Date.now() + Math.floor(Math.random() * 1000) : o.id,
      name: typeof o.name === "string" ? o.name : String(o.name ?? ""),
      status: statKeys.includes(o.status) ? o.status : "todo",
      priority: prioKeys.includes(o.priority) ? o.priority : "常规",
      owner: typeof o.owner === "string" ? o.owner : "",
      line: typeof o.line === "string" ? o.line : "",
      created: /^\d{4}-\d{2}-\d{2}$/.test(String(o.created || "")) ? String(o.created) : "",
    };
  };
  const projects = (Array.isArray(src.projects) ? src.projects : [])
    .filter(p => p && typeof p === "object")
    .map(p => ({
      id: p.id == null ? Date.now() : p.id,
      name: (typeof p.name === "string" && p.name.trim()) ? p.name : "未命名项目",
      memo: typeof p.memo === "string" ? p.memo : "",
      items: (Array.isArray(p.items) ? p.items : []).map(normItem),
    }));
  if (!projects.length) projects.push({ id: Date.now(), name: "例-毕业论文", items: [] });
  return {
    schemaVersion: SCHEMA_VERSION,
    active: Math.min(Math.max(0, Number(src.active) || 0), projects.length - 1),
    projects,
    // 折叠状态：{ [statusKey]: { [groupName]: true } }
    collapsed: (src.collapsed && typeof src.collapsed === "object") ? src.collapsed : {},
    taskSort: typeof src.taskSort === "string" ? src.taskSort : "default",
  };
}

const store = {
  load() {
    let raw = null;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { raw = null; }
    if (raw) {
      try {
        return normalizeData(JSON.parse(raw));
      } catch (e) {
        // 解析失败时保留原文供事后排查，而不是静默丢掉用户数据
        try { localStorage.setItem(CORRUPT_KEY, raw); } catch (_) {}
        setTimeout(() => toast("本地数据读取失败，已重置为示例数据（原始数据已保留在 " + CORRUPT_KEY + "）"), 0);
      }
    }
    return normalizeData({ projects: [{ name: "例-毕业论文", items: structuredClone(CONFIG.seed) }] });
  },
  save(d) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
    } catch (e) {
      // 容量超限 / 隐私模式：给出人话提示，绝不让保存异常打断渲染
      toast("本地保存失败：存储空间不足或浏览器处于隐私模式");
    }
  },
};

/* 提示层常驻 DOM 并带 aria-live：读屏软件能播报操作结果；错误类用 alert 打断播报 */
function toastLayer(alert) {
  const id = alert ? "toast-layer-alert" : "toast-layer";
  let el = document.getElementById(id);
  if (!el) {
    el = document.createElement("div");
    el.id = id;
    el.className = "toast-layer";
    el.setAttribute("role", alert ? "alert" : "status");
    el.setAttribute("aria-live", alert ? "assertive" : "polite");
    el.setAttribute("aria-atomic", "true");
    document.body.appendChild(el);
  }
  return el;
}
function toast(msg, alert) {
  const t = document.createElement("div");
  t.className = "toast" + (alert ? " toast-alert" : "");
  t.innerHTML = `${alert ? ALERT_SVG : OK_SVG}<span>${esc(msg)}</span>`;
  toastLayer(alert).appendChild(t);
  setTimeout(() => { t.classList.add("toast-out"); setTimeout(() => t.remove(), 280); }, 2400);
}

/* 时间筛选：按截止时间（created）的区间命中 */
const TIME_FILTERS = [
  { key: "",        label: "全部" },
  { key: "week",    label: "7 天内" },
  { key: "month",   label: "30 天内" },
  { key: "later",   label: "30 天后" },
];
/* 时间筛选：按截止时间（created）的区间命中。
   抽成带 key 参数的版本，筛选与分段上的条数统计共用同一套判定。
   除「全部」外都要求任务有截止日期，无日期的任务只出现在「全部」里。 */
function matchTimeKey(i, key) {
  if (!key) return true;
  const v = String(i.created || "");
  if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) return false;
  const d = daysFromToday(v);
  if (key === "week") return d >= 0 && d <= 7;
  if (key === "month") return d >= 0 && d <= 30;
  if (key === "later") return d > 30;
  return true;
}
function matchTime(i) { return matchTimeKey(i, fTime); }

/* interactive donut ring — multi-segment, each segment labelled with % + lead line */
function renderRing() {
  const all = items();
  const total = all.length;
  const count = k => all.filter(i => i.status === k).length;
  const done = count("done");
  const pct = total ? Math.round(done / total * 100) : 0;
  $("#ring-pct").textContent = `${pct}%`;

  $("#rm-total").textContent = total;
  $("#rm-done").textContent = done;
  $("#rm-doing").textContent = count("doing");
  $("#rm-todo").textContent = count("todo");
  $("#rm-revise").textContent = count("revise");

  // "总任务数" row is active only when no status filter
  document.querySelectorAll(".rm-row").forEach(row => {
    const isAll = row.dataset.key === "";
    row.classList.toggle("active", isAll ? fStatus === "" : fStatus === row.dataset.key);
  });

  /* ---- donut chart: annular slices, soft gradients, hover scale, adaptive labels ---- */
  const CX = 110, CY = 110, R_OUT = 88, R_IN = 52;   // thick donut band
  const segsG = $("#ring-segs");
  const leadsG = $("#ring-leads");
  const order = ["done", "doing", "revise", "todo"];
  const parts = order.map(k => ({ k, n: count(k), s: statusOf(k) })).filter(p => p.n > 0);

  // annular sector (donut slice)
  const arcPath = (a0, a1, rOut, rIn) => {
    const large = a1 - a0 > Math.PI ? 1 : 0;
    const x0 = CX + rOut * Math.cos(a0), y0 = CY + rOut * Math.sin(a0);
    const x1 = CX + rOut * Math.cos(a1), y1 = CY + rOut * Math.sin(a1);
    const x2 = CX + rIn * Math.cos(a1), y2 = CY + rIn * Math.sin(a1);
    const x3 = CX + rIn * Math.cos(a0), y3 = CY + rIn * Math.sin(a0);
    return `M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${rOut} ${rOut} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} ` +
           `L ${x2.toFixed(2)} ${y2.toFixed(2)} A ${rIn} ${rIn} 0 ${large} 0 ${x3.toFixed(2)} ${y3.toFixed(2)} Z`;
  };

  if (!parts.length) {
    segsG.innerHTML = `<path d="${arcPath(-Math.PI / 2, Math.PI * 1.5, R_OUT, R_IN)}" fill="${CONFIG.statuses[0].color}" opacity=".18"/>`;
    leadsG.innerHTML = "";
    return;
  }

  const defsHTML = [];

  let angle = -Math.PI / 2;   // start at 12 o'clock
  const segHTML = [];
  const lblHTML = [];

  parts.forEach((p, i) => {
    const frac = p.n / total;
    const span = 2 * Math.PI * frac;
    const a0 = angle;
    const a1 = angle + span;
    const safeA1 = a1 > a0 ? a1 : a0 + 0.001;
    const mid = angle + span / 2;
    const pctStr = Math.round(frac * 100);

    // soft gradient like the reference (light at one end)
    defsHTML.push(`<linearGradient id="segGrad${i}" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="${p.s.accent}" stop-opacity="1"/>
      <stop offset="100%" stop-color="${p.s.accent}" stop-opacity=".7"/>
    </linearGradient>`);

    // % + name on the band — narrow readable font range, clear gap between the two lines
    let labelHTML = "";
    if (frac >= 0.06) {
      const lr = (R_OUT + R_IN) / 2;
      const lx = CX + lr * Math.cos(mid), ly = CY + lr * Math.sin(mid);
      const arcLen = span * lr;
      // font size adapts to slice size; keep small so text never leaves the band (half-band = 18px)
      const fsPct = Math.max(8.5, Math.min(10.5, arcLen * 0.16));
      const fsSub = Math.max(6, Math.min(7.5, arcLen * 0.11));
      const yPct = ly - (fsPct * 0.28 + 1);
      const ySub = ly + (fsSub * 0.28 + 1);
      labelHTML = `<text class="ring-lbl" x="${lx.toFixed(1)}" y="${yPct.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="${fsPct.toFixed(1)}">${pctStr}%</text>
        <text class="ring-lbl-sub" x="${lx.toFixed(1)}" y="${ySub.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="${fsSub.toFixed(1)}">${p.s.label}</text>`;
    }

    segHTML.push(`<g class="ring-seg-g" data-key="${p.k}" data-tip="${p.s.label} ${p.n} 项 · ${pctStr}%">
      <path class="ring-seg" d="${arcPath(a0, safeA1, R_OUT, R_IN)}" fill="url(#segGrad${i})"></path>
      ${labelHTML}
    </g>`);

    angle += span;
  });

  // base disc fills the hole and under the band — center + ring read as one solid coin
  segsG.innerHTML = `<defs>${defsHTML.join("")}</defs>
    <circle cx="${CX}" cy="${CY}" r="${R_OUT}" style="fill: var(--surface-2)"/>` + segHTML.join("");
  leadsG.innerHTML = "";

  /* 环形图扇区：鼠标点击与键盘 Enter/Space 都能筛选状态；对读屏暴露为带标签的按钮 */
  segsG.querySelectorAll(".ring-seg-g").forEach(g => {
    const pick = () => { fStatus = fStatus === g.dataset.key ? "" : g.dataset.key; render(); };
    g.setAttribute("role", "button");
    g.setAttribute("tabindex", "0");
    g.setAttribute("aria-label", g.getAttribute("data-tip") || "");
    g.onclick = e => { e.stopPropagation(); pick(); };
    g.onkeydown = e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); e.stopPropagation(); pick(); }
    };
  });
}

/* 任务按截止时间排序（仅显示层，不改动底层顺序） */
function sortTasks(list) {
  const mode = data.taskSort || "default";
  if (mode === "default") return list;
  // 有截止日期的排前面，无日期的排后面；再按日期升/降序
  const dir = mode === "date-asc" ? 1 : -1;
  return [...list].sort((a, b) => {
    const da = /^\d{4}-\d{2}-\d{2}$/.test(String(a.created || "")) ? String(a.created) : null;
    const db = /^\d{4}-\d{2}-\d{2}$/.test(String(b.created || "")) ? String(b.created) : null;
    if (!da && !db) return 0;
    if (!da) return 1;
    if (!db) return -1;
    return da === db ? 0 : (da < db ? -dir : dir);
  });
}

/* ---- filter row: 三组分段控件，每段带实时条数 ---- */
function renderFilters() {
  const q = $("#search").value.trim().toLowerCase();
  const hit = i => !q || (i.name || "").toLowerCase().includes(q);
  const all = items();
  /* 每组的统计基准 = 通过「其它两组筛选 + 搜索关键词」的任务，本组筛选不计入。
     这样点任意一段，其余两组的数字会同步跟着变，且与下方列表始终对得上。 */
  const baseStatus = all.filter(i => hit(i) && (!fPriority || i.priority === fPriority) && matchTime(i));
  const basePrio   = all.filter(i => hit(i) && (!fStatus || i.status === fStatus) && matchTime(i));
  const baseTime   = all.filter(i => hit(i) && (!fStatus || i.status === fStatus) && (!fPriority || i.priority === fPriority));
  /* 「全部」恒为首段，条数取该组统计基准的长度 */
  const segBtn = (key, label, n, active, color) => {
    const cls = `seg-btn${active ? " active" : ""}`;
    const cs = color ? ` style="--c:${color}"` : "";
    return `<button type="button" class="${cls}"${cs} data-v="${esc(key)}" aria-pressed="${active}">` +
      `<span class="seg-t">${esc(label)}</span><span class="seg-n${n ? "" : " is-zero"}">${n}</span></button>`;
  };
  /* 行序：状态 → 优先级 → 时间（顺序只影响显示，不影响筛选逻辑） */
  const groups = [
    {
      id: "status", name: "状态", cur: fStatus,
      items: [{ key: "", label: "全部", n: baseStatus.length }].concat(
        CONFIG.statuses.map(s => ({ key: s.key, label: s.label, n: baseStatus.filter(i => i.status === s.key).length, color: s.accent }))
      ),
    },
    {
      id: "priority", name: "优先级", cur: fPriority,
      items: [{ key: "", label: "全部", n: basePrio.length }].concat(
        CONFIG.priorities.map(p => ({ key: p.key, label: p.key, n: basePrio.filter(i => i.priority === p.key).length, color: p.accent }))
      ),
    },
    {
      id: "time", name: "时间", cur: fTime,
      items: TIME_FILTERS.map(t => ({ key: t.key, label: t.label, n: baseTime.filter(i => matchTimeKey(i, t.key)).length })),
    },
  ];

  $("#filter-row").innerHTML = groups.map(g => `<div class="filter-group" data-group="${g.id}">
      <span class="filter-label">${g.name}</span>
      <div class="seg" role="group" aria-label="${g.name}筛选">${
        g.items.map(o => segBtn(o.key, o.label, o.n, (g.cur || "") === o.key, o.color)).join("")
      }</div>
    </div>`).join("");

  /* 点击只写入筛选状态，显示统一交给 render() 刷新 */
  const setter = { status: v => { fStatus = v; }, priority: v => { fPriority = v; }, time: v => { fTime = v; } };
  $("#filter-row").querySelectorAll(".filter-group").forEach(g => {
    const put = setter[g.dataset.group];
    g.querySelectorAll(".seg-btn").forEach(b => b.onclick = () => { put(b.dataset.v); render(); });
  });
}
