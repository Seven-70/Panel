function checkHTML(item) {
  const done = item.status === "done";
  const c = statusOf("done").accent;
  const tip = item.status === "todo" ? "点击开始（进行中）"
    : item.status === "doing" ? "点击标记完成"
    : item.status === "done" ? "点击标记为待修改"
    : "点击标记完成";
  return `<button class="check js-toggle ${done ? "is-done" : ""}" style="--c:${c}" data-tip="${tip}">${CHECK_SVG}</button>`;
}

function renderTable() {
  const list = filtered();
  const grid = $("#task-cards");
  grid.classList.toggle("is-batch", batchMode);
  if (!list.length) {
    const filtering = !!(fStatus || fPriority || fTime || $("#search").value.trim());
    grid.innerHTML = `<div class="empty" role="status">${INBOX_SVG}
      <b>${filtering ? "没有匹配的任务" : "还没有任务"}</b>
      <span>${filtering ? "换个筛选条件，或清除筛选后查看全部" : "点击「新建任务」添加第一条"}</span>
      ${filtering ? `<div><button type="button" class="btn ghost empty-action" id="empty-clear">清除筛选</button></div>` : ""}
    </div>`;
    const clr = grid.querySelector("#empty-clear");
    if (clr) clr.onclick = clearFilters;
    return;
  }
  grid.innerHTML = list.map((item, idx) => {
    const s = statusOf(item.status);
    const p = prioOf(item.priority);
    const checked = batchMode && batchSel.has(String(item.id));
    const box = batchMode ? `<input type="checkbox" class="batch-check" ${checked ? "checked" : ""} />` : "";
    return `<div class="tcard ${item.status === "done" ? "is-done" : ""} ${animateRows ? "anim-rise" : ""}" data-id="${item.id}" draggable="${!batchMode}"
      role="button" tabindex="0" aria-label="${batchMode ? "选择任务：" : "打开任务："}${esc(item.name)}"
      style="--sc:${s.accent}${animateRows ? `;animation-delay:${Math.min(idx * 26, 300)}ms` : ""}">
      <div class="tc-head">${box}${checkHTML(item)}<div class="tc-name">${esc(item.name)}</div><button class="icon-btn js-del" data-tip="删除" aria-label="删除任务">${TRASH_SVG}</button></div>
      <div class="tc-badges">
        <span class="badge" style="background:${tone(s.color)};color:${toneText(s.text)}"><span class="dot"></span>${s.label}</span>
        <span class="badge" style="background:${tone(p.color)};color:${toneText(p.text)}">${p.key}</span>
        ${item.line ? `<span class="tc-stage">${esc(item.line)}</span>` : ""}
      </div>
      <div class="tc-foot">
        ${item.created ? `<span class="mini ${isOverdue(item, item.created) ? "overdue" : ""}" data-tip="截止时间">${CAL_SVG}${esc(item.created)}</span>` : ""}
      </div>
    </div>`;
  }).join("");
  /* 卡片交互改为容器级事件委托：重建后无需逐张重新绑定 */
  if (!grid.dataset.wired) {
    grid.dataset.wired = "1";
    grid.addEventListener("click", e => {
      if (e.target.closest(".batch-check")) return;   // 勾选框交给 change 处理
      const card = e.target.closest(".tcard");
      if (!card) return;
      const item = () => items().find(i => i.id == card.dataset.id);
      if (e.target.closest(".js-del")) { e.stopPropagation(); confirmDelete(item()); return; }
      if (e.target.closest(".js-toggle")) { e.stopPropagation(); advanceStatus(item()); return; }
      if (batchMode) { toggleBatch(item(), card); return; }
      openModal(item());
    });
    grid.addEventListener("change", e => {
      const box = e.target.closest(".batch-check");
      if (!box) return;
      const card = box.closest(".tcard");
      if (!card) return;
      const k = String(card.dataset.id);
      box.checked ? batchSel.add(k) : batchSel.delete(k);
      syncBatchBar();
    });
    /* 键盘：Enter/Space 打开或勾选；Alt + 上下键等价于拖拽换序 */
    grid.addEventListener("keydown", e => {
      const card = (e.target.classList && e.target.classList.contains("tcard")) ? e.target : null;
      if (!card) return;
      const item = () => items().find(i => i.id == card.dataset.id);
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        if (batchMode) toggleBatch(item(), card); else openModal(item());
        return;
      }
      if (!e.altKey || (e.key !== "ArrowUp" && e.key !== "ArrowDown")) return;
      e.preventDefault();
      const cur = item();
      if (!cur) return;
      const vis = filtered();
      const i = vis.findIndex(x => x.id == cur.id);
      if (i < 0) return;
      if (e.key === "ArrowUp") { if (i > 0) moveItem(cur.id, vis[i - 1].id); else return; }
      else { const after = vis[i + 2]; moveItem(cur.id, after ? after.id : null); }
      persist();
      const again = grid.querySelector(`.tcard[data-id="${cur.id}"]`);
      if (again) again.focus();
      toast("已调整任务顺序");
    });
  }
  if (!batchMode) wireRowDnD();
}

/* ---- 任务管理 · 批量操作 ---- */
function toggleBatch(item, card) {
  const k = String(item.id);
  batchSel.has(k) ? batchSel.delete(k) : batchSel.add(k);
  const box = card && card.querySelector(".batch-check");
  if (box) box.checked = batchSel.has(k);
  syncBatchBar();
}

function syncBatchBar() {
  const list = filtered();
  const chosen = list.filter(i => batchSel.has(String(i.id))).length;
  $("#batch-bar").classList.toggle("hidden", !(currentView === "table" && batchMode));
  $("#bb-count").textContent = `已选 ${chosen} 条`;
  const all = $("#bb-all");
  all.checked = list.length > 0 && chosen === list.length;
  all.indeterminate = chosen > 0 && chosen < list.length;
  $("#bb-del").disabled = chosen === 0;
  $("#btn-manage-label").textContent = batchMode ? "退出管理" : "任务管理";
  $("#btn-manage").classList.toggle("active", batchMode);
}

/* 对已选任务统一应用某项修改 */
function applyBatch(fn) {
  if (!batchSel.size) return;
  items().forEach(i => { if (batchSel.has(String(i.id))) fn(i); });
  persist();
}

/* 批量删除已选任务 */
function batchDelete() {
  const ids = [...batchSel];
  if (!ids.length) return;
  const names = items().filter(i => batchSel.has(String(i.id)));
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `<div class="modal" style="width:400px">
    <button class="modal-x js-x" data-tip="关闭">${X_SVG}</button>
    <h2>批量删除</h2>
    <div class="sub">确定删除已选中的 <b>${names.length}</b> 条任务？此操作不可撤销。</div>
    <div class="modal-list">${names.slice(0, 6).map(i => `<span>· ${esc(i.name)}</span>`).join("")}${names.length > 6 ? `<span>… 等共 ${names.length} 条</span>` : ""}</div>
    <div class="modal-actions">
      <div class="spacer"></div>
      <button class="btn ghost" id="b-cancel">取消</button>
      <button class="btn danger" id="b-ok">删除</button>
    </div></div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.onclick = e => { if (e.target === overlay) close(); };
  overlay.querySelectorAll(".js-x").forEach(b => b.onclick = close);
  overlay.querySelector("#b-cancel").onclick = close;
  overlay.querySelector("#b-ok").onclick = () => {
    const proj = activeProject();
    proj.items = proj.items.filter(i => !batchSel.has(String(i.id)));
    batchSel.clear();   // 保留管理模式，方便继续操作
    persist(); close();
  };
}

/* ================= board view (collapsible outline) ================= */
function isCollapsed(statusKey, groupName) {
  return !!(data.collapsed[statusKey] && data.collapsed[statusKey][groupName]);
}
function toggleGroup(statusKey, groupName) {
  if (!data.collapsed[statusKey]) data.collapsed[statusKey] = {};
  data.collapsed[statusKey][groupName] = !data.collapsed[statusKey][groupName];
  store.save(data);   // no full re-render → CSS animation plays
}
function updateCollapseBtn() {
  const names = [...new Set(filtered().map(i => i.line || "未分类"))];
  const anyExpanded = CONFIG.statuses.some(s => names.some(n => !isCollapsed(s.key, n)));
  $("#btn-collapse").textContent = anyExpanded ? "全部折叠" : "全部展开";
}

/* ================= 时间轴视图：按截止日期纵向排成时间轴 ================= */
const fmtDate = ds => {
  const d = new Date(ds);
  return `${d.getMonth() + 1} 月 ${d.getDate()} 日 · 周${WEEK[d.getDay()]}`;
};
function renderTimeline() {
  const el = $("#tl-list");
  /* 按截止日期分组：有日期的按日期升序，无日期的单独落在最后 */
  const groups = [];
  const index = {};
  filtered().forEach(it => {
    const hasDate = /^\d{4}-\d{2}-\d{2}$/.test(String(it.created || ""));
    const k = hasDate ? it.created : "";
    if (!(k in index)) { index[k] = groups.length; groups.push({ date: k, items: [] }); }
    groups[index[k]].items.push(it);
  });
  groups.sort((a, b) => {
    if (!a.date) return 1;
    if (!b.date) return -1;
    return a.date < b.date ? -1 : 1;
  });

  if (!groups.length) {
    el.innerHTML = `<div class="empty" role="status">${INBOX_SVG}
      <b>没有匹配的任务</b><span>换个筛选条件，或清除筛选后查看全部</span></div>`;
    return;
  }

  const today = todayStr();
  el.innerHTML = groups.map(g => {
    const hasDate = !!g.date;
    const d = hasDate ? daysFromToday(g.date) : null;
    const overdue = hasDate && d < 0 && g.items.some(i => i.status !== "done");
    const cls = [!hasDate ? "is-none" : "", overdue ? "is-overdue" : "", hasDate && g.date === today ? "is-today" : ""].filter(Boolean).join(" ");
    const rel = !hasDate ? "" : d === 0 ? "今天" : d > 0 ? `${d} 天后` : `已逾期 ${Math.abs(d)} 天`;
    const blocks = g.items.map(it => {
      const s = statusOf(it.status), p = prioOf(it.priority);
      return `<button type="button" class="tl-block ${it.status === "done" ? "is-done" : ""}" data-id="${it.id}" style="--pc:${p.accent}">` +
        `<span class="tl-name">${esc(it.name)}</span>` +
        `<span class="tl-meta">` +
          `<span class="badge" style="background:${tone(s.color)};color:${toneText(s.text)}"><span class="dot"></span>${s.label}</span>` +
          `<span class="badge" style="background:${tone(p.color)};color:${toneText(p.text)}">${p.key}</span>` +
          (it.line ? `<span class="tc-stage">${esc(it.line)}</span>` : "") +
        `</span></button>`;
    }).join("");
    return `<div class="tl-row ${cls}" data-date="${g.date}">
      <div class="tl-date"><b>${hasDate ? esc(fmtDate(g.date)) : "无截止日期"}</b>${rel ? `<span class="${overdue ? "is-overdue" : ""}">${rel}</span>` : `<span>共 ${g.items.length} 条</span>`}</div>
      <div class="tl-blocks">${blocks}</div>
    </div>`;
  }).join("");

  /* 点任务块打开编辑弹窗，和列表 / 看板一致 */
  el.querySelectorAll(".tl-block").forEach(b =>
    b.onclick = () => openModal(items().find(i => i.id == b.dataset.id))
  );
}

/* ================= 时间块：固定三个月，按天的小方格横向对称铺满 ================= */
let tsOffset = 0;        // 以月为单位的偏移
const TS_COLS = 16;      // 固定列数：行数按天数推算，网格整体铺满卡片宽度
function renderTimeGrid() {
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth() + tsOffset, 1);
  const end = new Date(start.getFullYear(), start.getMonth() + 3, 0);   // 三个月区间的最后一天
  $("#ts-title").textContent =
    `${start.getFullYear()} 年 ${start.getMonth() + 1} 月 – ${end.getFullYear()} 年 ${end.getMonth() + 1} 月`;
  const days = Math.round((end - start) / 86400000) + 1;
  const rows = Math.ceil(days / TS_COLS);

  /* 与筛选联动：按筛选后的任务集合着色，方格随筛选内容一起变化 */
  const byDate = {};
  filtered().forEach(it => {
    const k = String(it.created || "");
    if (k) (byDate[k] = byDate[k] || []).push(it);
  });
  const rank = CONFIG.priorities.map(p => p.key);
  const today = todayStr();
  const cells = [];
  /* 整块铺满：末尾空槽用紧接其后的日期补上，网格始终是完整矩形 */
  for (let i = 0; i < rows * TS_COLS; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const ds = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    const list = byDate[ds] || [];
    const top = list.slice().sort((a, b) => rank.indexOf(a.priority) - rank.indexOf(b.priority))[0];
    const overdue = ds < today && list.some(x => x.status !== "done");
    const cls = ["ts-cell", list.length ? "has-tasks" : "", ds === today ? "is-today" : "", overdue ? "is-overdue" : ""].filter(Boolean).join(" ");
    const tip = `${d.getMonth() + 1} 月 ${d.getDate()} 日 · ${list.length ? list.length + " 条任务" : "无截止任务"}`;
    cells.push(`<button type="button" class="${cls}" data-date="${ds}" data-tip="${tip}"${top ? ` style="--pc:${prioOf(top.priority).accent}"` : ""}><b>${d.getDate()}</b></button>`);
  }
  const grid = $("#ts-grid");
  grid.style.setProperty("--cols", String(TS_COLS));
  grid.style.setProperty("--rows", String(rows));
  grid.innerHTML = cells.join("");
  /* 点方格 → 跳到下方时间轴里同一天的那一行 */
  grid.querySelectorAll(".ts-cell[data-date]").forEach(c => c.onclick = () => jumpToDate(c.dataset.date));
  $("#ts-legend").innerHTML =
    CONFIG.priorities.map(p => `<span class="ts-lg"><i style="background:${p.accent}"></i>${p.key}</span>`).join("") +
    `<span class="ts-lg"><i class="ts-lg-today"></i>今天</span><span class="ts-lg ts-hint">点方格跳到下方对应日期</span>`;
}

/* 点时间块方格：滚到下方时间轴里同一天的行，并高亮闪一下 */
function jumpToDate(ds) {
  const target = [...document.querySelectorAll("#tl-list .tl-row")].find(r => r.dataset.date === ds);
  if (!target) { toast(`${fmtDate(ds)} 没有任务`); return; }
  target.scrollIntoView({ behavior: "smooth", block: "center" });
  target.classList.add("is-flash");
  setTimeout(() => target.classList.remove("is-flash"), 1400);
}

function renderBoard() {
  const data2 = filtered();
  const total = data2.length || 1;   // percentages follow the filtered set
  $("#view-board").innerHTML = CONFIG.statuses.map(s => {
    const list = data2.filter(i => i.status === s.key);
    const pct = Math.round(list.length / total * 100);

    // group by stage (line), preserving first-seen order
    const groups = [];
    const index = {};
    list.forEach(item => {
      const g = item.line || "未分类";
      if (!(g in index)) { index[g] = groups.length; groups.push({ name: g, items: [] }); }
      groups[index[g]].items.push(item);
    });

    const body = list.length
      ? groups.map(g => {
          const open = !isCollapsed(s.key, g.name);
          const preview = esc(g.items[0].name) + (g.items.length > 1 ? ` 等 ${g.items.length} 项` : "");
          return `<div class="grp ${open ? "open" : ""}" data-status="${s.key}" data-name="${esc(g.name)}">
            <button type="button" class="grp-head" aria-expanded="${open}" data-tip="${open ? "点击折叠" : "点击展开"}">
              <span class="grp-arrow" aria-hidden="true">${CHEV_SVG}</span>
              <span class="grp-name">${esc(g.name)}</span>
              <span class="grp-count">${g.items.length}</span>
            </button>
            <div class="grp-preview">${preview}</div>
            <div class="grp-children"><div class="grp-inner">${g.items.map((it, gi) => ticketHTML(it, gi)).join("")}</div></div>
          </div>`;
        }).join("")
      : `<div class="col-empty">${INBOX_SVG}暂无任务<br/>拖动卡片到这里</div>`;

    return `<div class="col" data-status="${s.key}" style="--c:${s.accent}">
      <div class="col-head">
        <div class="ch-row">
          <span class="ch-dot"></span>
          <h3>${s.label}</h3>
          <span class="count">${list.length}</span>
        </div>
        <div class="ch-sub">
          <span>占筛选结果 ${pct}%</span>
          <div class="ch-bar"><i style="width:${pct}%"></i></div>
        </div>
      </div>
      <div class="col-body">${body}</div>
    </div>`;
  }).join("");
  wireBoard();
}

function ticketHTML(item, idx = 0) {
  const p = prioOf(item.priority);
  return `<div class="ticket ${animateRows ? "anim-rise" : ""}" draggable="true" data-id="${item.id}" role="button" tabindex="0" aria-label="打开任务：${esc(item.name)}" style="--pc:${p.accent || p.text}${animateRows ? `;animation-delay:${Math.min(idx * 28, 280)}ms` : ""}">
    <button class="icon-btn js-del t-del" data-tip="删除" aria-label="删除任务">${TRASH_SVG}</button>
    <div class="t-head">${checkHTML(item)}<div class="t-name">${esc(item.name)}</div></div>
    <div class="t-meta">
      <span class="badge" style="background:${tone(p.color)};color:${toneText(p.text)}">${p.key}</span>
      ${item.created ? `<span class="mini ${isOverdue(item, item.created) ? "overdue" : ""}" data-tip="截止时间">${CAL_SVG}${esc(item.created)}</span>` : ""}
    </div></div>`;
}

/* 状态推进：待开始 → 进行中 → 已完成 →（询问）待修改 → 已完成 */
const STATUS_FLOW = { todo: "doing", doing: "done", revise: "done" };

function advanceStatus(item) {
  if (!item) return;
  if (item.status === "done") { askRevise(item); return; }
  item.status = STATUS_FLOW[item.status] || "done";
  persist();
}

/* 已完成任务被点击时，询问是否转入「待修改」 */
function askRevise(item) {
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `<div class="modal" style="width:380px">
    <button class="modal-x js-x" data-tip="关闭">${X_SVG}</button>
    <h2>任务已完成</h2>
    <div class="sub">「${esc(item.name)}」是否需要标记为<b>待修改</b>？</div>
    <div class="modal-actions">
      <div class="spacer"></div>
      <button class="btn ghost" id="c-cancel">保持已完成</button>
      <button class="btn" id="c-ok">转为待修改</button>
    </div></div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.onclick = e => { if (e.target === overlay) close(); };
  overlay.querySelectorAll(".js-x").forEach(b => b.onclick = close);
  overlay.querySelector("#c-cancel").onclick = close;
  overlay.querySelector("#c-ok").onclick = () => { item.status = "revise"; persist(); close(); };
}

/* ---- drag sort ---- */
function moveItem(dragId, beforeId) {
  const list = items();
  const from = list.findIndex(i => i.id == dragId);
  if (from < 0) return;
  const [it] = list.splice(from, 1);
  if (beforeId == null) { list.push(it); return; }
  const to = list.findIndex(i => i.id == beforeId);
  list.splice(to < 0 ? list.length : to, 0, it);
}

function clearDropMarks() {
  document.querySelectorAll(".drop-before, .drop-after").forEach(el => el.classList.remove("drop-before", "drop-after"));
}

function wireRowDnD() {
  let dragId = null;
  $("#task-cards").querySelectorAll(".tcard[data-id]").forEach(card => {
    card.ondragstart = e => { dragId = card.dataset.id; card.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; };
    card.ondragend = () => { card.classList.remove("dragging"); clearDropMarks(); };
    card.ondragover = e => {
      e.preventDefault();
      clearDropMarks();
      if (card.dataset.id === dragId) return;
      const r = card.getBoundingClientRect();
      card.classList.add(e.clientY < r.top + r.height / 2 ? "drop-before" : "drop-after");
    };
    card.ondrop = e => {
      e.preventDefault();
      const r = card.getBoundingClientRect();
      const before = e.clientY < r.top + r.height / 2;
      const targetId = card.dataset.id;
      clearDropMarks();
      if (dragId === targetId) return;
      moveItem(dragId, before ? targetId : nextVisibleId(targetId));
      persist();
    };
  });
}

function nextVisibleId(targetId) {
  const vis = filtered();
  const idx = vis.findIndex(i => i.id == targetId);
  return idx >= 0 && idx + 1 < vis.length ? vis[idx + 1].id : null;
}

function wireBoard() {
  let dragId = null;

  $("#view-board").querySelectorAll(".grp-head").forEach(head => {
    head.onclick = e => {
      if (e.target.closest(".js-del") || e.target.closest(".js-toggle")) return;
      const grp = head.closest(".grp");
      toggleGroup(grp.dataset.status, grp.dataset.name);
      const open = !isCollapsed(grp.dataset.status, grp.dataset.name);
      grp.classList.toggle("open", open);
      head.dataset.tip = open ? "点击折叠" : "点击展开";
      head.setAttribute("aria-expanded", String(open));
      updateCollapseBtn();
    };
  });

  $("#view-board").querySelectorAll(".ticket").forEach(t => {
    t.ondragstart = e => { dragId = t.dataset.id; t.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; };
    t.ondragend = () => { t.classList.remove("dragging"); clearDropMarks(); };
    t.onclick = () => openModal(items().find(i => i.id == t.dataset.id));
    /* 键盘：Enter/Space 打开任务，Delete 删除（等价于鼠标点卡片与删除按钮） */
    t.onkeydown = e => {
      const target = () => items().find(i => i.id == t.dataset.id);
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openModal(target()); }
      else if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); confirmDelete(target()); }
    };
    t.ondragover = e => {
      e.preventDefault(); e.stopPropagation();
      clearDropMarks();
      if (t.dataset.id !== dragId) t.classList.add("drop-before");
    };
    t.ondrop = e => {
      e.preventDefault(); e.stopPropagation();
      const targetId = t.dataset.id;
      clearDropMarks();
      if (dragId === targetId) return;
      const dragged = items().find(i => i.id == dragId);
      const target = items().find(i => i.id == targetId);
      if (dragged && target) {
        dragged.status = target.status;
        dragged.line = target.line;   // move into the target's outline group
      }
      moveItem(dragId, targetId);
      persist();
    };
  });

  $("#view-board").querySelectorAll(".grp").forEach(grp => {
    grp.ondragover = e => {
      if (e.target.closest(".ticket")) return;
      e.preventDefault();
    };
    grp.ondrop = e => {
      if (e.target.closest(".ticket")) return;
      e.preventDefault();
      const item = items().find(i => i.id == dragId);
      if (!item) return;
      item.status = grp.dataset.status;
      if (grp.dataset.name !== "未分类") item.line = grp.dataset.name;
      moveItem(dragId, null);
      persist();
    };
  });

  $("#view-board").querySelectorAll(".js-del").forEach(btn =>
    btn.onclick = e => { e.stopPropagation(); confirmDelete(items().find(i => i.id == btn.closest(".ticket").dataset.id)); });
  $("#view-board").querySelectorAll(".js-toggle").forEach(btn =>
    btn.onclick = e => { e.stopPropagation(); advanceStatus(items().find(i => i.id == btn.closest(".ticket").dataset.id)); });

  $("#view-board").querySelectorAll(".col").forEach(col => {
    col.ondragover = e => { e.preventDefault(); col.classList.add("drop-hover"); };
    col.ondragleave = () => col.classList.remove("drop-hover");
    col.ondrop = e => {
      if (e.target.closest(".grp")) return;
      col.classList.remove("drop-hover");
      const item = items().find(i => i.id == dragId);
      if (!item) return;
      item.status = col.dataset.status;
      moveItem(dragId, null);
      persist();
    };
  });
}

/* 记录重建前后的焦点与关键滚动位置，整页重绘不再丢失它们 */
function captureViewState() {
  const active = document.activeElement;
  const inside = active && active !== document.body;
  return {
    key: (inside && active.dataset && active.dataset.id) ? active.dataset.id : null,
    scrollY: window.scrollY,
    boardLeft: $("#view-board").scrollLeft || 0,
    csTop: $("#cs-list").scrollTop || 0,
  };
}
function restoreViewState(s) {
  if (s.key) {
    const back = document.querySelector(`.tcard[data-id="${s.key}"], .ticket[data-id="${s.key}"]`);
    if (back) { try { back.focus({ preventScroll: true }); } catch (e) {} }
  }
  $("#view-board").scrollLeft = s.boardLeft;
  $("#cs-list").scrollTop = s.csTop;
  window.scrollTo(0, s.scrollY);
}

function render() {
  const view = captureViewState();
  renderProjBar();

  $("#ts-card").classList.toggle("hidden", currentView !== "timeline");

  $("#ring-card").classList.toggle("hidden", currentView === "table");
  $("#memo-card").classList.toggle("hidden", currentView !== "table");
  // 全部折叠 / 全部展开 仅在看板视图显示；新建任务在任务列表与时间轴视图显示
  $("#btn-collapse").classList.toggle("hidden", currentView !== "board");
  $("#btn-new").classList.toggle("hidden", currentView === "board");

      <button class="btn" id="m-save">保存</button>
    </div></div>`;
  document.body.appendChild(overlay);
  wireChipGroups(overlay);

  /* ---- mini date picker ---- */
  (function wireDatePicker() {
    const input = overlay.querySelector("#m-created");
    const btn = overlay.querySelector("#m-date-btn");
    const pick = overlay.querySelector("#m-datepick");
    const title = pick.querySelector(".dp-title");
    const grid = pick.querySelector(".dp-grid");
    pick.querySelector(".dp-dow").innerHTML = WEEK.map(w => `<span>${w}</span>`).join("");
    const init = (input.value && /^\d{4}-\d{2}-\d{2}$/.test(input.value)) ? input.value : todayStr();
    let py = +init.slice(0, 4), pm = +init.slice(5, 7) - 1;

    function draw() {
      title.textContent = `${py} 年 ${pm + 1} 月`;
      const first = new Date(py, pm, 1);
      const startDow = first.getDay();
      const daysInMonth = new Date(py, pm + 1, 0).getDate();
      const daysPrev = new Date(py, pm, 0).getDate();
      const today = todayStr();
      let cells = "";
      for (let i = 0; i < 42; i++) {
        const dayNum = i - startDow + 1;
        const inMonth = dayNum >= 1 && dayNum <= daysInMonth;
        let y = py, m = pm, d = dayNum;
        if (dayNum < 1) { m--; if (m < 0) { m = 11; y--; } d = daysPrev + dayNum; }
        else if (dayNum > daysInMonth) { d = dayNum - daysInMonth; m++; if (m > 11) { m = 0; y++; } }
        const ds = calDateStr(y, m, d);
        cells += `<button type="button" class="dp-day ${inMonth ? "" : "other"} ${ds === today ? "today" : ""} ${ds === input.value ? "sel" : ""}" data-d="${ds}">${d}</button>`;
      }
      grid.innerHTML = cells;
      grid.querySelectorAll(".dp-day").forEach(b => b.onclick = () => {
        input.value = b.dataset.d;
        pick.classList.add("hidden");
      });

    btn.onclick = e => { e.stopPropagation(); pick.classList.toggle("hidden"); if (!pick.classList.contains("hidden")) draw(); };
    pick.onclick = e => e.stopPropagation();
    pick.querySelector("#dp-prev").onclick = () => { pm--; if (pm < 0) { pm = 11; py--; } draw(); };
    pick.querySelector("#dp-next").onclick = () => { pm++; if (pm > 11) { pm = 0; py++; } draw(); };
    draw();
    setTimeout(() => document.addEventListener("click", () => pick.classList.add("hidden"), { once: true }), 0);
  })();

  const close = () => overlay.remove();
  overlay.onclick = e => { if (e.target === overlay) close(); };
  overlay.querySelectorAll(".js-x").forEach(b => b.onclick = close);
  overlay.querySelector("#m-cancel").onclick = close;
  const submit = () => {
    d.name = overlay.querySelector("#m-name").value.trim() || "未命名";
    d.owner = d.owner || "本人";
    d.line = overlay.querySelector("#m-line").value.trim();
    d.created = overlay.querySelector("#m-created").value.trim();
    d.status = chipValue(overlay, "status") || d.status;
    d.priority = chipValue(overlay, "priority") || d.priority;
    if (!editing) items().unshift(d);
    persist(); close();
  };
  overlay.querySelector("#m-save").onclick = submit;
  overlay.querySelectorAll("input").forEach(i => { i.onkeydown = e => { if (e.key === "Enter") submit(); }; });
  overlay.querySelector("#m-name").focus();
  if (editing) overlay.querySelector("#m-del").onclick = () => { close(); confirmDelete(d); };
}

function promptBox(title, sub, placeholder, initial, okLabel, onOk) {

  const overlay = document.createElement("div");

      <button class="btn" id="pb-ok">${okLabel}</button>
    </div></div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  const input = overlay.querySelector("#pb-input");
  input.focus(); input.select();
  overlay.onclick = e => { if (e.target === overlay) close(); };
  overlay.querySelectorAll(".js-x").forEach(b => b.onclick = close);
  overlay.querySelector("#pb-cancel").onclick = close;
  let done = false;
  const submit = () => {
    if (done) return;                        /* 一次确认只提交一次，避免回车重复触发 */
    const v = input.value.trim();
    if (!v) return;
    done = true;
    overlay.dataset.noRefocus = "1";         /* 提交后焦点不还给触发按钮，避免残留的回车又把弹窗点开 */
    close();
    onOk(v);
  };
  overlay.querySelector("#pb-ok").onclick = submit;
  input.onkeydown = e => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    if (e.repeat) return;
    submit();
  };
}

/* ---- outline import ---- */
const BULLET_RE = /^(?:[-*+•·]|\(?\d+[.、)．)）]|（\d+）|[一二三四五六七八九十]+[、.．]|第[一二三四五六七八九十百\d]+[章节部分篇]|[①②③④⑤⑥⑦⑧⑨⑩])\s*/;

/* 复制自 AI 回答的 LaTeX 命令 → 对应符号；表里没有的命令直接丢弃 */
const LATEX_MAP = {
  rightarrow: "→", to: "→", longrightarrow: "⟶", Rightarrow: "⇒",
  leftarrow: "←", leftrightarrow: "↔", Leftrightarrow: "⇔",
  uparrow: "↑", downarrow: "↓", mapsto: "↦",
};

/* 清洗从其他软件复制来的大纲：去 BOM/零宽/乱码字符，全角空格转半角，剥离 Markdown 与 LaTeX 残留 */
function sanitizeOutline(text) {
  return String(text)
    .replace(/\r\n?|\u2028|\u2029/g, "\n")                  // 统一换行
    .replace(/[\uFEFF\u200B-\u200F\u2060\u00AD\uFFFD]/g, "") // BOM / 零宽字符 / 软连字符 / 乱码替换符
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g, "")       // 控制字符
    .split("\n")
    .map(l => {
      l = l.replace(/[\u3000\u00A0]/g, " ");                 // 全角 / 不换行空格 → 半角
      const ind = (l.match(/^[ \t]*/) || [""])[0];           // 保留缩进（用于判定阶段层级）
      const rest = l.slice(ind.length)
        .replace(/\*\*|__|~~|`/g, "")                        // 粗体、下划线、删除线、反引号
        /* 复制自 AI 回答的 LaTeX 残留（如 $\rightarrow$）：还原符号 → 剥离定界符 → 丢弃残余命令 */
        .replace(/\\text(bf|it|rm|sf|tt)?\{([^}]*)\}/g, "$2")    // \text{...} / \textbf{...} 只取内容
        .replace(/\\\(|\\\)|\\\[|\\\]/g, "")                 // 公式定界符 \( \) \[ \]
        .replace(/\$\$?([^$]*)\$\$?/g, "$1")                 // $...$ / $$...$$ 定界符（保留内容）
        .replace(/\\([a-zA-Z]+)/g, (m, c) => LATEX_MAP[c] || "") // \命令 → 符号，其余丢弃
        .replace(/^#{1,6}\s*/, "")                           // Markdown 标题 #
        .replace(/^(?:[-*+•·→←↔⇔⇒⟶↑↓]\s*)+/, "")            // 行首列表符号（含箭头，可重复）
        .replace(/^\*+|\*+$/g, "")                           // 残留的成对 * 强调
        .replace(/[ \t]{2,}/g, " ")                          // 折叠多余空格
        .replace(/^[ \t]+|[ \t]+$/g, "");                    // 去除两端空白
      return ind + rest;
    })
    .filter(l => l.trim())                                   // 丢弃纯空白行
    .join("\n");
}

function parseOutline(text, topOnly, colonOnly) {
  text = sanitizeOutline(text);
  const raw = [];
  text.split(/\r?\n/).forEach(l => {
    if (!l.trim()) return;
    const indent = l.match(/^[ \t]*/)[0].replace(/\t/g, "    ").length;
    /* 去行首编号/符号；开启「只取冒号前」时，再取第一个冒号（「：」或「: 」）之前的标题 */
    let name = l.trim().replace(BULLET_RE, "").replace(/^[:：]\s*/, "");
    if (colonOnly) name = name.split(/：|:\s/)[0];
    name = name.replace(/[:：]\s*$/, "").trim();
    if (name) raw.push({ indent, name });
  });
  if (!raw.length) return [];
  const minIndent = Math.min(...raw.map(r => r.indent));
  raw.forEach(r => r.level = r.indent === minIndent ? 0 : 1);

  /* 只保留大标题：仅取最外层一级条目，忽略其下所有子条目 */
  if (topOnly) return raw.filter(r => r.level === 0).map(r => ({ name: r.name, line: "" }));

  const out = [];
  for (let i = 0; i < raw.length; i++) {
    const cur = raw[i];
    const hasChildren = i + 1 < raw.length && raw[i + 1].level > cur.level;
    if (cur.level === 0 && hasChildren) {
      let j = i + 1;
      while (j < raw.length && raw[j].level > 0) { out.push({ name: raw[j].name, line: cur.name }); j++; }
      i = j - 1;
    } else {
      out.push({ name: cur.name, line: "" });
    }
  }
  return out;
}

  let parsed = [];   // [{ name, line, status, priority, on }]

  /* 单行「所属阶段」下拉：未设置 + 项目/预览里已有的全部阶段 + ＋自定义 */
  const lineOptsFor = (val) => {
    const v = (val || "").trim();
    const known = [...new Set([...items().map(i => i.line), ...parsed.map(t => t.line)]
      .map(x => (x || "").trim()).filter(Boolean))];
    const opts = known.map(n => `<option value="${esc(n)}"${n === v ? " selected" : ""}>${esc(n)}</option>`).join("");
    return `<option value=""${v ? "" : " selected"}>未设置</option>${opts}`
      + `<option value="__custom__"${v && !known.includes(v) ? " selected" : ""}>＋ 自定义…</option>`;
  };

  /* 把预览区的当前编辑内容写回 parsed（名称 / 阶段 / 状态 / 优先级 / 截止 / 是否导入） */
  const collect = () => {
    preview.querySelectorAll(".imp-row").forEach(r => {
      const i = +r.dataset.i;
      if (!parsed[i]) return;
      parsed[i].name = r.querySelector(".imp-name").value;
      const pick = r.querySelector(".imp-sel-line-pick");
      parsed[i].line = pick.value === "__custom__" ? r.querySelector(".imp-sel-line").value.trim() : pick.value;
      parsed[i].status = r.querySelector(".imp-sel-status").value;
      parsed[i].priority = r.querySelector(".imp-sel-prio").value;
      parsed[i].created = r.querySelector(".imp-date").value;
      parsed[i].on = r.querySelector(".imp-check").checked;
    });
  };

  /* 刷新各分组已选数量、总待导入数量与按钮状态 */
  const refreshCounts = () => {
    let total = 0;
    preview.querySelectorAll(".imp-group").forEach(g => {
      const rows = [...g.querySelectorAll(".imp-row")];
      const on = rows.filter(r => r.querySelector(".imp-check").checked).length;
      total += on;
      const cnt = g.querySelector(".imp-gcount");
      if (cnt) cnt.textContent = `已选 ${on}/${rows.length}`;
      const gc = g.querySelector(".imp-gcheck");
      if (gc) { gc.checked = on > 0 && on === rows.length; gc.indeterminate = on > 0 && on < rows.length; }
    });
    const t = preview.querySelector(".imp-total");
    if (t) t.textContent = `待导入 ${total} 条`;
    okBtn.disabled = total === 0;
  };

  const updatePreview = () => {
    parsed = parseOutline(ta.value, topOnlyEl.checked, colonOnlyEl.checked).map(t => ({ ...t, status: "todo", priority: "常规", created: "", on: true }));
    renderPreview();
  };
  ta.oninput = updatePreview;
  topOnlyEl.onchange = updatePreview;
  colonOnlyEl.onchange = updatePreview;

  const renderPreview = () => {
    if (!parsed.length) {
      preview.innerHTML = `<div class="imp-more">粘贴任务文本后在此预览</div>`;
      okBtn.disabled = true;
      return;
    }
    const groups = [];
    const index = {};
    parsed.forEach((t, i) => {
      const g = t.line || "导入";
      if (!(g in index)) { index[g] = groups.length; groups.push({ name: g, rows: [] }); }
      groups[index[g]].rows.push({ ...t, i });
    });
    preview.innerHTML = `<div class="imp-count">识别到 ${parsed.length} 条任务 · ${groups.length} 个阶段　<span class="imp-total"></span></div>` +
      groups.map(g => `<div class="imp-group">
        <div class="imp-group-head">
          <input type="checkbox" class="imp-gcheck" data-tip="全选 / 取消本组" checked>
          <span class="imp-group-title">${esc(g.name)}</span>
          <span class="imp-gcount"></span>
        </div>
        ${g.rows.map(r => `<div class="imp-row" data-i="${r.i}">
          <div class="imp-line1">
            <input type="checkbox" class="imp-check" data-tip="是否导入此任务" checked>
            <input class="imp-name" value="${esc(r.name)}" data-tip="${esc(r.name)}" placeholder="任务名称" />
          </div>
          <div class="imp-line2">
            <span class="imp-dlabel">阶段</span>
            <select class="imp-sel-line-pick" data-tip="所属阶段">${lineOptsFor(r.line)}</select>
            <input class="imp-sel-line" placeholder="输入新阶段名" data-tip="自定义所属阶段" value="${esc(r.line || "")}" hidden />
            <select class="imp-sel-status" data-tip="状态">${statusOpts.replace(`value="${esc(r.status)}"`, `value="${esc(r.status)}" selected`)}</select>
            <select class="imp-sel-prio" data-tip="优先级">${prioOpts.replace(`value="${esc(r.priority)}"`, `value="${esc(r.priority)}" selected`)}</select>
            <span class="imp-dlabel">截止</span>
            <input type="date" class="imp-date" data-tip="截止时间" value="${esc(r.created || "")}" />
          </div>
        </div>`).join("")}
      </div>`).join("");

    patchSelects(preview);   // 预览区新生成的 select 也换成自定义浮层

    /* 绑定行内交互（不整体重绘，避免输入时失焦） */
    preview.querySelectorAll(".imp-name").forEach(inp => inp.oninput = () => {
      const i = +inp.closest(".imp-row").dataset.i;
      if (parsed[i]) parsed[i].name = inp.value;
    });
    /* 阶段逐条可改：下拉直接选已有阶段；选「＋ 自定义…」则切换为输入框输入新阶段 */
    preview.querySelectorAll(".imp-sel-line-pick").forEach(sel => {
      sel.onchange = () => {
        const row = sel.closest(".imp-row");
        const txt = row.querySelector(".imp-sel-line");
        if (sel.value === "__custom__") { txt.hidden = false; txt.value = ""; txt.focus(); return; }
        txt.hidden = true;
        const i = +row.dataset.i;
        if (parsed[i]) parsed[i].line = sel.value;
        collect(); renderPreview();
      };
    });
    preview.querySelectorAll(".imp-sel-line").forEach(inp => {
      inp.oninput = () => {
        const i = +inp.closest(".imp-row").dataset.i;
        if (parsed[i]) parsed[i].line = inp.value;
      };
      inp.onchange = () => { collect(); renderPreview(); };
    });
    preview.querySelectorAll(".imp-check").forEach(cb => cb.onchange = () => {
      cb.closest(".imp-row").classList.toggle("off", !cb.checked);
      refreshCounts();
    });
    preview.querySelectorAll(".imp-gcheck").forEach(gc => gc.onchange = () => {
      gc.closest(".imp-group").querySelectorAll(".imp-check").forEach(cb => {
        cb.checked = gc.checked;
        cb.closest(".imp-row").classList.toggle("off", !cb.checked);
      });
      refreshCounts();
    });
    refreshCounts();
  };

  updatePreview();
  ta.focus();

  overlay.onclick = e => { if (e.target === overlay) close(); };
  overlay.querySelectorAll(".js-x").forEach(b => b.onclick = close);
  overlay.querySelector("#imp-cancel").onclick = close;
  okBtn.onclick = () => {
    collect();

    if (!toAdd.length) { toast("没有勾选任何任务"); return; }

    let nextId = Math.max(Date.now(), ...list.map(i => +i.id || 0));
    toAdd.forEach(t => list.push({
      id: ++nextId, name: t.name.trim(), status: t.status, owner: "本人",

    }));
    persist(); close();
    toast(`已导入 ${toAdd.length} 条任务`);
  };
}

/* ---- backup & restore ---- */
function exportBackup() {
  const payload = {
    app: "lunwen-kanban",
    version: 1,
    exportedAt: new Date().toISOString(),
    data,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0, 10).replace(/-/g, "");
  a.href = URL.createObjectURL(blob);
  a.download = `kanban-backup-${stamp}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast("备份已导出为 JSON 文件");
}

    </div>

    <div class="bk-store">
      <div class="bk-store-row"><span>存储位置</span><b>浏览器本地存储</b><span>· 导出的备份在浏览器下载文件夹</span></div>
    </div>

    <div class="modal-actions">
      <div class="spacer"></div>
      <button class="btn ghost" id="bk-export">导出备份</button>
      <button class="btn ghost" id="bk-restore">恢复备份</button>
    </div></div>`;
  document.body.appendChild(overlay);

  const close = () => overlay.remove();
  const pickFile = () => {
    const input = $("#file-restore");
    input.value = "";
    input.click();
  };
  /* 拖入 / 粘贴拿到文件后：先收起本面板，再走原有的「覆盖恢复」二次确认 */
  const takeFile = f => { close(); restoreBackup(f); };

  const drop = overlay.querySelector("#bk-drop");
  const enter = e => { e.preventDefault(); drop.classList.add("is-over"); };
  const leave = e => { e.preventDefault(); drop.classList.remove("is-over"); };
  drop.addEventListener("dragenter", enter);
  drop.addEventListener("dragover", enter);
  drop.addEventListener("dragleave", leave);
  drop.addEventListener("dragend", leave);
  drop.addEventListener("drop", e => {
    e.preventDefault();
    drop.classList.remove("is-over");
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) takeFile(f);
    else toast("没有读到文件，请拖入导出的 JSON 备份", true);
  });
  drop.onclick = pickFile;
  drop.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pickFile(); } };

  /* 粘贴：剪贴板里是文件就直接用；是文本且像备份 JSON 就包装成文件 */
  overlay.addEventListener("paste", e => {
    const cd = e.clipboardData;
    if (!cd) return;
    const f = cd.files && cd.files[0];
    if (f) { e.preventDefault(); takeFile(f); return; }
    const text = cd.getData("text/plain") || "";
    if (/"projects"\s*:/.test(text)) {
      e.preventDefault();
      takeFile(new File([text], "pasted-backup.json", { type: "application/json" }));
    }
  });

  overlay.onclick = e => { if (e.target === overlay) close(); };
  overlay.querySelectorAll(".js-x").forEach(b => b.onclick = close);
  overlay.querySelector("#bk-export").onclick = () => { exportBackup(); close(); };
  overlay.querySelector("#bk-restore").onclick = () => { pickFile(); close(); };
}

function restoreBackup(file) {
  const reader = new FileReader();
  reader.onerror = () => toast("恢复失败：文件读取失败");
  reader.onload = () => {
    let parsed;
    try { parsed = JSON.parse(reader.result); } catch (e) { return toast("恢复失败：不是合法的 JSON 文件"); }
    const d = (parsed && typeof parsed === "object" && !Array.isArray(parsed) && "data" in parsed) ? parsed.data : parsed;
    const looksValid = Array.isArray(d) || (d && typeof d === "object" && Array.isArray(d.projects));
    if (!looksValid) return toast("恢复失败：备份文件缺少 projects 字段");
    /* 先做深度规范化与校验，不合格就直接拒绝，不进入覆盖确认弹窗 */
    const incoming = normalizeData(d);
    if (!incoming.projects.length) return toast("恢复失败：备份里没有可用的项目");
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML = `<div class="modal" style="width:380px">
      <button class="modal-x js-x" data-tip="关闭">${X_SVG}</button>
      <h2>恢复备份</h2>
      <div class="sub">即将用备份数据<b>覆盖</b>当前全部项目与任务，此操作不可撤销。确定恢复？</div>
      <div class="modal-actions">
        <div class="spacer"></div>
        <button class="btn ghost" id="rb-cancel">取消</button>
        <button class="btn danger" id="rb-ok">覆盖恢复</button>
      </div></div>`;
    document.body.appendChild(overlay);
    const close = () => overlay.remove();
    overlay.onclick = e => { if (e.target === overlay) close(); };
    overlay.querySelectorAll(".js-x").forEach(b => b.onclick = close);
    overlay.querySelector("#rb-cancel").onclick = close;
    overlay.querySelector("#rb-ok").onclick = () => {
      data = incoming;
      animateRows = true;
      persist(); close();
      toast("备份已恢复");
    };
  };
  reader.readAsText(file);
}

/* 自定义悬停提示：鼠标跟随显示，键盘聚焦同样能触发，读屏通过 aria-describedby 关联 */
let tipEl = null;
let tipAnchor = null;
function ensureTip() {
  if (!tipEl) {
    tipEl = document.createElement("div");
    tipEl.id = "app-tip";
    tipEl.className = "tip";
    tipEl.setAttribute("role", "tooltip");
    document.body.appendChild(tipEl);
  }
  return tipEl;
}
function showTip(text, x, y) {
  const el = ensureTip();
  if (el.textContent !== text) el.textContent = text;
  el.style.display = "block";
  const r = el.getBoundingClientRect();
  const left = Math.max(6, Math.min(x - r.width / 2, window.innerWidth - r.width - 6));
  const top = y - r.height - 10 < 6 ? y + 16 : y - r.height - 10;
  el.style.left = `${left}px`;
  el.style.top = `${top}px`;
}
function hideTip() {
  if (tipEl) tipEl.style.display = "none";
  if (tipAnchor) { tipAnchor.removeAttribute("aria-describedby"); tipAnchor = null; }
}
/* 键盘聚焦时按元素位置展示，并把提示与元素用 aria-describedby 关联起来 */
function showTipFor(el) {
  const text = el.getAttribute("data-tip");
  if (!text) return;
  if (tipAnchor && tipAnchor !== el) tipAnchor.removeAttribute("aria-describedby");
  tipAnchor = el;
  el.setAttribute("aria-describedby", "app-tip");
  const r = el.getBoundingClientRect();
  showTip(text, r.left + r.width / 2, r.top);
}

/* 全局统一悬停提示：所有 data-tip 元素共用日历同款的提示样式。
   事件委托 + mouseover，比浏览器原生提示更早触发，因此不会出现默认样式的悬停提示 */
document.addEventListener("mouseover", e => {
  if (tipAnchor) return;   // 键盘聚焦期间不让鼠标抢走提示
  const el = e.target instanceof Element ? e.target.closest("[data-tip]") : null;
  const text = el ? el.getAttribute("data-tip") : "";
  if (text) showTip(text, e.clientX, e.clientY);
  else hideTip();
});
let tipRaf = 0, tipPt = null;
document.addEventListener("mousemove", e => {
  if (tipAnchor || !tipEl || tipEl.style.display !== "block") return;
  tipPt = e;
  if (tipRaf) return;
  tipRaf = requestAnimationFrame(() => {
    tipRaf = 0;
    const el = tipPt.target instanceof Element ? tipPt.target.closest("[data-tip]") : null;
    const text = el ? el.getAttribute("data-tip") : "";
    if (text) showTip(text, tipPt.clientX, tipPt.clientY);
  });
}, { passive: true });
document.addEventListener("mouseleave", hideTip);
window.addEventListener("blur", hideTip);
/* 键盘路径：聚焦带提示的元素时显示，失焦隐藏 */
document.addEventListener("focusin", e => {
  const el = e.target instanceof Element ? e.target.closest("[data-tip]") : null;
  if (el) showTipFor(el); else hideTip();
});
document.addEventListener("focusout", hideTip);

/* ---- 弹窗统一无障碍与焦点管理 ----
   任何 .overlay 被挂到 body 上都会自动补上 role/aria，并接管：
   Tab 在弹窗内循环、Esc 关闭栈顶弹窗、关闭后把焦点还给来源元素 */
const dialogStack = [];
let dlgSeq = 0;
let lastFocus = null;
document.addEventListener("focusin", e => {
  if (!(e.target instanceof Element && e.target.closest(".overlay"))) lastFocus = e.target;
}, true);

function dialogFocusables(root) {
  return [...root.querySelectorAll("a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex='-1'])")]
    .filter(el => el.offsetParent !== null || el === document.activeElement);
}
function closeTopDialog() {
  const entry = dialogStack[dialogStack.length - 1];
  if (entry) entry.overlay.remove();   // 移除动作由下面的观察者统一收尾
}
document.addEventListener("keydown", e => {
  if (!dialogStack.length) return;
  if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); closeTopDialog(); return; }
  if (e.key !== "Tab") return;
  const top = dialogStack[dialogStack.length - 1].overlay;
  const list = dialogFocusables(top);
  const modal = top.querySelector(".modal");
  if (!list.length) { e.preventDefault(); if (modal) modal.focus(); return; }
  const first = list[0], last = list[list.length - 1];
  const active = document.activeElement;
  if (active === modal || !top.contains(active)) { e.preventDefault(); (e.shiftKey ? last : first).focus(); }
  else if (e.shiftKey && active === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && active === last) { e.preventDefault(); first.focus(); }
}, true);

const dialogObserver = new MutationObserver(muts => {
  muts.forEach(m => m.addedNodes.forEach(n => {
    if (n.nodeType !== 1 || !n.classList || !n.classList.contains("overlay")) return;
    const modal = n.querySelector(".modal");
    if (!modal) return;
    const h2 = modal.querySelector("h2");
    if (h2) { h2.id = "dlg-title-" + (++dlgSeq); modal.setAttribute("aria-labelledby", h2.id); }
    modal.setAttribute("role", "dialog");
    modal.setAttribute("aria-modal", "true");
    modal.setAttribute("tabindex", "-1");
    n.querySelectorAll(".modal-x").forEach(b => { if (!b.hasAttribute("aria-label")) b.setAttribute("aria-label", "关闭"); });
    dialogStack.push({ overlay: n, prev: lastFocus });
    requestAnimationFrame(() => {
      if (!n.contains(document.activeElement) && modal.isConnected) {
        try { modal.focus({ preventScroll: true }); } catch (e) {}
      }
    });
  }));
  muts.forEach(m => m.removedNodes.forEach(n => {
    if (n.nodeType !== 1 || !n.classList || !n.classList.contains("overlay")) return;
    let entry = null;
    for (let i = dialogStack.length - 1; i >= 0; i--) {
      if (dialogStack[i].overlay === n) { entry = dialogStack.splice(i, 1)[0]; break; }
    }
    /* 关闭后把焦点还给来源元素；来源已被删除（如删掉的任务卡）则不动。
       标记了 noRefocus 的弹窗（确认提交型，如新建/重命名项目）不还焦点，
       否则用户再按一次回车就会重新激活来源按钮、把同一个弹窗又打开。 */
    if (entry && n.dataset.noRefocus !== "1" && entry.prev && document.contains(entry.prev) && typeof entry.prev.focus === "function"
        && (document.activeElement === document.body || document.activeElement === null)) {
      try { entry.prev.focus({ preventScroll: true }); } catch (e) {}
    }
  }));
});
dialogObserver.observe(document.body, { childList: true });

/* 距离下次任务倒计时
   - 默认：按截止时间升序，显示最近一个未完成任务
   - 点击日历某个日期后：自动切换为距离该日期还有多少天，再点一次取消选中
   所有状态统一为「数字+标题 / 副标题」两行结构，固定高度不随内容变化 */
function renderCountdown() {
  const box = $("#cd-box");
  const today = todayStr();
  const diffDays = ds => Math.round((new Date(ds) - new Date(today)) / 86400000);
  const fill = (num, title, sub, empty) => {
    box.className = empty ? "cd-box is-empty" : "cd-box";
    box.innerHTML = `
      <div class="cd-row1">
        ${num !== "" ? `<div class="cd-num">${num}</div>` : ""}
        <div class="cd-title">${title}</div>
      </div>
      <div class="cd-sub" data-tip="${esc(sub)}">${esc(sub)}</div>`;
  };

  // 日历点击了某个日期 → 显示距离该日期的倒计时
  if (calSelected) {
    const diff = diffDays(calSelected);
    const [, m, d] = calSelected.split("-").map(Number);
    const list = items().filter(i => String(i.created || "") === calSelected);
    const num = diff === 0 ? "今天" : Math.abs(diff);
    const title = diff > 0 ? `天后 · 距 ${m}月${d}日` : diff === 0 ? `${m}月${d}日 · 当天` : `天前 · ${m}月${d}日 已过`;
    fill(num, title, list.length ? `${list.length} 个任务截止` : "这天没有截止的任务", !list.length);
    return;
  }

  // 默认：按时间排序，显示最近一个未完成任务的倒计时
  const upcoming = items()
    .filter(i => i.status !== "done" && /^\d{4}-\d{2}-\d{2}$/.test(String(i.created || "")) && String(i.created) >= today)
    .sort((a, b) => String(a.created).localeCompare(String(b.created)));
  if (!upcoming.length) {
    fill("", "暂无待办任务", "没有设置了日期的未完成任务", true);
    return;
  }
  const next = upcoming[0];
  const diff = diffDays(next.created);
  fill(
    diff === 0 ? "今天" : diff,
    diff === 0 ? "有任务截止" : "天后 · 距下次任务",
    `${next.name} · ${next.created.slice(5).replace("-", "/")}`,
    false
  );
}

function renderCalendar() {
  hideTip();   // 列表重建时收起悬停提示，避免残留
  renderCountdown();
  const first = new Date(calYear, calMonth, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const daysPrev = new Date(calYear, calMonth, 0).getDate();
  $("#cal-title").textContent = `${calYear} 年 ${calMonth + 1} 月`;

  // date -> { count, dots: [colors] } from task deadlines (up to 3 dots)
  const marks = {};
  items().forEach(i => {
    const v = String(i.created || "");
    if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) return;
    if (!marks[v]) marks[v] = { count: 0, dots: [] };
    marks[v].count++;
    if (marks[v].dots.length < 3) marks[v].dots.push(prioOf(i.priority).accent);
  });

  const today = todayStr();
  let cells = "";
  for (let i = 0; i < 42; i++) {
    const dayNum = i - startDow + 1;
    const inMonth = dayNum >= 1 && dayNum <= daysInMonth;
    let y = calYear, m = calMonth, d = dayNum;
    if (dayNum < 1) { m--; if (m < 0) { m = 11; y--; } d = daysPrev + dayNum; }
    else if (dayNum > daysInMonth) { d = dayNum - daysInMonth; m++; if (m > 11) { m = 0; y++; } }
    const ds = calDateStr(y, m, d);
    const mark = marks[ds];
    const cls = ["cal-day", inMonth ? "" : "other", ds === today ? "today" : "", ds === calSelected ? "selected" : "", mark ? "has-mark" : ""].filter(Boolean).join(" ");
    cells += `<button type="button" class="${cls}" data-d="${ds}" ${inMonth ? "" : "disabled"} data-tip="${mark ? mark.count + " 个任务截止" : ""}">
      <span>${d}</span>
      <span class="dots">${(mark?.dots || []).map(c => `<i style="background:${c}"></i>`).join("")}</span>
    </button>`;
  }
  $("#cal-grid").innerHTML =
    WEEK.map(w => `<div class="cal-dow">${w}</div>`).join("") + cells;

  $("#cal-grid").querySelectorAll(".cal-day:not(:disabled)").forEach(btn =>
    btn.onclick = () => {
      const ds = btn.dataset.d;
      const [y, m] = ds.split("-").map(Number);
      if (y !== calYear || m - 1 !== calMonth) { calYear = y; calMonth = m - 1; }
      calSelected = calSelected === ds ? null : ds;
      renderCalendar();
    });

  // 右侧任务列表：选中日期的任务，未选中时显示今天的任务，按截止时间升序
  const focus = calSelected || today;
  let list = items()
    .filter(i => String(i.created || "") === focus)
    .sort((a, b) => String(a.created).localeCompare(String(b.created)));
  /* 该日期没有截止任务时，改为展示「即将截止」的任务（不限状态，按截止时间升序）
     基准是「选中的日期」（未选中时为今天），只列不早于该日期的任务，例如点了 26 号就不该再出现 25 号的 */
  let head = "";
  if (!list.length) {
    list = items()
      .filter(i => /^\d{4}-\d{2}-\d{2}$/.test(String(i.created || "")) && String(i.created) >= focus)
      .sort((a, b) => String(a.created).localeCompare(String(b.created)));
    head = (calSelected ? "这一天没有截止的任务" : "今天没有截止的任务") + (list.length ? " · 即将截止" : "");
  }
  const rows = list.map(i => {
    const dd = daysFromToday(String(i.created || ""));
    const when = dd > 0 ? `${dd} 天后` : dd === 0 ? "今天截止" : `已过期 ${-dd} 天`;
    return `<div class="cs-item" data-tip="${esc(i.name)}（${when}）">
      <button type="button" class="cs-name js-open" data-id="${i.id}">${esc(i.name)}</button>
      ${head ? `<span class="cs-date">${esc(String(i.created).slice(5))}</span>` : ""}
      <span class="badge" style="background:${tone(statusOf(i.status).color)};color:${toneText(statusOf(i.status).text)}">${statusOf(i.status).label}</span>
    </div>`;
  }).join("");
  $("#cs-list").innerHTML = rows
    ? (head ? `<div class="cs-empty">${head}</div>` : "") + rows
    : `<div class="cs-empty">${head || (calSelected ? "这一天没有截止的任务" : "今天没有截止的任务")}<br/>点击日历上的日期查看</div>`;
  $("#cs-list").querySelectorAll(".js-open").forEach(el =>
    el.onclick = () => openModal(items().find(i => i.id == el.dataset.id)));
}

function initCalendar() {
  const now = new Date();
  calYear = now.getFullYear();
  calMonth = now.getMonth();
  $("#cal-prev").onclick = () => { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } renderCalendar(); };
  $("#cal-next").onclick = () => { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } renderCalendar(); };
  $("#cal-today").onclick = () => {
    const now = new Date();
    calYear = now.getFullYear();
    calMonth = now.getMonth();
    calSelected = null;   // 只跳回今天所在的月份，不把今天标记为「选中」
    renderCalendar();
  };
  tickClock();
  setInterval(tickClock, 60000);
}

    if (on) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current");

}

    const dir = (e.key === "ArrowRight" || e.key === "ArrowDown") ? 1 : -1;
    const next = tabs[(i + dir + tabs.length) % tabs.length];
    selectView(next.dataset.view, next);
  };
});

/* ---- 自定义下拉列表：拦掉浏览器原生的展开选项，改用统一浮层 ---- */
let dselPop = null;
function closeDSelect() { if (dselPop) { dselPop.remove(); dselPop = null; } }

function openDSelect(sel) {
  closeDSelect();
  const opts = [...sel.options];
  if (!opts.length) return;
  const pop = document.createElement("div");
  pop.className = "dsel-pop";
  pop.innerHTML = opts.map(o =>
    `<button type="button" class="dsel-item ${o.value === sel.value ? "active" : ""}" data-v="${esc(o.value)}">${esc(o.textContent)}</button>`
  ).join("");
  document.body.appendChild(pop);
  const r = sel.getBoundingClientRect();
  pop.style.minWidth = `${r.width}px`;
  pop.style.left = `${Math.max(6, Math.min(r.left, window.innerWidth - pop.offsetWidth - 6))}px`;
  const h = pop.offsetHeight;
  pop.style.top = `${r.bottom + h + 6 > window.innerHeight ? Math.max(6, r.top - h - 6) : r.bottom + 6}px`;
  pop.querySelectorAll(".dsel-item").forEach(it => it.onclick = () => {
    sel.value = it.dataset.v;                                    // 交给原生 select 保存取值
    sel.dispatchEvent(new Event("change", { bubbles: true }));   // 触发原有 onchange 逻辑
    closeDSelect();
  });
  dselPop = pop;
}

/* 给页面上（含后插入的）每个 select 装上自定义浮层 */
function patchSelects(root = document) {
  root.querySelectorAll("select").forEach(sel => {
    if (sel.dataset.dsel) return;
    sel.dataset.dsel = "1";
    sel.addEventListener("mousedown", e => { e.preventDefault(); openDSelect(sel); });
  });
}
/* 动态插入的 select（如导入大纲预览、弹窗）自动补装，避免遗漏 */
new MutationObserver(muts => {
  muts.forEach(m => m.addedNodes.forEach(n => {
    if (n.nodeType !== 1) return;
    if (n.tagName === "SELECT") patchSelects(n.parentNode || n);
    else if (n.querySelector && n.querySelector("select")) patchSelects(n);
  }));
}).observe(document.body, { childList: true, subtree: true });

/* 全局安全网：未捕获异常不再静默失败，而是给出可读提示（3 秒内相同信息只报一次） */
window.__booted = true;
let lastErrAt = 0, lastErrMsg = "";
function reportFatal(msg) {
  const now = Date.now();
  if (msg === lastErrMsg && now - lastErrAt < 3000) return;
  lastErrMsg = msg; lastErrAt = now;
  try { toast(msg, true); } catch (e) {}
}
window.addEventListener("error", e => {
  if (window.__booted) reportFatal("运行出错：" + (e.message || "未知错误"));
});
